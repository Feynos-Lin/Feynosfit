          package com.feynos.fit.data

          /**
           * Etekcity ESN00 "Smart Nutrition Scale" Bluetooth LE protocol.
           *
           * Based on the reverse-engineering work in github.com/hertzg/metekcity (MIT licence, (c) 2020
           * George Kotchlamazashvili).
           *
           * Every packet: FE EF C0 A2 | type | length | payload[length] | checksum
           * checksum = (type + length + sum(payload)) & 0xFF
           *
           * Measurement (type 0xD0, 5 bytes): sign (0 = +, 1 = −) | value uint16 big-endian | unit | settled
           *  - grams / ml values are ×10, ounce-based values are ×100
           */
          object Esn00Protocol {
              const val DEVICE_NAME = "Etekcity Nutrition Scale"
              const val SERVICE_UUID = "00001910-0000-1000-8000-00805f9b34fb"
              const val NOTIFY_UUID = "00002c12-0000-1000-8000-00805f9b34fb"
              const val WRITE_UUID = "00002c11-0000-1000-8000-00805f9b34fb"
              const val CCCD_UUID = "00002902-0000-1000-8000-00805f9b34fb"

              private val HEADER = byteArrayOf(0xFE.toByte(), 0xEF.toByte(), 0xC0.toByte(), 0xA2.toByte())

              const val TYPE_SET_UNIT = 0xC0
              const val TYPE_MEASUREMENT = 0xD0
              const val TYPE_UNIT_STATE = 0xD1

              const val UNIT_GRAM = 0
              const val UNIT_LB_OZ = 1
              const val UNIT_ML_WATER = 2
              const val UNIT_FLOZ_WATER = 3
              const val UNIT_ML_MILK = 4
              const val UNIT_FLOZ_MILK = 5
              const val UNIT_OZ = 6

              data class Packet(val type: Int, val payload: ByteArray)

              data class Reading(
                  /** Weight converted to grams. */
                  val grams: Double,
                  /** What the scale's display shows, e.g. "450 g" or "5.7 oz". */
                  val display: String,
                  val unit: Int,
                  val settled: Boolean,
              )

              /** Parse every complete packet in [data] (a notification may hold one or several). */
              fun parse(data: ByteArray): List<Packet> {
                  val out = ArrayList<Packet>()
                  var i = 0
                  while (i + 7 <= data.size) {
                      if (data[i] != HEADER[0] || data[i + 1] != HEADER[1] || data[i + 2] != HEADER[2] || data[i + 3] != HEADER[3]) {
                          i++
                          continue
                      }
                      val type = data[i + 4].toInt() and 0xFF
                      val len = data[i + 5].toInt() and 0xFF
                      val end = i + 6 + len
                      if (end >= data.size) break
                      val payload = data.copyOfRange(i + 6, end)
                      val checksum = data[end].toInt() and 0xFF
                      var sum = type + len
                      for (b in payload) sum += b.toInt() and 0xFF
                      if ((sum and 0xFF) == checksum) out.add(Packet(type, payload))
                      i = end + 1
                  }
                  return out
              }

              fun reading(p: Packet): Reading? {
                  if (p.type != TYPE_MEASUREMENT || p.payload.size < 5) return null
                  val negative = p.payload[0].toInt() != 0
                  val raw = ((p.payload[1].toInt() and 0xFF) shl 8) or (p.payload[2].toInt() and 0xFF)
                  val v = if (negative) -raw else raw
                  val unit = p.payload[3].toInt() and 0xFF
                  val settled = p.payload[4].toInt() != 0
                  val grams: Double
                  val display: String
                  when (unit) {
                      UNIT_GRAM -> { grams = v / 10.0; display = "${(v / 10.0).f1()} g" }
                      UNIT_ML_WATER -> { grams = v / 10.0; display = "${(v / 10.0).f1()} ml" }
                      UNIT_ML_MILK -> { grams = v / 10.0 * 1.03; display = "${(v / 10.0).f1()} ml (milk)" }
                      UNIT_OZ -> { grams = v / 100.0 * 28.3495; display = "${(v / 100.0).f1()} oz" }
                      UNIT_LB_OZ -> {
                          val oz = v / 100.0
                          grams = oz * 28.3495
                          val lb = (kotlin.math.abs(oz) / 16).toInt()
                          val rem = kotlin.math.abs(oz) - lb * 16
                          display = (if (oz < 0) "-" else "") + "$lb lb ${rem.f1()} oz"
                      }
                      UNIT_FLOZ_WATER -> { grams = v / 100.0 * 29.5735; display = "${(v / 100.0).f1()} fl oz" }
                      UNIT_FLOZ_MILK -> { grams = v / 100.0 * 29.5735 * 1.03; display = "${(v / 100.0).f1()} fl oz (milk)" }
                      else -> return null
                  }
                  return Reading(grams, display, unit, settled)
              }

              fun build(type: Int, payload: ByteArray): ByteArray {
                  val out = ByteArray(4 + 2 + payload.size + 1)
                  System.arraycopy(HEADER, 0, out, 0, 4)
                  out[4] = type.toByte()
                  out[5] = payload.size.toByte()
                  System.arraycopy(payload, 0, out, 6, payload.size)
                  var sum = type + payload.size
                  for (b in payload) sum += b.toInt() and 0xFF
                  out[out.size - 1] = (sum and 0xFF).toByte()
                  return out
              }

              /** Switch the scale's display unit (0 = grams). */
              fun setUnit(unit: Int): ByteArray = build(TYPE_SET_UNIT, byteArrayOf(unit.toByte()))
          }
