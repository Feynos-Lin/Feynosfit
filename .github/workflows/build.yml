          # Fixed signing key so each new build installs as an update over the last one
          echo '' | base64 -d > app/debug.keystore
          echo "Generated $(find . -type f | wc -l) project files"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        shell: bash
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        working-directory: FeynosFit
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        shell: bash
        run: |
          mkdir -p dist
          cp FeynosFit/app/build/outputs/apk/release/app-release.apk "dist/FeynosFit-v${APP_VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          ls -la dist

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: FeynosFit-v${{ env.APP_VERSION }}-build${{ github.run_number }}
          path: dist/*.apk

      - name: Publish release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Feynos Fit v${{ env.APP_VERSION }} (build ${{ github.run_number }})
          body: |
            Download the .apk below on your phone and open it to install or update.
            Built from commit ${{ github.sha }}.
          files: dist/*.apk
          make_latest: true
