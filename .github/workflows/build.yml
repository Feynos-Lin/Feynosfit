          private fun prettyRange(start: String, end: String): String {
              val f = DateTimeFormatter.ofPattern("MMM d", Locale.getDefault())
              val s = LocalDate.parse(start)
              val e = LocalDate.parse(end)
              return if (s == e) s.format(f) else "${s.format(f)} – ${e.format(f)}"
          }

