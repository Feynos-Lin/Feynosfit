          sealed class Screen {
              data class AddFood(val date: String, val meal: Int) : Screen()
              data class AddExercise(val date: String) : Screen()
              data class EditFood(val id: String?, val barcode: String = "") : Screen()
              data object MyFoods : Screen()
              data object Recipes : Screen()
              data class EditRecipe(val id: String?) : Screen()
              data object Goals : Screen()
              data object Settings : Screen()
              data class Nutrition(val date: String) : Screen()
              data object Weight : Screen()
              data object Health : Screen()
              data object Scale : Screen()
          }

          class Nav {
              val stack = mutableStateListOf<Screen>()
              fun push(s: Screen) {
                  stack.add(s)
              }

              fun pop() {
                  if (stack.isNotEmpty()) stack.removeAt(stack.lastIndex)
              }
          }

