          package com.feynos.fit.data

          import android.content.Context
          import android.content.SharedPreferences
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.IOException
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder

          /**
           * Client for the self-hosted Feynos Fit friends & challenges server (see server/ in the repo).
           * Only step totals and a display name are ever sent. The session is kept in its own private
           * preferences file, so it never ends up in the app's backup export.
           */
          object Social {

              // ---------------------------------------------------------------- session

              data class Session(val server: String, val token: String, val username: String, val displayName: String, val friendCode: String)

              private fun prefs(ctx: Context): SharedPreferences = ctx.applicationContext.getSharedPreferences("social", Context.MODE_PRIVATE)

              fun session(ctx: Context): Session? {
                  val p = prefs(ctx)
                  val token = p.getString("token", null) ?: return null
                  val server = p.getString("server", null) ?: return null
                  return Session(server, token, p.getString("username", "") ?: "", p.getString("displayName", "") ?: "", p.getString("friendCode", "") ?: "")
              }

              fun lastServer(ctx: Context): String = prefs(ctx).getString("server", "") ?: ""

              private fun save(ctx: Context, server: String, token: String, user: JSONObject) {
                  prefs(ctx).edit()
                      .putString("server", server)
                      .putString("token", token)
                      .putString("username", user.optString("username"))
                      .putString("displayName", user.optString("displayName"))
                      .putString("friendCode", user.optString("friendCode"))
                      .apply()
              }

              fun signOutLocally(ctx: Context) {
                  prefs(ctx).edit().remove("token").remove("username").remove("displayName").remove("friendCode").apply()
              }

              // ---------------------------------------------------------------- models

              data class Person(val id: String, val username: String, val displayName: String)

              data class Friend(val person: Person, val today: Int, val week: Int)

              data class FriendsInfo(val me: Friend, val friends: List<Friend>, val incoming: List<Person>, val outgoing: List<Person>)

              data class Standing(val person: Person, val total: Int, val today: Int)

              data class Challenge(
                  val id: String,
                  val name: String,
                  val start: String,
                  val end: String,
                  val creatorId: String,
                  val creatorName: String,
                  val myStatus: String,
                  val state: String,
                  val leaderboard: List<Standing>,
                  val invited: List<Person>,
              )

              class ApiException(val status: Int, message: String) : IOException(message)

              // ---------------------------------------------------------------- HTTP

              /** Accepts "fit.example.com" or "https://fit.example.com/" and returns "https://fit.example.com". */
              fun normaliseServer(input: String): String {
                  var s = input.trim().trimEnd('/')
                  if (s.isEmpty()) throw ApiException(0, "Enter your server's address")
                  if (!s.contains("://")) s = "https://$s"
                  if (!s.startsWith("https://", ignoreCase = true)) {
                      throw ApiException(0, "The server address must start with https:// so your password stays encrypted")
                  }
                  val u = runCatching { URL(s) }.getOrNull() ?: throw ApiException(0, "That doesn't look like a web address")
                  if (u.host.isNullOrBlank()) throw ApiException(0, "That doesn't look like a web address")
                  return s
              }

              private fun call(server: String, method: String, path: String, token: String?, body: JSONObject? = null): String {
                  val c = URL(server + "/api/v1" + path).openConnection() as HttpURLConnection
                  c.requestMethod = method
                  c.connectTimeout = 15000
                  c.readTimeout = 20000
                  c.instanceFollowRedirects = false
                  c.setRequestProperty("Accept", "application/json")
                  c.setRequestProperty("User-Agent", "FeynosFit")
                  if (token != null) c.setRequestProperty("Authorization", "Bearer $token")
                  try {
                      if (body != null) {
                          c.doOutput = true
                          c.setRequestProperty("Content-Type", "application/json")
                          c.outputStream.use { it.write(body.toString().toByteArray()) }
                      }
                      val code = c.responseCode
                      val stream = if (code in 200..299) c.inputStream else c.errorStream
                      val text = stream?.bufferedReader()?.use { it.readText() } ?: ""
                      if (code !in 200..299) {
                          val msg = runCatching { JSONObject(text).optString("error") }.getOrNull()?.takeIf { it.isNotBlank() }
                              ?: when (code) {
                                  in 300..399 -> "The server redirected the request. Check the address (use the https:// one)."
                                  404 -> "No Feynos Fit server found at that address"
                                  502, 503, 504 -> "The server isn't responding. Is the container running?"
                                  else -> "Server error ($code)"
                              }
                          throw ApiException(code, msg)
                      }
                      return text
                  } catch (e: ApiException) {
                      throw e
                  } catch (e: javax.net.ssl.SSLException) {
                      throw ApiException(0, "Secure connection failed. Check the server's HTTPS certificate.")
                  } catch (e: java.net.UnknownHostException) {
                      throw ApiException(0, "Can't find that server. Check the address and your internet connection.")
                  } catch (e: IOException) {
                      throw ApiException(0, "Couldn't reach the server: ${e.message ?: "network error"}")
                  } finally {
                      c.disconnect()
                  }
              }

              /** Runs an authenticated call; a 401 signs out locally so the UI shows the sign-in form. */
              private fun authed(ctx: Context, method: String, path: String, body: JSONObject? = null): String {
                  val s = session(ctx) ?: throw ApiException(401, "Please sign in")
                  try {
                      return call(s.server, method, path, s.token, body)
                  } catch (e: ApiException) {
                      if (e.status == 401) signOutLocally(ctx)
                      throw e
                  }
              }

              // ---------------------------------------------------------------- account (call off the main thread)

              data class ServerInfo(val signupOpen: Boolean)

              fun checkServer(input: String): ServerInfo {
                  val server = normaliseServer(input)
                  val o = JSONObject(call(server, "GET", "/health", null))
                  if (o.optString("service") != "feynos-fit") throw ApiException(0, "That address isn't a Feynos Fit server")
                  return ServerInfo(o.optBoolean("signup", true))
              }

              fun register(ctx: Context, serverInput: String, inviteCode: String, username: String, displayName: String, password: String) {
                  val server = normaliseServer(serverInput)
                  val body = JSONObject().put("signupCode", inviteCode).put("username", username)
                      .put("displayName", displayName).put("password", password)
                  val o = JSONObject(call(server, "POST", "/register", null, body))
                  save(ctx, server, o.getString("token"), o.getJSONObject("user"))
              }

              fun login(ctx: Context, serverInput: String, username: String, password: String) {
                  val server = normaliseServer(serverInput)
                  val o = JSONObject(call(server, "POST", "/login", null, JSONObject().put("username", username).put("password", password)))
                  save(ctx, server, o.getString("token"), o.getJSONObject("user"))
              }

              fun logout(ctx: Context) {
                  runCatching { authed(ctx, "POST", "/logout") }
                  signOutLocally(ctx)
              }

              fun deleteAccount(ctx: Context, password: String) {
                  authed(ctx, "POST", "/me/delete", JSONObject().put("password", password))
                  signOutLocally(ctx)
              }

              fun rename(ctx: Context, displayName: String) {
                  val o = JSONObject(authed(ctx, "POST", "/me", JSONObject().put("displayName", displayName)))
                  prefs(ctx).edit().putString("displayName", o.optString("displayName")).apply()
              }

              // ---------------------------------------------------------------- steps

              /** Uploads the last two weeks of daily step totals. */
              fun pushSteps(ctx: Context) {
                  if (session(ctx) == null) return
                  val steps = Store.current.steps
                  val days = JSONArray()
                  for (d in Dates.lastNDays(14)) {
                      val n = steps[d] ?: continue
                      days.put(JSONObject().put("date", d).put("steps", n.coerceIn(0, 150_000)))
                  }
                  if (days.length() == 0) return
                  authed(ctx, "PUT", "/steps", JSONObject().put("days", days))
              }

              // ---------------------------------------------------------------- friends & challenges

              private fun today() = URLEncoder.encode(Dates.today(), "UTF-8")

              private fun person(o: JSONObject) = Person(o.optString("id"), o.optString("username"), o.optString("displayName"))

              private fun people(a: JSONArray?): List<Person> =
                  if (a == null) emptyList() else (0 until a.length()).mapNotNull { a.optJSONObject(it)?.let(::person) }

              fun friends(ctx: Context): FriendsInfo {
                  val o = JSONObject(authed(ctx, "GET", "/friends?today=${today()}"))
                  fun friend(j: JSONObject) = Friend(person(j), j.optInt("today"), j.optInt("week"))
                  val fa = o.optJSONArray("friends")
                  val me = o.optJSONObject("me")
                  me?.optString("friendCode")?.takeIf { it.isNotBlank() }?.let { prefs(ctx).edit().putString("friendCode", it).apply() }
                  return FriendsInfo(
                      me = if (me != null) friend(me) else Friend(Person("", "", ""), 0, 0),
                      friends = if (fa == null) emptyList() else (0 until fa.length()).mapNotNull { fa.optJSONObject(it)?.let(::friend) },
                      incoming = people(o.optJSONArray("incoming")),
                      outgoing = people(o.optJSONArray("outgoing")),
                  )
              }

              /** Returns "requested", "accepted" or "already_friends". */
              fun addFriend(ctx: Context, code: String): String =
                  JSONObject(authed(ctx, "POST", "/friends", JSONObject().put("code", code))).optString("result")

              fun acceptFriend(ctx: Context, id: String) {
                  authed(ctx, "POST", "/friends/${enc(id)}/accept")
              }

              fun removeFriend(ctx: Context, id: String) {
                  authed(ctx, "DELETE", "/friends/${enc(id)}")
              }

              fun challenges(ctx: Context): List<Challenge> {
                  val a = JSONObject(authed(ctx, "GET", "/challenges?today=${today()}")).optJSONArray("challenges") ?: return emptyList()
                  return (0 until a.length()).mapNotNull { i ->
                      val c = a.optJSONObject(i) ?: return@mapNotNull null
                      val lb = c.optJSONArray("leaderboard")
                      Challenge(
                          id = c.optString("id"),
                          name = c.optString("name"),
                          start = c.optString("start"),
                          end = c.optString("end"),
                          creatorId = c.optString("creatorId"),
                          creatorName = c.optString("creatorName"),
                          myStatus = c.optString("myStatus"),
                          state = c.optString("state"),
                          leaderboard = if (lb == null) emptyList() else (0 until lb.length()).mapNotNull { j ->
                              lb.optJSONObject(j)?.let { Standing(person(it), it.optInt("total"), it.optInt("today")) }
                          },
                          invited = people(c.optJSONArray("invited")),
                      )
                  }
              }

              fun createChallenge(ctx: Context, name: String, start: String, end: String, memberIds: List<String>) {
                  val body = JSONObject().put("name", name).put("start", start).put("end", end)
                      .put("memberIds", JSONArray().also { a -> memberIds.forEach { a.put(it) } })
                  authed(ctx, "POST", "/challenges", body)
              }

              fun joinChallenge(ctx: Context, id: String) {
                  authed(ctx, "POST", "/challenges/${enc(id)}/join")
              }

              fun leaveChallenge(ctx: Context, id: String) {
                  authed(ctx, "POST", "/challenges/${enc(id)}/leave")
              }

              fun deleteChallenge(ctx: Context, id: String) {
                  authed(ctx, "DELETE", "/challenges/${enc(id)}")
              }

              private fun enc(s: String) = URLEncoder.encode(s, "UTF-8")
          }
