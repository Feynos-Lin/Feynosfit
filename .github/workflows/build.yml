                          }
                      }
                  },
                  confirmButton = {
                      TextButton(enabled = picked.isNotEmpty(), onClick = {
                          val p = presets[preset]
                          onCreate(name.trim().ifBlank { p.first + " step race" }, p.second.toString(), p.third.toString(), picked.toList())
                      }) { Text("Start") }
                  },
                  dismissButton = { TextButton(onClick = onDismiss) { Text("Cancel") } },
              )
          }
