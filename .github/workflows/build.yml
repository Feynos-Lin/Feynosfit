          /**
           * Live readout from the Etekcity ESN00. Connects while shown and disconnects when it leaves the
           * screen. [compact] is the version embedded in the portion dialog.
           */
          @Composable
          fun ScalePanel(compact: Boolean = false) {
              val ctx = LocalContext.current
              val st by ScaleManager.state.collectAsState()

              DisposableEffect(Unit) {
                  ScaleManager.acquire(ctx)
                  onDispose { ScaleManager.release() }
              }

              val permLauncher = rememberLauncherForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) {
                  ScaleManager.retry(ctx)
              }

              Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                  when (st.status) {
                      Status.IDLE, Status.SCANNING -> {
                          Text("Looking for your scale… press its power button to wake it.", style = MaterialTheme.typography.bodySmall)
                          LinearProgressIndicator(Modifier.fillMaxWidth())
                      }
                      Status.CONNECTING -> {
                          Text("Connecting to ${st.deviceName ?: "scale"}…", style = MaterialTheme.typography.bodySmall)
                          LinearProgressIndicator(Modifier.fillMaxWidth())
                      }
                      Status.NEED_PERMISSION -> {
                          Text("Feynos Fit needs Bluetooth permission to talk to the scale.", style = MaterialTheme.typography.bodySmall)
                          Button(onClick = { permLauncher.launch(ScaleManager.requiredPermissions()) }) { Text("Allow Bluetooth") }
                      }
                      Status.BLUETOOTH_OFF -> {
                          Text("Bluetooth is off.", style = MaterialTheme.typography.bodySmall)
                          Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              Button(onClick = {
                                  runCatching { ctx.startActivity(Intent(Settings.ACTION_BLUETOOTH_SETTINGS)) }
                              }) { Text("Turn on Bluetooth") }
                              TextButton(onClick = { ScaleManager.retry(ctx) }) { Text("Try again") }
                          }
                      }
                      Status.NO_BLUETOOTH -> Text("This phone doesn't support Bluetooth LE.", color = MaterialTheme.colorScheme.error)
                      Status.NOT_FOUND, Status.DISCONNECTED -> {
                          Text(
                              if (st.status == Status.NOT_FOUND) "Couldn't find the scale. Make sure it's on and nearby, and that the VeSync app isn't connected to it."
                              else "The scale disconnected (it may have turned itself off).",
                              style = MaterialTheme.typography.bodySmall,
                          )
                          Button(onClick = { ScaleManager.retry(ctx) }) { Text("Search again") }
                      }
                      Status.CONNECTED -> {
                          val r = st.reading
                          if (r == null) {
                              Text("Connected. Waiting for a reading…", style = MaterialTheme.typography.bodySmall)
                          } else {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Text(
                                      "${st.netGrams.f1()} g",
                                      style = if (compact) MaterialTheme.typography.headlineSmall else MaterialTheme.typography.displaySmall,
                                      fontWeight = FontWeight.Bold,
                                  )
                                  Spacer(Modifier.width(8.dp))
                                  if (r.settled) {
                                      Icon(Icons.Filled.CheckCircle, contentDescription = "Stable", tint = MaterialTheme.colorScheme.primary, modifier = Modifier.size(20.dp))
                                  } else {
                                      Text("settling…", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                                  }
                              }
                              val extra = buildList {
                                  if (r.unit != 0) add("Scale shows ${r.display}")
                                  if (st.tareGrams != 0.0) add("tared ${st.tareGrams.f1()} g")
                              }
                              if (extra.isNotEmpty()) {
                                  Text(extra.joinToString(" · "), style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                              }
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  OutlinedButton(onClick = { ScaleManager.tare() }) { Text("Tare") }
                                  if (st.tareGrams != 0.0) TextButton(onClick = { ScaleManager.clearTare() }) { Text("Clear tare") }
                              }
                          }
                      }
                  }
              }
          }

