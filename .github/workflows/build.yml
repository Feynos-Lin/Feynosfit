          @Composable
          fun ProfileForm(
              initial: Profile,
              saveLabel: String,
              header: @Composable () -> Unit = {},
              onSave: (Profile) -> Unit,
          ) {
              var imperial by remember { mutableStateOf(initial.imperial) }
              var name by remember { mutableStateOf(initial.name) }
              var male by remember { mutableStateOf(initial.male) }
              var age by remember { mutableStateOf(initial.age.toString()) }
              val inchesTotal = (initial.heightCm / 2.54).roundToInt()
              var heightCm by remember { mutableStateOf(initial.heightCm.f0()) }
              var heightFt by remember { mutableStateOf((inchesTotal / 12).toString()) }
              var heightIn by remember { mutableStateOf((inchesTotal % 12).toString()) }
              var weight by remember { mutableStateOf(Units.weightIn(initial.weightKg, initial.imperial).f1()) }
              var goalWeight by remember { mutableStateOf(Units.weightIn(initial.goalWeightKg, initial.imperial).f1()) }
              var activity by remember { mutableIntStateOf(initial.activity) }
              var goalType by remember { mutableIntStateOf(initial.goalType) }
              var rateIdx by remember { mutableIntStateOf(Calc.rateIndex(initial.rateKg, initial.imperial)) }
              var calText by remember { mutableStateOf(if (initial.onboarded) initial.calorieGoal.toString() else "") }
              var pPct by remember { mutableStateOf(initial.proteinPct.toString()) }
              var cPct by remember { mutableStateOf(initial.carbsPct.toString()) }
              var fPct by remember { mutableStateOf(initial.fatPct.toString()) }
              var water by remember {
                  mutableStateOf(
                      if (initial.imperial) (initial.waterGoalMl / Units.ML_PER_OZ).f0() else initial.waterGoalMl.toString(),
                  )
              }
              var stepsGoal by remember { mutableStateOf(initial.stepsGoal.toString()) }

              fun heightNowCm(): Double? = if (imperial) {
                  val ft = heightFt.toIntOrNull()
                  if (ft == null) null else (ft * 12 + (parseNum(heightIn) ?: 0.0)) * 2.54
              } else {
                  parseNum(heightCm)
              }

              fun switchUnits(toImperial: Boolean) {
                  if (toImperial == imperial) return
                  val h = heightNowCm()
                  val w = parseNum(weight)
                  val gw = parseNum(goalWeight)
                  val wa = parseNum(water)
                  if (h != null) {
                      val ti = (h / 2.54).roundToInt()
                      heightFt = (ti / 12).toString()
                      heightIn = (ti % 12).toString()
                      heightCm = h.f0()
                  }
                  if (w != null) weight = Units.weightIn(Units.toKg(w, imperial), toImperial).f1()
                  if (gw != null) goalWeight = Units.weightIn(Units.toKg(gw, imperial), toImperial).f1()
                  if (wa != null) {
                      water = if (toImperial) (wa / Units.ML_PER_OZ).f0() else ((wa * Units.ML_PER_OZ / 50).roundToInt() * 50).toString()
                  }
                  imperial = toImperial
              }

              val macroSum = (pPct.toIntOrNull() ?: 0) + (cPct.toIntOrNull() ?: 0) + (fPct.toIntOrNull() ?: 0)

              fun build(): Profile? {
                  val a = age.toIntOrNull()?.takeIf { it in 13..110 } ?: return null
                  val h = heightNowCm()?.takeIf { it in 90.0..250.0 } ?: return null
                  val w = parseNum(weight)?.let { Units.toKg(it, imperial) }?.takeIf { it in 25.0..400.0 } ?: return null
                  val gw = parseNum(goalWeight)?.let { Units.toKg(it, imperial) }?.takeIf { it > 0 } ?: w
                  if (macroSum != 100) return null
                  val waterMl = parseNum(water)?.let { if (imperial) (it * Units.ML_PER_OZ).roundToInt() else it.roundToInt() }
                      ?.takeIf { it > 0 } ?: 2500
                  val base = initial.copy(
                      name = name.trim(), male = male, age = a, heightCm = h, weightKg = w, goalWeightKg = gw,
                      activity = activity, goalType = goalType, rateKg = Calc.rateKg(rateIdx, imperial),
                      proteinPct = pPct.toIntOrNull() ?: 30, carbsPct = cPct.toIntOrNull() ?: 40, fatPct = fPct.toIntOrNull() ?: 30,
                      waterGoalMl = waterMl, stepsGoal = stepsGoal.toIntOrNull()?.takeIf { it > 0 } ?: 10000, imperial = imperial,
                  )
                  val cal = calText.toIntOrNull()?.takeIf { it >= 800 } ?: Calc.recommendedCalories(base)
                  return base.copy(calorieGoal = cal)
              }

              val built = build()
              val recommended = built?.let { Calc.recommendedCalories(it) }

              Column(
                  Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(16.dp),
                  verticalArrangement = Arrangement.spacedBy(12.dp),
              ) {
                  header()
                  SectionCard("About you") {
                      ChoiceRow(listOf("US units (lb, ft)", "Metric (kg, cm)"), if (imperial) 0 else 1) { switchUnits(it == 0) }
                      OutlinedTextField(name, { name = it }, Modifier.fillMaxWidth(), label = { Text("First name (optional)") }, singleLine = true)
                      ChoiceRow(listOf("Male", "Female"), if (male) 0 else 1) { male = it == 0 }
                      Text(
                          "Used only for the calorie formula.",
                          style = MaterialTheme.typography.bodySmall,
                          color = MaterialTheme.colorScheme.onSurfaceVariant,
                      )
                      NumField(age, { age = it }, "Age", Modifier.fillMaxWidth(), decimal = false)
                      if (imperial) {
                          Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              NumField(heightFt, { heightFt = it }, "Height (ft)", Modifier.weight(1f), decimal = false)
                              NumField(heightIn, { heightIn = it }, "(in)", Modifier.weight(1f))
                          }
                      } else {
                          NumField(heightCm, { heightCm = it }, "Height (cm)", Modifier.fillMaxWidth())
                      }
                      NumField(weight, { weight = it }, "Current weight (${Units.weightUnit(imperial)})", Modifier.fillMaxWidth())
                  }

                  SectionCard("Activity level") {
                      Calc.activityNames.forEachIndexed { i, label ->
                          Row(
                              Modifier.fillMaxWidth().clickable { activity = i }.padding(vertical = 2.dp),
                              verticalAlignment = Alignment.CenterVertically,
