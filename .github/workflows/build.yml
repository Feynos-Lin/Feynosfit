          package com.feynos.fit.data

          import android.Manifest
          import android.annotation.SuppressLint
          import android.bluetooth.BluetoothAdapter
          import android.bluetooth.BluetoothDevice
          import android.bluetooth.BluetoothGatt
          import android.bluetooth.BluetoothGattCallback
          import android.bluetooth.BluetoothGattCharacteristic
          import android.bluetooth.BluetoothGattDescriptor
          import android.bluetooth.BluetoothManager
          import android.bluetooth.BluetoothProfile
          import android.bluetooth.le.ScanCallback
          import android.bluetooth.le.ScanResult
          import android.bluetooth.le.ScanSettings
          import android.content.Context
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.flow.update
          import java.util.UUID

          /** Connects to an Etekcity ESN00 kitchen scale over Bluetooth LE and streams its readings. */
          @SuppressLint("MissingPermission")
          object ScaleManager {
              enum class Status { IDLE, NO_BLUETOOTH, BLUETOOTH_OFF, NEED_PERMISSION, SCANNING, CONNECTING, CONNECTED, NOT_FOUND, DISCONNECTED }

              data class State(
                  val status: Status = Status.IDLE,
                  val reading: Esn00Protocol.Reading? = null,
                  val tareGrams: Double = 0.0,
                  val deviceName: String? = null,
              ) {
                  /** Weight on the scale minus the in-app tare. */
                  val netGrams: Double get() = (reading?.grams ?: 0.0) - tareGrams
              }

              private val _state = MutableStateFlow(State())
              val state: StateFlow<State> = _state.asStateFlow()

              private val SERVICE = UUID.fromString(Esn00Protocol.SERVICE_UUID)
              private val NOTIFY = UUID.fromString(Esn00Protocol.NOTIFY_UUID)
              private val WRITE = UUID.fromString(Esn00Protocol.WRITE_UUID)
              private val CCCD = UUID.fromString(Esn00Protocol.CCCD_UUID)

              private val main = Handler(Looper.getMainLooper())
              private var appCtx: Context? = null
              private var adapter: BluetoothAdapter? = null
              private var gatt: BluetoothGatt? = null
              private var scanCallback: ScanCallback? = null
              private var users = 0
              private val scanTimeout = Runnable { onScanTimeout() }

              fun requiredPermissions(): Array<String> =
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      arrayOf(Manifest.permission.BLUETOOTH_SCAN, Manifest.permission.BLUETOOTH_CONNECT)
                  } else {
                      arrayOf(Manifest.permission.ACCESS_FINE_LOCATION)
                  }

              fun hasPermissions(ctx: Context): Boolean =
                  requiredPermissions().all { ctx.checkSelfPermission(it) == PackageManager.PERMISSION_GRANTED }

              /** Start (or join) a scale session. Pair every call with [release]. */
              fun acquire(ctx: Context) {
                  main.post {
                      users++
                      connectIfNeeded(ctx.applicationContext)
                  }
              }

              fun release() {
                  main.post {
                      users = (users - 1).coerceAtLeast(0)
                      if (users == 0) shutdown()
                  }
              }

              /** Try again after the user turns on Bluetooth, grants permission, or wakes the scale. */
              fun retry(ctx: Context) {
                  main.post {
                      shutdown()
                      connectIfNeeded(ctx.applicationContext)
                  }
              }

              fun tare() = _state.update { it.copy(tareGrams = it.reading?.grams ?: 0.0) }

              fun clearTare() = _state.update { it.copy(tareGrams = 0.0) }

              /** Switch the scale's own display to grams. */
              fun setScaleToGrams() = write(Esn00Protocol.setUnit(Esn00Protocol.UNIT_GRAM))

              // ------------------------------------------------------------------ internals (main thread)

              private fun connectIfNeeded(app: Context) {
                  appCtx = app
                  if (gatt != null || scanCallback != null) return
                  val bm = app.getSystemService(Context.BLUETOOTH_SERVICE) as? BluetoothManager
                  val a = bm?.adapter
                  adapter = a
                  when {
                      a == null -> setStatus(Status.NO_BLUETOOTH)
                      !hasPermissions(app) -> setStatus(Status.NEED_PERMISSION)
                      !a.isEnabled -> setStatus(Status.BLUETOOTH_OFF)
                      else -> startScan(a)
                  }
              }

              private fun startScan(a: BluetoothAdapter) {
                  val scanner = a.bluetoothLeScanner ?: return setStatus(Status.BLUETOOTH_OFF)
                  val saved = Store.current.profile.scaleAddress
                  val cb = object : ScanCallback() {
                      override fun onScanResult(callbackType: Int, result: ScanResult) {
                          val d = result.device
                          val name = result.scanRecord?.deviceName ?: runCatching { d.name }.getOrNull() ?: ""
                          val uuids = result.scanRecord?.serviceUuids?.map { it.uuid } ?: emptyList()
                          val match = d.address == saved ||
                              name.contains("Etekcity", ignoreCase = true) ||
                              name.contains("Nutrition Scale", ignoreCase = true) ||
                              SERVICE in uuids
                          if (match) main.post { onFound(d, name) }
                      }

                      override fun onScanFailed(errorCode: Int) {
                          main.post {
                              scanCallback = null
                              setStatus(Status.NOT_FOUND)
                          }
                      }
                  }
                  scanCallback = cb
                  setStatus(Status.SCANNING)
                  val settings = ScanSettings.Builder().setScanMode(ScanSettings.SCAN_MODE_LOW_LATENCY).build()
                  runCatching { scanner.startScan(null, settings, cb) }.onFailure {
                      scanCallback = null
                      setStatus(Status.NOT_FOUND)
                      return
                  }
                  main.removeCallbacks(scanTimeout)
                  main.postDelayed(scanTimeout, 20_000)
              }

              private fun stopScan() {
                  main.removeCallbacks(scanTimeout)
                  val cb = scanCallback ?: return
                  scanCallback = null
                  runCatching { adapter?.bluetoothLeScanner?.stopScan(cb) }
              }

              private fun onScanTimeout() {
                  if (scanCallback != null && gatt == null) {
                      stopScan()
                      setStatus(Status.NOT_FOUND)
                  }
              }

              private fun onFound(device: BluetoothDevice, name: String) {
                  if (gatt != null || scanCallback == null) return
                  stopScan()
                  val app = appCtx ?: return
                  _state.update { it.copy(status = Status.CONNECTING, deviceName = name.ifBlank { "Etekcity scale" }) }
                  gatt = runCatching {
                      device.connectGatt(app, false, gattCallback, BluetoothDevice.TRANSPORT_LE)
                  }.getOrNull()
                  if (gatt == null) setStatus(Status.DISCONNECTED)
              }

              private fun shutdown() {
                  stopScan()
                  gatt?.let { g ->
                      runCatching { g.disconnect() }
                      runCatching { g.close() }
                  }
                  gatt = null
                  _state.value = State()
              }

              private fun setStatus(s: Status) = _state.update { it.copy(status = s) }

              private fun write(bytes: ByteArray) {
                  main.post {
                      val g = gatt ?: return@post
                      val ch = g.getService(SERVICE)?.getCharacteristic(WRITE) ?: return@post
                      runCatching {
                          if (Build.VERSION.SDK_INT >= 33) {
                              g.writeCharacteristic(ch, bytes, BluetoothGattCharacteristic.WRITE_TYPE_NO_RESPONSE)
                          } else {
                              @Suppress("DEPRECATION")
                              ch.writeType = BluetoothGattCharacteristic.WRITE_TYPE_NO_RESPONSE
                              @Suppress("DEPRECATION")
                              ch.setValue(bytes)
                              @Suppress("DEPRECATION")
                              g.writeCharacteristic(ch)
                          }
                      }
                  }
              }

              private fun handleBytes(bytes: ByteArray) {
                  for (p in Esn00Protocol.parse(bytes)) {
                      val r = Esn00Protocol.reading(p) ?: continue
                      _state.update { it.copy(reading = r, status = Status.CONNECTED) }
                  }
              }

              private val gattCallback = object : BluetoothGattCallback() {
                  override fun onConnectionStateChange(g: BluetoothGatt, status: Int, newState: Int) {
                      main.post {
                          if (g != gatt) return@post
                          if (newState == BluetoothProfile.STATE_CONNECTED) {
                              runCatching { g.discoverServices() }
                          } else if (newState == BluetoothProfile.STATE_DISCONNECTED) {
                              runCatching { g.close() }
                              gatt = null
                              _state.update { it.copy(status = Status.DISCONNECTED, reading = null) }
                          }
                      }
                  }

                  override fun onServicesDiscovered(g: BluetoothGatt, status: Int) {
                      main.post {
                          if (g != gatt) return@post
                          val ch = g.getService(SERVICE)?.getCharacteristic(NOTIFY)
                          if (ch == null) {
                              // Not an ESN00 after all.
                              runCatching { g.disconnect() }
                              return@post
                          }
                          runCatching {
                              g.setCharacteristicNotification(ch, true)
                              val desc = ch.getDescriptor(CCCD)
                              if (desc != null) {
                                  if (Build.VERSION.SDK_INT >= 33) {
                                      g.writeDescriptor(desc, BluetoothGattDescriptor.ENABLE_NOTIFICATION_VALUE)
                                  } else {
                                      @Suppress("DEPRECATION")
                                      desc.setValue(BluetoothGattDescriptor.ENABLE_NOTIFICATION_VALUE)
                                      @Suppress("DEPRECATION")
                                      g.writeDescriptor(desc)
                                  }
                              }
                          }
                          setStatus(Status.CONNECTED)
                          val addr = g.device.address
                          val p = Store.current.profile
                          if (p.scaleAddress != addr) Store.setProfile(p.copy(scaleAddress = addr))
                      }
                  }

                  // Android 13+
                  override fun onCharacteristicChanged(g: BluetoothGatt, characteristic: BluetoothGattCharacteristic, value: ByteArray) {
                      if (characteristic.uuid == NOTIFY) handleBytes(value)
                  }

                  // Android 12 and older
                  @Deprecated("Deprecated in Java")
                  override fun onCharacteristicChanged(g: BluetoothGatt, characteristic: BluetoothGattCharacteristic) {
                      if (Build.VERSION.SDK_INT >= 33) return
                      @Suppress("DEPRECATION")
                      val v = characteristic.value ?: return
                      if (characteristic.uuid == NOTIFY) handleBytes(v)
                  }
              }
          }
