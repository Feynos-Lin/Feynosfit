                                  DropdownMenu(expanded = menu, onDismissRequest = { menu = false }) {
                                      DropdownMenuItem(text = { Text("Leave challenge") }, onClick = { menu = false; onLeave() })
                                      if (c.creatorId == myId) {
                                          DropdownMenuItem(text = { Text("Delete challenge") }, onClick = { menu = false; onDelete() })
                                      }
                                  }
                              }
                          }
                      }
                      if (c.myStatus == "invited") {
                          Text("${c.creatorName} invited you.", style = MaterialTheme.typography.bodyMedium)
                          Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              Button(onClick = onJoin) { Text("Join") }
                              OutlinedButton(onClick = onDecline) { Text("No thanks") }
                          }
                      }
                      val leader = c.leaderboard.firstOrNull()?.total ?: 0
                      c.leaderboard.forEachIndexed { i, s ->
                          if (i > 0) HorizontalDivider()
                          val mine = s.person.id == myId
                          Row(Modifier.fillMaxWidth().padding(vertical = 4.dp), verticalAlignment = Alignment.CenterVertically) {
                              Box(Modifier.width(28.dp), contentAlignment = Alignment.Center) {
                                  if (i == 0 && leader > 0) {
                                      Icon(Icons.Filled.Star, contentDescription = "Leader", tint = androidx.compose.ui.graphics.Color(0xFFF2B01E))
                                  } else {
                                      Text("${i + 1}", fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.onSurfaceVariant)
