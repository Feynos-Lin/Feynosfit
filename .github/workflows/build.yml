              /** Runs a server action, then refreshes. */
              fun act(done: String? = null, block: () -> Unit) {
                  scope.launch {
                      io(block).onSuccess {
                          if (done != null) Toast.makeText(ctx, done, Toast.LENGTH_SHORT).show()
                          refresh()
                      }.onFailure { Toast.makeText(ctx, it.friendly(), Toast.LENGTH_LONG).show() }
                  }
