          @Composable
          fun HealthConnectScreen() {
              val nav = LocalNav.current
              val ctx = LocalContext.current
              val data by Store.data.collectAsState()
              val p = data.profile
              val scope = rememberCoroutineScope()
              var availability by remember { mutableStateOf(HealthSync.availability(ctx)) }
              var granted by remember { mutableStateOf<Set<String>>(emptySet()) }
              var refreshKey by remember { mutableIntStateOf(0) }
              var syncing by remember { mutableStateOf(false) }
              var message by remember { mutableStateOf<String?>(null) }

              LaunchedEffect(refreshKey) {
                  availability = HealthSync.availability(ctx)
                  granted = HealthSync.grantedPermissions(ctx)
              }

              val permLauncher = rememberLauncherForActivityResult(PermissionController.createRequestPermissionResultContract(HealthSync.PROVIDER)) { result ->
                  granted = result
                  if (result.isNotEmpty()) {
                      Store.setProfile(Store.current.profile.copy(hcEnabled = true))
                      syncing = true
                      scope.launch {
                          HealthSync.syncRecent(ctx, days = 30)
                          syncing = false
                          message = HealthSync.lastError ?: "Synced."
                          refreshKey++
                      }
                  } else {
                      message = "No permissions were granted. You can choose what to share at any time."
                  }
              }

              val connected = p.hcEnabled && granted.isNotEmpty()
              val missing = HealthSync.allPermissions - granted

              Scaffold(topBar = { BackTopBar("Connected health apps", { nav.pop() }) }) { pad ->
                  Centered(Modifier.padding(pad)) {
                      Column(
                          Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(16.dp),
                          verticalArrangement = Arrangement.spacedBy(12.dp),
                      ) {
                          SectionCard("Health Connect") {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Icon(
                                      if (connected) Icons.Filled.CheckCircle else Icons.Filled.Favorite,
                                      contentDescription = null,
                                      tint = MaterialTheme.colorScheme.primary,
                                  )
                                  Spacer(Modifier.width(8.dp))
                                  Text(
                                      when {
                                          availability == HealthSync.Availability.NOT_INSTALLED -> "Health Connect isn't available on this phone"
                                          availability == HealthSync.Availability.NEEDS_UPDATE -> "Health Connect needs an update"
                                          connected -> "Connected"
                                          else -> "Not connected"
                                      },
                                      fontWeight = FontWeight.SemiBold,
                                  )
                              }
                              Text(
                                  "Health Connect is Android's shared health store. Samsung Health and OHealth (OnePlus) send their data there, and Feynos Fit reads it from there.",
                                  style = MaterialTheme.typography.bodySmall,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant,
                              )
                              when (availability) {
                                  HealthSync.Availability.AVAILABLE -> {
                                      if (!connected || missing.isNotEmpty()) {
                                          Button(onClick = { permLauncher.launch(HealthSync.allPermissions) }, modifier = Modifier.fillMaxWidth()) {
                                              Text(if (connected) "Grant remaining permissions" else "Connect to Health Connect")
                                          }
                                      }
                                      if (connected) {
                                          FilledTonalButton(
                                              onClick = {
                                                  syncing = true
                                                  message = null
                                                  scope.launch {
                                                      HealthSync.syncRecent(ctx, days = 14)
                                                      syncing = false
                                                      message = HealthSync.lastError ?: "Synced."
                                                  }
                                              },
                                              enabled = !syncing,
                                              modifier = Modifier.fillMaxWidth(),
                                          ) {
                                              Icon(Icons.Filled.Refresh, contentDescription = null)
                                              Spacer(Modifier.width(8.dp))
                                              Text(if (syncing) "Syncing…" else "Sync now")
                                          }
                                      }
                                      if (syncing) LinearProgressIndicator(Modifier.fillMaxWidth())
                                      message?.let { Text(it, style = MaterialTheme.typography.bodySmall) }
                                      if (data.lastHcSync > 0) {
                                          Text(
                                              "Last sync: " + DateFormat.getDateTimeInstance(DateFormat.MEDIUM, DateFormat.SHORT).format(Date(data.lastHcSync)),
                                              style = MaterialTheme.typography.bodySmall,
                                              color = MaterialTheme.colorScheme.onSurfaceVariant,
                                          )
                                      }
                                      TextButton(onClick = { runCatching { ctx.startActivity(HealthSync.manageIntent(ctx)) } }) {
                                          Text("Open Health Connect settings")
                                      }
                                  }
                                  else -> {
                                      Button(onClick = { runCatching { ctx.startActivity(HealthSync.playStoreIntent()) } }, modifier = Modifier.fillMaxWidth()) {
                                          Text(if (availability == HealthSync.Availability.NEEDS_UPDATE) "Update Health Connect" else "Get Health Connect")
                                      }
                                      TextButton(onClick = { refreshKey++ }) { Text("I've installed it — check again") }
                                  }
                              }
                          }

                          if (connected) {
                              SectionCard("What to sync") {
                                  ToggleRow(
                                      "Sync is on",
                                      "Pull new data each time you open the app",
                                      p.hcEnabled,
                                  ) { Store.setProfile(p.copy(hcEnabled = it)) }
                                  ToggleRow(
                                      "Import workouts",
                                      "Workouts from Samsung Health, OHealth and others add to your exercise calories",
                                      p.hcImportWorkouts,
                                  ) { Store.setProfile(p.copy(hcImportWorkouts = it)) }
                                  ToggleRow(
                                      "Share food with Health Connect",
                                      "Your diary's calories and nutrients show up in Samsung Health",
                                      p.hcWriteFood,
                                  ) { Store.setProfile(p.copy(hcWriteFood = it)) }
                                  Text(
                                      "Steps and weigh-ins (for example from a smart scale) are always imported while sync is on. Weigh-ins you log here are shared back.",
                                      style = MaterialTheme.typography.bodySmall,
                                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                                  )
                              }
                          }

                          SectionCard("Set up Samsung Health") {
                              Step(1, "Open Samsung Health, tap the ⋮ menu (or your profile) → Settings → Health Connect.")
                              Step(2, "Allow Samsung Health to write steps, exercise and weight to Health Connect.")
                              Step(3, "Come back here and tap Connect. Samsung may take a few minutes to send its first sync.")
                          }
                          SectionCard("Set up OHealth (OnePlus)") {
                              Step(1, "Open OHealth → Me → Settings, then look for Health Connect (sometimes under Data sharing or Third-party apps).")
                              Step(2, "Turn on syncing to Health Connect.")
                              Step(3, "Tap Sync now here. OHealth mainly shares steps, so workouts may still need logging by hand.")
                          }
                          Spacer(Modifier.height(24.dp))
                      }
                  }
              }
          }

          @Composable
          private fun ToggleRow(title: String, subtitle: String, checked: Boolean, onChange: (Boolean) -> Unit) {
              Row(verticalAlignment = Alignment.CenterVertically) {
                  Column(Modifier.weight(1f)) {
                      Text(title)
                      Text(subtitle, style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                  }
                  Spacer(Modifier.width(8.dp))
                  Switch(checked = checked, onCheckedChange = onChange)
              }
          }

          @Composable
          private fun Step(n: Int, text: String) {
