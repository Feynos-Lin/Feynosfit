                                  modifier = Modifier.fillMaxWidth(),
                              ) { Text("Restore from backup file") }
                              TextButton(onClick = { confirmReset = true }, modifier = Modifier.fillMaxWidth()) {
                                  Text("Erase all data", color = MaterialTheme.colorScheme.error)
                              }
                          }
                          SectionCard("About") {
                              Text(
                                  "Food search and barcode data come from Open Food Facts (openfoodfacts.org), a free, community-built database. Calorie targets use the Mifflin-St Jeor equation; exercise estimates use standard MET values.",
                                  style = MaterialTheme.typography.bodySmall,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant,
