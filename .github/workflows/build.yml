          @Composable
          fun EditRecipeScreen(id: String?) {
              val nav = LocalNav.current
              val data by Store.data.collectAsState()
              val existing = remember(id) { data.recipes.firstOrNull { it.id == id } }
              var name by remember { mutableStateOf(existing?.name ?: "") }
              var servings by remember { mutableStateOf(existing?.servings?.num() ?: "4") }
              val items = remember { mutableStateListOf<RecipeItem>().apply { existing?.items?.let { addAll(it) } } }
              var picking by remember { mutableStateOf(false) }
              var confirmDelete by remember { mutableStateOf(false) }

              if (picking) {
                  BackHandler { picking = false }
                  FoodPicker(
                      title = "Add ingredient",
                      onBack = { picking = false },
                      allowCreate = false,
                      includeRecipes = false,
                      confirmLabel = "Add",
                  ) { f, s ->
                      items.add(RecipeItem(f.name, s, f.servingDesc, f.n))
                      picking = false
                  }
                  return
              }

              val sv = parseNum(servings) ?: 0.0
              val total = items.fold(Nutrients.ZERO) { a, i -> a + i.total }
              val perServing = if (sv > 0) total * (1.0 / sv) else Nutrients.ZERO
              val valid = name.isNotBlank() && sv > 0 && items.isNotEmpty()

              fun save() {
                  Store.saveRecipe(Recipe(id = existing?.id ?: newId(), name = name.trim(), servings = sv, items = items.toList()))
                  nav.pop()
              }

              Scaffold(
                  topBar = {
                      BackTopBar(if (existing == null) "New recipe" else "Edit recipe", { nav.pop() }) {
                          TextButton(enabled = valid, onClick = { save() }) { Text("Save") }
                      }
                  },
              ) { pad ->
                  Centered(Modifier.padding(pad)) {
                      Column(
                          Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(16.dp),
                          verticalArrangement = Arrangement.spacedBy(12.dp),
                      ) {
                          SectionCard {
                              OutlinedTextField(name, { name = it }, Modifier.fillMaxWidth(), label = { Text("Recipe name") }, singleLine = true)
                              NumField(servings, { servings = it }, "Number of servings it makes", Modifier.fillMaxWidth())
                          }
                          SectionCard("Per serving") { NutrientSummary(perServing) }
                          SectionCard("Ingredients (${items.size})") {
                              if (items.isEmpty()) {
                                  Text(
                                      "No ingredients yet.",
                                      style = MaterialTheme.typography.bodyMedium,
                                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                                  )
                              }
                              items.forEachIndexed { i, ing ->
                                  if (i > 0) HorizontalDivider()
                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                      Column(Modifier.weight(1f)) {
                                          Text(ing.name, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                          Text(
                                              "${ing.servings.num()} × ${ing.servingDesc} · ${ing.total.kcal.f0()} cal",
                                              style = MaterialTheme.typography.bodySmall,
                                              color = MaterialTheme.colorScheme.onSurfaceVariant,
                                          )
                                      }
                                      IconButton(onClick = { items.removeAt(i) }) { Icon(Icons.Filled.Close, contentDescription = "Remove") }
                                  }
                              }
                              OutlinedButton(onClick = { picking = true }, modifier = Modifier.fillMaxWidth()) {
                                  Icon(Icons.Filled.Add, contentDescription = null)
                                  Spacer(Modifier.width(8.dp))
                                  Text("Add ingredient")
                              }
                          }
                          Button(onClick = { save() }, enabled = valid, modifier = Modifier.fillMaxWidth()) { Text("Save recipe") }
                          if (existing != null) {
                              TextButton(onClick = { confirmDelete = true }, modifier = Modifier.fillMaxWidth()) {
                                  Text("Delete recipe", color = MaterialTheme.colorScheme.error)
                              }
                          }
                          Spacer(Modifier.height(24.dp))
                      }
                  }
              }

              if (confirmDelete && existing != null) {
                  ConfirmDialog(
                      title = "Delete ${existing.name}?",
                      text = "Diary entries already logged stay as they are.",
                      confirmLabel = "Delete",
                      onConfirm = {
                          Store.deleteRecipe(existing.id)
                          confirmDelete = false
                          nav.pop()
                      },
                      onDismiss = { confirmDelete = false },
                  )
              }
          }

