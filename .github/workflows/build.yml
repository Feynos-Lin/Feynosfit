          // ================================================================ Updates

          sealed class UpdateStatus {
              data object Idle : UpdateStatus()
              data object Checking : UpdateStatus()
              data object UpToDate : UpdateStatus()
              data class Available(val release: Updater.Release) : UpdateStatus()
              data class Downloading(val release: Updater.Release, val progress: Float) : UpdateStatus()
              data class Ready(val release: Updater.Release, val apk: File) : UpdateStatus()
              data class Failed(val message: String) : UpdateStatus()
          }

          /** Shared update state so the dashboard banner and Settings stay in sync. */
          object UpdateUi {
              var status by mutableStateOf<UpdateStatus>(UpdateStatus.Idle)
                  private set
              private var lastCheckMs = 0L

              fun check(silent: Boolean = false) {
                  if (status is UpdateStatus.Checking || status is UpdateStatus.Downloading) return
                  if (silent && System.currentTimeMillis() - lastCheckMs < 6 * 60 * 60 * 1000L) return
                  lastCheckMs = System.currentTimeMillis()
                  if (!silent) status = UpdateStatus.Checking
                  AppScope.launch {
                      val r = withContext(Dispatchers.IO) { runCatching { Updater.latest() } }
                      status = r.fold(
                          onSuccess = { rel ->
                              if (rel != null && rel.build > BuildConfig.VERSION_CODE) UpdateStatus.Available(rel)
                              else if (silent) UpdateStatus.Idle else UpdateStatus.UpToDate
                          },
                          onFailure = { e -> if (silent) UpdateStatus.Idle else UpdateStatus.Failed(e.message ?: "Couldn't reach GitHub") },
                      )
                  }
              }

              fun downloadAndInstall(ctx: Context, rel: Updater.Release) {
                  val app = ctx.applicationContext
                  status = UpdateStatus.Downloading(rel, 0f)
                  AppScope.launch {
                      val r = withContext(Dispatchers.IO) {
                          runCatching {
                              Updater.download(app, rel) { p ->
                                  AppScope.launch { if (status is UpdateStatus.Downloading) status = UpdateStatus.Downloading(rel, p) }
                              }
                          }
                      }
                      r.onSuccess { file ->
                          status = UpdateStatus.Ready(rel, file)
                          install(ctx, file)
                      }.onFailure { e ->
                          status = UpdateStatus.Failed(e.message ?: "Download failed")
                      }
                  }
              }

              fun install(ctx: Context, apk: File) {
                  if (!Updater.canInstall(ctx)) {
                      ctx.startActivity(Updater.allowInstallIntent(ctx).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                      return
                  }
                  runCatching { ctx.startActivity(Updater.installIntent(ctx, apk)) }
                      .onFailure { status = UpdateStatus.Failed("Couldn't open the installer: ${it.message}") }
              }
          }

          /** Small banner for the dashboard when a newer build is on GitHub. */
          @Composable
          fun UpdateBanner() {
              val s = UpdateUi.status
              val ctx = LocalContext.current
              val rel = when (s) {
                  is UpdateStatus.Available -> s.release
                  is UpdateStatus.Downloading -> s.release
                  is UpdateStatus.Ready -> s.release
                  else -> null
              } ?: return
              ElevatedCard(Modifier.fillMaxWidth()) {
                  Column(Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Icon(Icons.Filled.SystemUpdate, contentDescription = null, tint = MaterialTheme.colorScheme.primary)
                          Spacer(Modifier.width(8.dp))
                          Text("Update available: v${rel.version} (build ${rel.build})", fontWeight = FontWeight.SemiBold)
                      }
                      UpdateActions(ctx, s)
                  }
              }
          }

          @Composable
          private fun UpdateActions(ctx: Context, s: UpdateStatus) {
              when (s) {
                  is UpdateStatus.Available -> Button(onClick = { UpdateUi.downloadAndInstall(ctx, s.release) }, modifier = Modifier.fillMaxWidth()) {
                      Text(if (s.release.sizeBytes > 0) "Download & install (${s.release.sizeBytes / (1024 * 1024)} MB)" else "Download & install")
                  }
                  is UpdateStatus.Downloading -> Column(verticalArrangement = Arrangement.spacedBy(4.dp)) {
                      LinearProgressIndicator(progress = { s.progress }, modifier = Modifier.fillMaxWidth())
                      Text("Downloading… ${(s.progress * 100).toInt()}%", style = MaterialTheme.typography.bodySmall)
                  }
                  is UpdateStatus.Ready -> Column(verticalArrangement = Arrangement.spacedBy(4.dp)) {
                      Button(onClick = { UpdateUi.install(ctx, s.apk) }, modifier = Modifier.fillMaxWidth()) { Text("Install") }
                      if (!Updater.canInstall(ctx)) {
                          Text(
                              "Android will ask you to allow Feynos Fit to install apps. Turn that on, come back, and tap Install.",
                              style = MaterialTheme.typography.bodySmall,
                              color = MaterialTheme.colorScheme.onSurfaceVariant,
                          )
                      }
                  }
                  else -> {}
              }
          }

          /** Settings card: current version, manual check, auto-check toggle. */
          @Composable
          fun UpdatesCard() {
              val data by Store.data.collectAsState()
              val p = data.profile
              val ctx = LocalContext.current
              val s = UpdateUi.status
              SectionCard("App updates") {
                  Text("You have v${BuildConfig.VERSION_NAME} (build ${BuildConfig.VERSION_CODE})")
                  when (s) {
                      is UpdateStatus.Checking -> Text("Checking GitHub…", style = MaterialTheme.typography.bodySmall)
                      is UpdateStatus.UpToDate -> Row(verticalAlignment = Alignment.CenterVertically) {
                          Icon(Icons.Filled.CheckCircle, contentDescription = null, tint = MaterialTheme.colorScheme.primary, modifier = Modifier.size(18.dp))
                          Spacer(Modifier.width(6.dp))
                          Text("You're on the latest build.", style = MaterialTheme.typography.bodySmall)
                      }
                      is UpdateStatus.Failed -> Text(s.message, color = MaterialTheme.colorScheme.error, style = MaterialTheme.typography.bodySmall)
                      is UpdateStatus.Available -> Text("New: v${s.release.version} (build ${s.release.build})", fontWeight = FontWeight.SemiBold)
                      else -> {}
                  }
                  UpdateActions(ctx, s)
                  if (s !is UpdateStatus.Available && s !is UpdateStatus.Downloading && s !is UpdateStatus.Ready) {
                      OutlinedButton(onClick = { UpdateUi.check() }, modifier = Modifier.fillMaxWidth(), enabled = s !is UpdateStatus.Checking) {
                          Icon(Icons.Filled.Refresh, contentDescription = null)
                          Spacer(Modifier.width(8.dp))
                          Text("Check for updates")
                      }
                  }
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Text("Check automatically when the app opens", modifier = Modifier.weight(1f))
                      Switch(checked = p.autoUpdateCheck, onCheckedChange = { Store.setProfile(p.copy(autoUpdateCheck = it)) })
                  }
                  TextButton(onClick = { runCatching { ctx.startActivity(Updater.releasesPageIntent()) } }) { Text("Open releases on GitHub") }
              }
          }

