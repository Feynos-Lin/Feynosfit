          @Composable
          fun CalorieRing(consumed: Double, budget: Double, modifier: Modifier = Modifier, diameter: Dp = 140.dp) {
              val remaining = budget - consumed
              val frac = if (budget <= 0) 0f else (consumed / budget).toFloat().coerceIn(0f, 1f)
              val track = MaterialTheme.colorScheme.surfaceVariant
              val col = if (remaining < 0) MaterialTheme.colorScheme.error else MaterialTheme.colorScheme.primary
              Box(modifier.size(diameter), contentAlignment = Alignment.Center) {
                  Canvas(Modifier.fillMaxSize()) {
                      val sw = this.size.minDimension * 0.09f
                      val tl = Offset(sw / 2, sw / 2)
                      val arc = Size(this.size.width - sw, this.size.height - sw)
                      drawArc(track, 135f, 270f, false, tl, arc, style = Stroke(width = sw, cap = StrokeCap.Round))
                      if (frac > 0f) {
                          drawArc(col, 135f, 270f * frac, false, tl, arc, style = Stroke(width = sw, cap = StrokeCap.Round))
                      }
                  }
                  Column(horizontalAlignment = Alignment.CenterHorizontally) {
                      Text(abs(remaining).f0(), style = MaterialTheme.typography.headlineMedium, fontWeight = FontWeight.Bold)
                      Text(if (remaining >= 0) "Remaining" else "Over", style = MaterialTheme.typography.bodySmall)
                  }
              }
          }

          @Composable
          fun MacroPie(p: Double, c: Double, f: Double, modifier: Modifier = Modifier) {
              val total = p * 4 + c * 4 + f * 9
              val track = MaterialTheme.colorScheme.surfaceVariant
              Canvas(modifier.size(110.dp)) {
                  val sw = this.size.minDimension * 0.18f
                  val tl = Offset(sw / 2, sw / 2)
                  val s = Size(this.size.width - sw, this.size.height - sw)
                  if (total <= 0) {
                      drawArc(track, 0f, 360f, false, tl, s, style = Stroke(width = sw))
                  } else {
                      var start = -90f
                      listOf(p * 4 to ProteinColor, c * 4 to CarbsColor, f * 9 to FatColor).forEach { (v, col) ->
                          val sweep = (v / total * 360.0).toFloat()
                          drawArc(col, start, sweep, false, tl, s, style = Stroke(width = sw))
                          start += sweep
                      }
                  }
              }
          }

          @Composable
          fun LineChart(
              values: List<Double>,
              modifier: Modifier = Modifier,
              goal: Double? = null,
              color: Color = MaterialTheme.colorScheme.primary,
          ) {
              if (values.isEmpty()) return
              val goalColor = MaterialTheme.colorScheme.tertiary
              val grid = MaterialTheme.colorScheme.outlineVariant
              Canvas(modifier.fillMaxWidth().height(160.dp).padding(vertical = 8.dp)) {
                  val all = if (goal != null) values + goal else values
                  var lo = all.min()
                  var hi = all.max()
                  if (hi - lo < 1.0) {
                      hi += 1.0
                      lo -= 1.0
                  }
                  val pad = (hi - lo) * 0.1
                  lo -= pad
                  hi += pad
                  val h = this.size.height
                  val w = this.size.width
                  fun yOf(v: Double): Float = (h * (1.0 - (v - lo) / (hi - lo))).toFloat()
                  fun xOf(i: Int): Float = if (values.size == 1) w / 2f else w * i / (values.size - 1)
                  for (k in 0..3) {
                      val yy = h * k / 3f
                      drawLine(grid, Offset(0f, yy), Offset(w, yy), 1f)
                  }
                  if (goal != null) {
                      val gy = yOf(goal)
                      drawLine(goalColor, Offset(0f, gy), Offset(w, gy), 3f, pathEffect = PathEffect.dashPathEffect(floatArrayOf(12f, 10f)))
                  }
                  val path = Path()
                  values.forEachIndexed { i, v ->
                      if (i == 0) path.moveTo(xOf(i), yOf(v)) else path.lineTo(xOf(i), yOf(v))
                  }
                  drawPath(path, color, style = Stroke(width = 5f, cap = StrokeCap.Round, join = StrokeJoin.Round))
                  values.forEachIndexed { i, v -> drawCircle(color, 6f, Offset(xOf(i), yOf(v))) }
              }
          }

          @Composable
          fun BarChart(values: List<Double>, labels: List<String>, goal: Double?, modifier: Modifier = Modifier) {
              val bar = MaterialTheme.colorScheme.primary
              val over = MaterialTheme.colorScheme.error
              val goalColor = MaterialTheme.colorScheme.tertiary
              Column(modifier.fillMaxWidth()) {
                  Canvas(Modifier.fillMaxWidth().height(150.dp)) {
                      val h = this.size.height
                      val w = this.size.width
                      val maxV = maxOf(values.maxOrNull() ?: 0.0, goal ?: 0.0, 1.0) * 1.1
                      val n = values.size.coerceAtLeast(1)
                      val slot = w / n
                      val bw = slot * 0.6f
                      values.forEachIndexed { i, v ->
                          val bh = (v / maxV * h).toFloat()
                          val c = if (goal != null && v > goal) over else bar
                          if (bh > 0f) {
                              drawRoundRect(
                                  c,
                                  topLeft = Offset(i * slot + (slot - bw) / 2f, h - bh),
                                  size = Size(bw, bh),
                                  cornerRadius = CornerRadius(6f, 6f),
                              )
                          }
                      }
                      if (goal != null) {
                          val gy = (h - goal / maxV * h).toFloat()
                          drawLine(goalColor, Offset(0f, gy), Offset(w, gy), 3f, pathEffect = PathEffect.dashPathEffect(floatArrayOf(12f, 10f)))
                      }
                  }
                  if (labels.isNotEmpty() && labels.size <= 10) {
                      Row(Modifier.fillMaxWidth()) {
                          labels.forEach {
                              Text(it, Modifier.weight(1f), textAlign = TextAlign.Center, style = MaterialTheme.typography.labelSmall)
                          }
                      }
                  }
              }
          }

