              fun parseA5(data: ByteArray): A5Frame? {
                  if (data.size < 11 || (data[0].toInt() and 0xFF) != 0xA5) return null
                  val len = u16le(data, 3)
                  if (data.size != len + 6) return null
                  return A5Frame(
                      flags = data[1].toInt() and 0xFF,
                      seq = data[2].toInt() and 0xFF,
                      opcode = u16le(data, 7),
                      channel = data[10].toInt() and 0xFF,
                      payload = data.copyOfRange(11, data.size),
                      raw = data,
                  )
              }

              fun buildA5(seq: Int, opcode: Int, payload: ByteArray, channel: Int): ByteArray {
                  val body = byteArrayOf(0x01, (opcode and 0xFF).toByte(), (opcode shr 8).toByte(), 0x00, channel.toByte()) + payload
                  val frame = byteArrayOf(0xA5.toByte(), 0x23, seq.toByte(), (body.size and 0xFF).toByte(), (body.size shr 8).toByte(), 0x00) + body
                  var sum = 0
                  for (b in frame) sum += b.toInt() and 0xFF
                  frame[5] = ((0xFF - (sum and 0xFF)) and 0xFF).toByte()
                  return frame
              }

              /** Reassembles A5 frames split across BLE notifications; other bytes are returned as-is. */
              class Reassembler {
                  private val buf = java.io.ByteArrayOutputStream()
                  private var expected = 0

                  fun feed(chunk: ByteArray): List<ByteArray> {
                      val out = ArrayList<ByteArray>()
                      for (b in chunk) {
                          if (buf.size() == 0) {
                              if ((b.toInt() and 0xFF) != 0xA5) continue
                              buf.write(b.toInt())
                          } else {
                              buf.write(b.toInt())
                              val cur = buf.toByteArray()
                              if (cur.size == 5) expected = u16le(cur, 3) + 6
                              if (expected > 0 && cur.size == expected) {
                                  out.add(cur)
                                  buf.reset()
                                  expected = 0
                              }
                          }
                      }
                      return out
                  }

                  fun reset() {
                      buf.reset()
                      expected = 0
                  }
