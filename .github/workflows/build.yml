                                          refresh()
                                      }.onFailure { Toast.makeText(ctx, it.friendly(), Toast.LENGTH_LONG).show() }
                                  }
                              }
                          }

                          val inc = info?.incoming.orEmpty()
                          if (inc.isNotEmpty()) {
                              item { ListHeader("Friend requests") }
                              items(inc) { p ->
                                  ElevatedCard(Modifier.fillMaxWidth()) {
                                      Row(Modifier.padding(12.dp), verticalAlignment = Alignment.CenterVertically) {
                                          Avatar(p.displayName)
                                          Spacer(Modifier.width(12.dp))
                                          Column(Modifier.weight(1f)) {
                                              Text(p.displayName, fontWeight = FontWeight.SemiBold)
                                              Text("@${p.username}", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                                          }
                                          TextButton(onClick = { act { Social.removeFriend(ctx, p.id) } }) { Text("Decline") }
                                          Button(onClick = { act("You're now friends!") { Social.acceptFriend(ctx, p.id) } }) { Text("Accept") }
                                      }
                                  }
                              }
                          }

                          item {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Text("Challenges", style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.SemiBold, modifier = Modifier.weight(1f))
                                  FilledTonalButton(onClick = { showNew = true }, enabled = info?.friends?.isNotEmpty() == true) {
                                      Icon(Icons.Filled.Add, contentDescription = null)
                                      Spacer(Modifier.width(4.dp))
                                      Text("New")
                                  }
                              }
                          }
                          if (challenges.isEmpty()) {
                              item {
                                  Text(
                                      if (info?.friends.isNullOrEmpty()) "Add a friend first, then start a challenge." else "No challenges yet. Start one — a weekend step race is a good first one.",
