                      private set
                  var iv: ByteArray? = null
                      private set

                  private fun nextSeq(): Int {
                      seq = (seq + 1) and 0xFF
                      return seq
                  }

                  /** First message the app sends. */
                  fun keyExchange(nowSeconds: Long = System.currentTimeMillis() / 1000): ByteArray {
                      d = randPrime(40000, 46340)
                      val e = randPrime(10, 100)
                      g = 5 + rng.nextInt(16)
                      val f = modPow(e.toLong(), g, d.toLong()).toInt()
                      val rmac = reversedMac(mac)
                      val offsetSec = TimeZone.getDefault().getOffset(nowSeconds * 1000) / 1000
                      val tz = ((offsetSec * 2 / 3600) and 0xFF).toByte()
                      val payload = le32(nowSeconds) + byteArrayOf(tz, rmac.size.toByte()) + rmac +
                          byteArrayOf((d and 0xFF).toByte(), (d shr 8).toByte(), e.toByte(), (f and 0xFF).toByte(), (f shr 8).toByte())
                      return buildA5(nextSeq(), OP_KEY_EXCHANGE, payload, 0)
                  }

                  /** Handle the scale's key-exchange reply; returns the verify frame to send. */
                  fun onKeyExchangeReply(frame: A5Frame): ByteArray? {
                      val h = scalePublic(frame) ?: return null
                      val shared = modPow(h.toLong(), g, d.toLong())
                      val k = deriveKey(shared, mac)
                      val newIv = ByteArray(16).also { rng.nextBytes(it) }
                      key = k
                      iv = newIv
                      return buildVerify(nextSeq(), mac, newIv, k)
                  }

                  fun decrypt(frame: A5Frame): ByteArray? {
                      val k = key ?: return null
                      val v = iv ?: return null
                      return decryptPayload(k, v, frame)
                  }

                  /** Set the scale's display unit (0 = kg, 1 = lb, 2 = st). */
                  fun setUnit(unit: Int): ByteArray? {
                      val k = key ?: return null
                      val v = iv ?: return null
                      return buildSetUnit(nextSeq(), unit, k, v)
                  }

                  // For tests.
                  internal fun forceDh(d: Int, g: Int) {
                      this.d = d
                      this.g = g
                  }

                  private fun randPrime(lo: Int, hi: Int): Int {
                      while (true) {
                          val n = lo + rng.nextInt(hi - lo + 1)
                          if (isPrime(n)) return n
                      }
                  }
              }

              fun scalePublic(frame: A5Frame): Int? {
                  if (frame.opcode != OP_KEY_EXCHANGE) return null
                  val r = frame.payload
                  if (r.size < 2) return null
                  val p = r[1].toInt() and 0xFF
                  if (r.size < p + 4) return null
                  return u16le(r, p + 2)
              }

              fun deriveKey(shared: Long, mac: String): ByteArray {
                  val md = MessageDigest.getInstance("SHA-256")
                  md.update(shared.toString().toByteArray(Charsets.US_ASCII))
                  md.update(",".toByteArray(Charsets.US_ASCII))
                  md.update(reversedMac(mac))
                  return md.digest().copyOfRange(0, 16)
              }

              fun buildVerify(seq: Int, mac: String, iv: ByteArray, key: ByteArray): ByteArray {
                  val rmac = reversedMac(mac)
                  val inner = byteArrayOf(0x0C) + rmac + byteArrayOf(iv.size.toByte()) + iv
                  return buildA5(seq, OP_KEY_VERIFY, aes(Cipher.ENCRYPT_MODE, key, ByteArray(16), pad(inner)), 1)
              }

              fun buildSetUnit(seq: Int, unit: Int, key: ByteArray, iv: ByteArray): ByteArray =
                  buildA5(seq, OP_SET_UNIT, aes(Cipher.ENCRYPT_MODE, key, iv, pad(byteArrayOf(unit.toByte()))), 1)

              fun decryptPayload(key: ByteArray, iv: ByteArray, frame: A5Frame): ByteArray? {
                  val ct = frame.payload.copyOfRange(0, frame.payload.size / 16 * 16)
                  if (ct.isEmpty()) return null
                  return unpad(runCatching { aes(Cipher.DECRYPT_MODE, key, iv, ct) }.getOrNull() ?: return null)
              }

              /** Payload of a plaintext 0x41xx frame: the "channel" byte is really the first data byte. */
              fun plainPayload(frame: A5Frame): ByteArray = byteArrayOf(frame.channel.toByte()) + frame.payload

              /** Decrypted 0x4421 / plaintext 0x4121 live weight. */
              fun parseLive(pt: ByteArray): Reading? =
                  if (pt.size < 11) null else Reading(u24le(pt, 0) / 1000.0, final = false)

              /** Decrypted 0x443A final result. */
              fun parseResult(pt: ByteArray, c651: Boolean = false): Reading? {
                  if (pt.size < 33) return null
                  val imp = u16le(pt, 25)
                  val hr = if (!c651 && pt.size >= 37 && pt[36].toInt() != 0) pt[36].toInt() and 0xFF else null
                  return Reading(u24le(pt, 22) / 1000.0, final = true, heartRate = hr, impedance = if (!c651 && imp in 1..59999) imp else null)
              }

              /** Plaintext 0x413C final result (pass [plainPayload]). */
              fun parseResultPlain(pt: ByteArray): Reading? {
                  if (pt.size < 31) return null
                  val imp = u16le(pt, 25)
                  val hr = if (pt.size >= 35 && pt[34].toInt() != 0) pt[34].toInt() and 0xFF else null
                  return Reading(u24le(pt, 22) / 1000.0, final = true, heartRate = hr, impedance = if (imp in 1..59999) imp else null)
              }

              // ------------------------------------------------------------------ QN dialect (ESF-24/17/18)

              private const val QN_EPOCH_OFFSET = 946656000L

              private fun withSum(b: ByteArray): ByteArray {
                  var s = 0
                  for (x in b) s += x.toInt() and 0xFF
                  return b + byteArrayOf((s and 0xFF).toByte())
              }

              fun qnIsUnitRequest(p: ByteArray) = p.size >= 10 && p[0].toInt() == 0x12
              fun qnIsInitRequest(p: ByteArray, vendor: Int) = p.size >= 11 && p[0].toInt() == 0x14 && p[1].toInt() == 0x0B && (p[2].toInt() and 0xFF) == vendor
              fun qnIsMeasurement(p: ByteArray, vendor: Int) = p.size >= 11 && p[0].toInt() == 0x10 && p[1].toInt() == 0x0B && (p[2].toInt() and 0xFF) == vendor

              /** unit: 0 = kg, 1 = lb, 2 = st */
              fun qnUnitCommand(unit: Int, vendor: Int): ByteArray {
                  val c = byteArrayOf(0x13, 0x09, vendor.toByte(), 0x00, 0x10, 0x28, 0x37, 0x00)
                  c[3] = when (unit) { 1 -> 2; 2 -> 8; else -> 1 }.toByte()
                  return withSum(c)
              }

              fun qnTimeCommand(vendor: Int, nowSeconds: Long = System.currentTimeMillis() / 1000): ByteArray =
                  withSum(byteArrayOf(0x20, 0x08, vendor.toByte()) + le32(nowSeconds - QN_EPOCH_OFFSET))

              fun qnEndCommand(vendor: Int): ByteArray = withSum(byteArrayOf(0x1F, 0x05, vendor.toByte(), 0x10))

              fun qnParse(p: ByteArray, vendor: Int): Reading? {
                  if (!qnIsMeasurement(p, vendor)) return null
                  val kg = (((p[3].toInt() and 0xFF) shl 8) or (p[4].toInt() and 0xFF)) / 100.0
                  return Reading(kg, final = p[5].toInt() == 1)
              }

              // ------------------------------------------------------------------ helpers

              private fun aes(mode: Int, key: ByteArray, iv: ByteArray, data: ByteArray): ByteArray {
                  val c = Cipher.getInstance("AES/CBC/NoPadding")
                  c.init(mode, SecretKeySpec(key, "AES"), IvParameterSpec(iv))
                  return c.doFinal(data)
              }

              private fun pad(d: ByteArray): ByteArray {
                  val n = 16 - d.size % 16
                  return d + ByteArray(n) { n.toByte() }
              }

              private fun unpad(d: ByteArray): ByteArray {
                  if (d.isEmpty()) return d
                  val n = d.last().toInt() and 0xFF
                  if (n in 1..16 && n <= d.size && (d.size - n until d.size).all { (d[it].toInt() and 0xFF) == n }) {
                      return d.copyOfRange(0, d.size - n)
                  }
                  return d
              }

              fun modPow(base: Long, exp: Int, mod: Long): Long {
                  var r = 1L
                  var b = base % mod
                  var e = exp
                  while (e > 0) {
                      if (e and 1 == 1) r = r * b % mod
                      b = b * b % mod
                      e = e shr 1
                  }
                  return r
              }

              private fun isPrime(n: Int): Boolean {
                  if (n < 2) return false
                  if (n % 2 == 0) return n == 2
                  var i = 3
                  while (i * i <= n) {
                      if (n % i == 0) return false
                      i += 2
                  }
                  return true
              }

              private fun le32(v: Long): ByteArray = byteArrayOf(
                  (v and 0xFF).toByte(), ((v shr 8) and 0xFF).toByte(), ((v shr 16) and 0xFF).toByte(), ((v shr 24) and 0xFF).toByte(),
              )

              fun u16le(b: ByteArray, o: Int) = (b[o].toInt() and 0xFF) or ((b[o + 1].toInt() and 0xFF) shl 8)
              fun u16be(b: ByteArray, o: Int) = ((b[o].toInt() and 0xFF) shl 8) or (b[o + 1].toInt() and 0xFF)
              fun u24le(b: ByteArray, o: Int) = (b[o].toInt() and 0xFF) or ((b[o + 1].toInt() and 0xFF) shl 8) or ((b[o + 2].toInt() and 0xFF) shl 16)
          }
