                      title = "Steps today",
                      label = "Steps",
                      initial = if (steps > 0) steps.toString() else "",
                      decimal = false,
                      onDismiss = { stepsDialog = false },
                  ) { v ->
                      Store.setSteps(today, v.roundToInt())
                      stepsDialog = false
                  }
              }
          }
