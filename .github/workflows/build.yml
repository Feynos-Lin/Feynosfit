                          ChoiceRow(presets.map { it.first }, preset) { preset = it }
                          Text(prettyRange(presets[preset].second.toString(), presets[preset].third.toString()), style = MaterialTheme.typography.bodySmall)
                          Text("Invite", style = MaterialTheme.typography.labelLarge)
                          friends.forEach { f ->
