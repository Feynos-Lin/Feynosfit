              /** ESF-551 frame: A5 02 ?? 10 00 ?? 01 61 A1 00 ... (22 bytes). */
              fun parseEsf551(f: ByteArray): Reading? {
                  if (f.size != 22) return null
                  if ((f[0].toInt() and 0xFF) != 0xA5 || f[1].toInt() != 0x02) return null
                  if (f[3].toInt() != 0x10 || f[4].toInt() != 0x00) return null
                  if (f[6].toInt() != 0x01 || (f[7].toInt() and 0xFF) != 0x61 || (f[8].toInt() and 0xFF) != 0xA1 || f[9].toInt() != 0x00) return null
