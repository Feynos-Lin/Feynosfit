# Feynos Fit — food & fitness tracker for Android.
# This one file contains the ENTIRE app. Put it in your repo at:
#     .github/workflows/build.yml
# Every push (or a manual run from the Actions tab) writes out the full
# Android project, builds the APK, and publishes it under Releases.
#
# To ship an update: change APP_VERSION below, then commit.

name: Build Feynos Fit

on:
  push:
    branches: [main, master]
    paths: [".github/workflows/build.yml"]   # server/ changes don't rebuild the app
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "0.6"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Write project files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p FeynosFit && cd FeynosFit
          mkdir -p 'app' 'app/src/main' 'app/src/main/java/com/feynos/fit' 'app/src/main/java/com/feynos/fit/data' 'app/src/main/java/com/feynos/fit/ui' 'app/src/main/java/com/feynos/fit/widget' 'app/src/main/res/drawable' 'app/src/main/res/layout' 'app/src/main/res/mipmap-anydpi-v26' 'app/src/main/res/values' 'app/src/main/res/values-night' 'app/src/main/res/xml'

          cat > 'build.gradle.kts' <<'FEYNOS_EOF'
          plugins {
              id("com.android.application") version "8.10.1" apply false
              id("org.jetbrains.kotlin.android") version "2.1.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.1.21" apply false
          }
          FEYNOS_EOF

          cat > 'gradle.properties' <<'FEYNOS_EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          FEYNOS_EOF

          cat > 'settings.gradle.kts' <<'FEYNOS_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FeynosFit"
          include(":app")
          FEYNOS_EOF

          cat > 'app/build.gradle.kts' <<'FEYNOS_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.feynos.fit"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.feynos.fit"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInt()
                  versionName = System.getenv("APP_VERSION") ?: "0.6"
              }

              signingConfigs {
                  getByName("debug") {
                      storeFile = file("debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }

              buildTypes {
                  getByName("release") {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
                  freeCompilerArgs += listOf(
                      "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api",
                      "-opt-in=androidx.compose.foundation.layout.ExperimentalLayoutApi",
                      "-opt-in=androidx.compose.foundation.ExperimentalFoundationApi",
                  )
              }
              buildFeatures {
                  compose = true
                  buildConfig = true
              }
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.09.00")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("com.google.android.gms:play-services-code-scanner:16.1.0")
