                  SectionCard("Goal") {
                      ChoiceRow(Calc.goalNames, goalType) { goalType = it }
                      if (goalType != 1) {
                          Text("Pace", style = MaterialTheme.typography.labelLarge)
                          ChoiceRow((0..3).map { Calc.rateLabel(it, imperial) }, rateIdx) { rateIdx = it }
                      }
                      NumField(goalWeight, { goalWeight = it }, "Goal weight (${Units.weightUnit(imperial)})", Modifier.fillMaxWidth())
                  }

                  SectionCard("Daily targets") {
                      if (recommended != null) {
                          Text(
