          fun exerciseDetail(x: ExerciseEntry, imperial: Boolean): String {
              if (x.kind == "strength") {
                  val parts = mutableListOf<String>()
                  if (x.sets > 0 || x.reps > 0) parts.add("${x.sets} × ${x.reps}")
                  if (x.weightKg > 0) parts.add("@ " + Units.weight(x.weightKg, imperial))
                  if (x.minutes > 0) parts.add("${x.minutes} min")
                  return if (parts.isEmpty()) "Strength" else parts.joinToString(" ")
              }
              if (x.kind == "health") return "${x.minutes} min · imported"
              return "${x.minutes} min"
          }

          @Composable
          private fun DiarySummary(goal: Int, food: Double, exercise: Double) {
              val remaining = goal - food + exercise
              ElevatedCard(Modifier.fillMaxWidth()) {
                  Column(Modifier.padding(16.dp)) {
                      Text("Calories remaining", style = MaterialTheme.typography.titleSmall)
                      Spacer(Modifier.height(8.dp))
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Stat("Goal", goal.toString(), Modifier.weight(1f))
                          Text("−")
                          Stat("Food", food.f0(), Modifier.weight(1f))
                          Text("+")
                          Stat("Exercise", exercise.f0(), Modifier.weight(1f))
                          Text("=")
                          Stat(
                              "Remaining",
                              remaining.f0(),
                              Modifier.weight(1f),
                              if (remaining < 0) MaterialTheme.colorScheme.error else MaterialTheme.colorScheme.primary,
                          )
                      }
                  }
              }
          }

