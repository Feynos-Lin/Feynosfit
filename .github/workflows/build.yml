          @Composable
          private fun CardioDialog(
              initialName: String,
              met: Double,
              weightKg: Double,
              onDismiss: () -> Unit,
              onSave: (String, Int, Double) -> Unit,
          ) {
              var name by remember { mutableStateOf(initialName) }
              var minutes by remember { mutableStateOf("30") }
              var kcalText by remember { mutableStateOf("") }
              val mins = minutes.toIntOrNull() ?: 0
              val auto = if (met > 0) Calc.exerciseKcal(met, weightKg, mins.toDouble()) else 0.0
              val kcal = parseNum(kcalText) ?: auto
              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = { Text(if (met > 0) initialName else "Custom exercise") },
                  text = {
                      Column(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                          if (met <= 0) {
                              OutlinedTextField(name, { name = it }, Modifier.fillMaxWidth(), label = { Text("Exercise name") }, singleLine = true)
                          }
                          NumField(minutes, { minutes = it }, "Minutes", Modifier.fillMaxWidth(), decimal = false)
                          NumField(
                              kcalText,
                              { kcalText = it },
                              if (met > 0) "Calories burned (estimate: ${auto.f0()})" else "Calories burned",
                              Modifier.fillMaxWidth(),
                          )
                          if (met > 0) {
                              Text(
                                  "Estimated from your weight and the activity's MET value (${met.f1()}). Leave blank to use the estimate, or enter your watch's number.",
                                  style = MaterialTheme.typography.bodySmall,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant,
                              )
                          }
                      }
                  },
                  confirmButton = {
                      TextButton(
                          enabled = mins > 0 && name.isNotBlank() && (met > 0 || parseNum(kcalText) != null),
                          onClick = { onSave(name.trim(), mins, kcal) },
                      ) { Text("Add") }
                  },
                  dismissButton = { TextButton(onClick = onDismiss) { Text("Cancel") } },
              )
          }

          @Composable
          private fun StrengthForm(date: String, imperial: Boolean, bodyKg: Double, onAdd: (ExerciseEntry) -> Unit) {
              var name by rememberSaveable { mutableStateOf("") }
              var sets by rememberSaveable { mutableStateOf("3") }
              var reps by rememberSaveable { mutableStateOf("10") }
              var weight by rememberSaveable { mutableStateOf("") }
              var minutes by rememberSaveable { mutableStateOf("") }
              val data by Store.data.collectAsState()
              val todays = data.exercises.filter { it.date == date && it.kind == "strength" }
              val mins = minutes.toIntOrNull() ?: 0
              val kcal = Calc.exerciseKcal(3.5, bodyKg, mins.toDouble())

              Column(
                  Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(16.dp),
                  verticalArrangement = Arrangement.spacedBy(12.dp),
              ) {
                  OutlinedTextField(name, { name = it }, Modifier.fillMaxWidth(), label = { Text("Exercise") }, singleLine = true)
                  FlowRow(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                      FoodDb.strength.forEach { s ->
                          SuggestionChip(onClick = { name = s }, label = { Text(s) })
                      }
                  }
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      NumField(sets, { sets = it }, "Sets", Modifier.weight(1f), decimal = false)
                      NumField(reps, { reps = it }, "Reps", Modifier.weight(1f), decimal = false)
                      NumField(weight, { weight = it }, "Weight ${Units.weightUnit(imperial)}", Modifier.weight(1f))
                  }
                  NumField(minutes, { minutes = it }, "Minutes (optional, for calories)", Modifier.fillMaxWidth(), decimal = false)
                  if (mins > 0) {
                      Text(
                          "≈ ${kcal.f0()} calories",
                          style = MaterialTheme.typography.bodySmall,
                          color = MaterialTheme.colorScheme.onSurfaceVariant,
                      )
                  }
                  Button(
                      onClick = {
                          onAdd(
                              ExerciseEntry(
                                  date = date,
                                  name = name.trim(),
                                  kind = "strength",
                                  minutes = mins,
                                  kcal = kcal,
                                  sets = sets.toIntOrNull() ?: 0,
                                  reps = reps.toIntOrNull() ?: 0,
                                  weightKg = parseNum(weight)?.let { Units.toKg(it, imperial) } ?: 0.0,
                              ),
                          )
                      },
                      enabled = name.isNotBlank(),
                      modifier = Modifier.fillMaxWidth(),
                  ) { Text("Log set") }

                  if (todays.isNotEmpty()) {
                      SectionCard("Logged this day") {
                          todays.forEach { x ->
                              Row {
                                  Text(x.name, modifier = Modifier.weight(1f))
                                  Text(exerciseDetail(x, imperial), color = MaterialTheme.colorScheme.onSurfaceVariant)
                              }
                          }
                      }
                  }
              }
          }
