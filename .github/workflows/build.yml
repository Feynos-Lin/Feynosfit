          package com.feynos.fit.data

          import java.time.LocalDate
          import java.time.format.DateTimeFormatter
          import java.time.format.TextStyle
          import java.util.Locale
          import kotlin.math.roundToInt

          fun Double.safe(): Double = if (isNaN() || isInfinite()) 0.0 else this

          /** Whole number, e.g. 1234 */
          fun Double.f0(): String = safe().roundToInt().toString()

          /** One decimal, trailing ".0" removed, e.g. 72.5 / 80 */
          fun Double.f1(): String {
              val r = (safe() * 10).roundToInt() / 10.0
              return if (r == r.toLong().toDouble()) r.toLong().toString() else String.format(Locale.US, "%.1f", r)
          }

          /** Up to two decimals for editable fields, e.g. 1.25 / 2 */
          fun Double.num(): String {
              val s = String.format(Locale.US, "%.2f", safe())
              return s.trimEnd('0').trimEnd('.')
          }

          fun Int.grouped(): String = String.format(Locale.US, "%,d", this)

          fun parseNum(s: String): Double? = s.trim().replace(',', '.').toDoubleOrNull()?.safe()

          object Dates {
              fun today(): String = LocalDate.now().toString()

              fun label(date: String): String {
                  val d = LocalDate.parse(date)
                  val t = LocalDate.now()
                  return when (d) {
                      t -> "Today"
                      t.minusDays(1) -> "Yesterday"
                      t.plusDays(1) -> "Tomorrow"
                      else -> d.format(DateTimeFormatter.ofPattern("EEE, MMM d", Locale.getDefault()))
                  }
              }

              fun long(date: String): String =
                  LocalDate.parse(date).format(DateTimeFormatter.ofPattern("EEEE, MMMM d", Locale.getDefault()))

              fun short(date: String): String =
                  LocalDate.parse(date).format(DateTimeFormatter.ofPattern("M/d", Locale.getDefault()))

              fun weekdayLetter(date: String): String =
                  LocalDate.parse(date).dayOfWeek.getDisplayName(TextStyle.NARROW, Locale.getDefault())

              fun shift(date: String, days: Long): String = LocalDate.parse(date).plusDays(days).toString()

              fun lastNDays(n: Int): List<String> {
                  val t = LocalDate.now()
                  return (n - 1 downTo 0).map { t.minusDays(it.toLong()).toString() }
              }
          }
