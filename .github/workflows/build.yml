                          }
                          SectionCard("Units") {
                              ChoiceRow(listOf("US (lb, fl oz)", "Metric (kg, ml)"), if (p.imperial) 0 else 1) {
                                  Store.setProfile(p.copy(imperial = it == 0))
                              }
                          }
                          SectionCard("Appearance") {
                              ChoiceRow(listOf("System", "Light", "Dark"), p.theme) { Store.setProfile(p.copy(theme = it)) }
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Column(Modifier.weight(1f)) {
                                      Text("Wallpaper colors")
                                      Text(
                                          "Match your phone's Material You palette",
                                          style = MaterialTheme.typography.bodySmall,
                                          color = MaterialTheme.colorScheme.onSurfaceVariant,
                                      )
                                  }
                                  Switch(checked = p.dynamicColor, onCheckedChange = { Store.setProfile(p.copy(dynamicColor = it)) })
                              }
                          }
                          SectionCard("Your data") {
                              Text(
                                  "Everything is stored only on this phone. Save a backup file before uninstalling or switching phones.",
