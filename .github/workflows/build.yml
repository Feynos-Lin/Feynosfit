          @Composable
          private fun MeCard(session: Social.Session?, info: Social.FriendsInfo?) {
              val ctx = LocalContext.current
              val code = session?.friendCode.orEmpty()
              val pretty = if (code.length == 8) code.substring(0, 4) + "-" + code.substring(4) else code
              SectionCard(session?.displayName ?: "You") {
                  info?.let {
                      Text("${it.me.today.grouped()} steps today · ${it.me.week.grouped()} this week", style = MaterialTheme.typography.bodyMedium)
                  }
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Column(Modifier.weight(1f)) {
                          Text("Your friend code", style = MaterialTheme.typography.labelMedium, color = MaterialTheme.colorScheme.onSurfaceVariant)
                          Text(pretty, style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.Bold)
                      }
                      TextButton(onClick = {
                          val cm = ctx.getSystemService(Context.CLIPBOARD_SERVICE) as? ClipboardManager
                          cm?.setPrimaryClip(ClipData.newPlainText("Feynos Fit friend code", code))
                          Toast.makeText(ctx, "Copied", Toast.LENGTH_SHORT).show()
                      }) { Text("Copy") }
                      Button(onClick = {
                          val text = "Add me on Feynos Fit! My friend code is $pretty" +
