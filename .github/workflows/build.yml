          package com.feynos.fit.widget

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.RectF
          import android.os.Handler
          import android.os.Looper
          import android.widget.RemoteViews
          import com.feynos.fit.MainActivity
          import com.feynos.fit.R
          import com.feynos.fit.data.Calc
          import com.feynos.fit.data.Dates
          import com.feynos.fit.data.Nutrients
          import com.feynos.fit.data.Store
          import com.feynos.fit.data.Units
          import com.feynos.fit.data.f0
          import com.feynos.fit.data.grouped
          import kotlin.math.abs

          /**
           * "Today" home-screen widget: calories left (ring), eaten / burned / goal, protein-carbs-fat bars,
           * water and steps, plus one-tap "+ Water" and "+ Food".
           */
          class TodayWidget : AppWidgetProvider() {

              override fun onUpdate(context: Context, manager: AppWidgetManager, ids: IntArray) {
                  Store.init(context)
                  render(context, manager, ids)
              }

              override fun onReceive(context: Context, intent: Intent) {
                  if (intent.action == ACTION_ADD_WATER) {
                      Store.init(context)
                      val today = Dates.today()
                      Store.setWater(today, (Store.current.water[today] ?: 0) + GLASS_ML)
                      updateAll(context)
                      return
                  }
                  super.onReceive(context, intent)
              }

              companion object {
                  const val ACTION_ADD_WATER = "com.feynos.fit.widget.ADD_WATER"
                  const val EXTRA_OPEN = "open"
                  const val OPEN_ADD_FOOD = "add_food"
                  private const val GLASS_ML = 250

                  private val main = Handler(Looper.getMainLooper())
                  private var appCtx: Context? = null
                  private val pending = Runnable { appCtx?.let { updateAll(it) } }

                  /** Debounced refresh, safe to call after every data change. */
                  fun requestUpdate(context: Context) {
                      appCtx = context.applicationContext
                      main.removeCallbacks(pending)
                      main.postDelayed(pending, 400)
                  }

                  fun updateAll(context: Context) {
                      val mgr = AppWidgetManager.getInstance(context) ?: return
                      val ids = runCatching { mgr.getAppWidgetIds(ComponentName(context, TodayWidget::class.java)) }.getOrNull() ?: return
                      if (ids.isNotEmpty()) render(context, mgr, ids)
                  }

                  private fun render(context: Context, mgr: AppWidgetManager, ids: IntArray) {
                      val views = build(context)
                      for (id in ids) runCatching { mgr.updateAppWidget(id, views) }
                  }

                  private fun build(ctx: Context): RemoteViews {
                      val d = Store.current
                      val p = d.profile
                      val today = Dates.today()
                      val food = d.diary.filter { it.date == today }.fold(Nutrients.ZERO) { a, e -> a + e.total }
                      val burned = d.exercises.filter { it.date == today }.sumOf { it.kcal }
                      val budget = p.calorieGoal + burned
                      val remaining = budget - food.kcal
                      val (pg, cg, fg) = Calc.macroGrams(p)
                      val water = d.water[today] ?: 0
                      val steps = d.steps[today] ?: 0

                      val v = RemoteViews(ctx.packageName, R.layout.widget_today)

                      val over = remaining < 0
                      v.setImageViewBitmap(R.id.w_ring, ring(ctx, if (budget <= 0) 0f else (food.kcal / budget).toFloat(), over))
                      v.setTextViewText(R.id.w_remaining, abs(remaining).f0())
                      v.setTextViewText(R.id.w_remaining_label, if (over) "cal over" else "cal left")

                      v.setTextViewText(
                          R.id.w_summary,
                          if (p.onboarded) "Eaten ${food.kcal.f0()} · Burned ${burned.f0()} · Goal ${p.calorieGoal}"
                          else "Open Feynos Fit to set your goals",
                      )
                      v.setTextViewText(R.id.w_protein, "Protein ${food.protein.f0()} / ${pg.f0()} g")
                      v.setTextViewText(R.id.w_carbs, "Carbs ${food.carbs.f0()} / ${cg.f0()} g")
                      v.setTextViewText(R.id.w_fat, "Fat ${food.fat.f0()} / ${fg.f0()} g")
                      v.setProgressBar(R.id.w_protein_bar, 1000, permille(food.protein, pg), false)
                      v.setProgressBar(R.id.w_carbs_bar, 1000, permille(food.carbs, cg), false)
                      v.setProgressBar(R.id.w_fat_bar, 1000, permille(food.fat, fg), false)

                      v.setTextViewText(R.id.w_water, "Water ${Units.water(water, p.imperial)}")
                      v.setTextViewText(R.id.w_steps, "${steps.grouped()} steps")

                      // Tapping the widget opens the app; "+ Food" goes straight to food search.
                      val flags = PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      val open = PendingIntent.getActivity(
                          ctx, 0,
                          Intent(ctx, MainActivity::class.java).setAction("com.feynos.fit.OPEN").addFlags(Intent.FLAG_ACTIVITY_NEW_TASK),
                          flags,
                      )
                      val addFood = PendingIntent.getActivity(
                          ctx, 1,
                          Intent(ctx, MainActivity::class.java)
                              .setAction("com.feynos.fit.ADD_FOOD")
                              .putExtra(EXTRA_OPEN, OPEN_ADD_FOOD)
                              .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP),
                          flags,
                      )
                      val addWater = PendingIntent.getBroadcast(
                          ctx, 2,
                          Intent(ctx, TodayWidget::class.java).setAction(ACTION_ADD_WATER),
                          flags,
                      )
                      v.setOnClickPendingIntent(R.id.w_root, open)
                      v.setOnClickPendingIntent(R.id.w_add_food, addFood)
                      v.setOnClickPendingIntent(R.id.w_add_water, addWater)
                      return v
                  }

                  private fun permille(value: Double, goal: Double): Int =
                      if (goal <= 0) 0 else ((value / goal) * 1000).toInt().coerceIn(0, 1000)

                  /** Same 270° gauge as the app's dashboard, drawn to a bitmap. */
                  private fun ring(ctx: Context, fraction: Float, over: Boolean): Bitmap {
                      val px = (76 * ctx.resources.displayMetrics.density).toInt().coerceIn(96, 320)
                      val bmp = Bitmap.createBitmap(px, px, Bitmap.Config.ARGB_8888)
                      val c = Canvas(bmp)
                      val stroke = px * 0.1f
                      val rect = RectF(stroke / 2, stroke / 2, px - stroke / 2, px - stroke / 2)
                      val paint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                          style = Paint.Style.STROKE
                          strokeWidth = stroke
                          strokeCap = Paint.Cap.ROUND
                      }
                      paint.color = ctx.getColor(R.color.widget_track)
                      c.drawArc(rect, 135f, 270f, false, paint)
                      val f = fraction.coerceIn(0f, 1f)
                      if (f > 0f) {
                          paint.color = if (over) 0xFFE5484D.toInt() else ctx.getColor(R.color.widget_accent)
                          c.drawArc(rect, 135f, 270f * f, false, paint)
                      }
                      return bmp
                  }
              }
          }
          FEYNOS_EOF

          # Fixed signing key so each new build installs as an update over the last one
          echo '' | base64 -d > app/debug.keystore
          echo "Generated $(find . -type f | wc -l) project files"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        shell: bash
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        working-directory: FeynosFit
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        shell: bash
        run: |
          mkdir -p dist
          cp FeynosFit/app/build/outputs/apk/release/app-release.apk "dist/FeynosFit-v${APP_VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          ls -la dist

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: FeynosFit-v${{ env.APP_VERSION }}-build${{ github.run_number }}
          path: dist/*.apk

      - name: Publish release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Feynos Fit v${{ env.APP_VERSION }} (build ${{ github.run_number }})
          body: |
            Download the .apk below on your phone and open it to install or update.
            Built from commit ${{ github.sha }}.
          files: dist/*.apk
          make_latest: true
