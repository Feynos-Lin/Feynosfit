          @Composable
          fun EditFoodScreen(id: String?, barcode: String) {
              val nav = LocalNav.current
              val data by Store.data.collectAsState()
              val existing = remember(id) { data.foods.firstOrNull { it.id == id } }
              fun startText(v: Double?): String = if (v == null || v == 0.0) "" else v.num()
              var name by remember { mutableStateOf(existing?.name ?: "") }
              var brand by remember { mutableStateOf(existing?.brand ?: "") }
              var serving by remember { mutableStateOf(existing?.servingDesc ?: "1 serving") }
              var grams by remember { mutableStateOf(startText(existing?.servingGrams)) }
              var kcal by remember { mutableStateOf(startText(existing?.n?.kcal)) }
              var protein by remember { mutableStateOf(startText(existing?.n?.protein)) }
              var carbs by remember { mutableStateOf(startText(existing?.n?.carbs)) }
              var fat by remember { mutableStateOf(startText(existing?.n?.fat)) }
              var fiber by remember { mutableStateOf(startText(existing?.n?.fiber)) }
              var sugar by remember { mutableStateOf(startText(existing?.n?.sugar)) }
              var satFat by remember { mutableStateOf(startText(existing?.n?.satFat)) }
              var sodium by remember { mutableStateOf(startText(existing?.n?.sodiumMg)) }
              var cholesterol by remember { mutableStateOf(startText(existing?.n?.cholesterolMg)) }
              var potassium by remember { mutableStateOf(startText(existing?.n?.potassiumMg)) }
              var code by remember { mutableStateOf(existing?.barcode ?: barcode) }
              var confirmDelete by remember { mutableStateOf(false) }
              fun v(s: String) = parseNum(s) ?: 0.0
              val valid = name.isNotBlank() && parseNum(kcal) != null

              fun save() {
                  Store.saveFood(
                      Food(
                          id = existing?.id ?: newId(),
                          name = name.trim(),
                          brand = brand.trim(),
                          servingDesc = serving.trim().ifBlank { "1 serving" },
                          servingGrams = v(grams),
                          n = Nutrients(
                              kcal = v(kcal), protein = v(protein), carbs = v(carbs), fat = v(fat),
                              fiber = v(fiber), sugar = v(sugar), satFat = v(satFat), sodiumMg = v(sodium),
                              cholesterolMg = v(cholesterol), potassiumMg = v(potassium),
                          ),
                          barcode = code.trim(),
                          source = "custom",
                      ),
                  )
                  nav.pop()
              }

              Scaffold(
                  topBar = {
                      BackTopBar(if (existing == null) "Create food" else "Edit food", { nav.pop() }) {
                          TextButton(enabled = valid, onClick = { save() }) { Text("Save") }
                      }
                  },
              ) { pad ->
                  Centered(Modifier.padding(pad)) {
                      Column(
                          Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(16.dp),
                          verticalArrangement = Arrangement.spacedBy(12.dp),
                      ) {
                          SectionCard("Food") {
                              OutlinedTextField(name, { name = it }, Modifier.fillMaxWidth(), label = { Text("Name *") }, singleLine = true)
                              OutlinedTextField(brand, { brand = it }, Modifier.fillMaxWidth(), label = { Text("Brand (optional)") }, singleLine = true)
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  OutlinedTextField(serving, { serving = it }, Modifier.weight(1.4f), label = { Text("Serving size") }, singleLine = true)
                                  NumField(grams, { grams = it }, "Grams", Modifier.weight(1f))
                              }
                              NumField(code, { code = it }, "Barcode (optional)", Modifier.fillMaxWidth(), decimal = false)
                          }
                          SectionCard("Nutrition per serving") {
                              NumField(kcal, { kcal = it }, "Calories *", Modifier.fillMaxWidth())
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  NumField(protein, { protein = it }, "Protein g", Modifier.weight(1f))
                                  NumField(carbs, { carbs = it }, "Carbs g", Modifier.weight(1f))
                                  NumField(fat, { fat = it }, "Fat g", Modifier.weight(1f))
                              }
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  NumField(fiber, { fiber = it }, "Fiber g", Modifier.weight(1f))
                                  NumField(sugar, { sugar = it }, "Sugar g", Modifier.weight(1f))
                                  NumField(satFat, { satFat = it }, "Sat. fat g", Modifier.weight(1f))
                              }
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  NumField(sodium, { sodium = it }, "Sodium mg", Modifier.weight(1f))
                                  NumField(cholesterol, { cholesterol = it }, "Cholest. mg", Modifier.weight(1f))
                                  NumField(potassium, { potassium = it }, "Potass. mg", Modifier.weight(1f))
                              }
                          }
                          FilledTonalButton(onClick = { save() }, enabled = valid, modifier = Modifier.fillMaxWidth()) { Text("Save food") }
                          if (existing != null) {
                              TextButton(onClick = { confirmDelete = true }, modifier = Modifier.fillMaxWidth()) {
                                  Text("Delete food", color = MaterialTheme.colorScheme.error)
                              }
                          }
                          Spacer(Modifier.height(24.dp))
                      }
                  }
              }

              if (confirmDelete && existing != null) {
                  ConfirmDialog(
                      title = "Delete ${existing.name}?",
                      text = "Entries already in your diary stay as they are.",
                      confirmLabel = "Delete",
                      onConfirm = {
                          Store.deleteFood(existing.id)
                          confirmDelete = false
                          nav.pop()
                      },
                      onDismiss = { confirmDelete = false },
                  )
              }
          }
