                                  if (c.state == "active") {
                                      Text("${s.today.grouped()} today", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                                  }
                              }
                              Text(s.total.grouped(), fontWeight = FontWeight.Bold)
                          }
                          if (leader > 0) {
                              LinearProgressIndicator(
                                  progress = { (s.total.toFloat() / leader).coerceIn(0f, 1f) },
                                  modifier = Modifier.fillMaxWidth().padding(start = 36.dp).height(4.dp),
