                  "Moderate exercise 3–5 days a week",
                  "Hard exercise 6–7 days a week",
                  "Physical job plus hard training",
              )
              private val factors = listOf(1.2, 1.375, 1.55, 1.725, 1.9)
              val goalNames = listOf("Lose weight", "Maintain", "Gain weight")
              private val ratesKg = listOf(0.25, 0.5, 0.75, 1.0)
              private val ratesLb = listOf(0.5, 1.0, 1.5, 2.0)

              fun rateKg(index: Int, imperial: Boolean): Double {
                  val i = index.coerceIn(0, 3)
                  return if (imperial) ratesLb[i] / Units.LB_PER_KG else ratesKg[i]
              }

              fun rateIndex(kg: Double, imperial: Boolean): Int {
                  val list = if (imperial) ratesLb.map { it / Units.LB_PER_KG } else ratesKg
                  return list.indices.minByOrNull { abs(list[it] - kg) } ?: 1
              }

              fun rateLabel(index: Int, imperial: Boolean): String {
                  val i = index.coerceIn(0, 3)
                  return if (imperial) "${ratesLb[i].f1()} lb/week" else "${ratesKg[i]} kg/week"
              }

              /** Mifflin-St Jeor */
              fun bmr(p: Profile): Double =
                  10 * p.weightKg + 6.25 * p.heightCm - 5 * p.age + (if (p.male) 5 else -161)

              fun tdee(p: Profile): Double = bmr(p) * factors[p.activity.coerceIn(0, 4)]

              fun recommendedCalories(p: Profile): Int {
                  val delta = p.rateKg * 7700.0 / 7.0
                  val t = tdee(p)
                  val target = when (p.goalType) {
                      0 -> t - delta
                      2 -> t + delta
                      else -> t
                  }
                  val floor = if (p.male) 1500.0 else 1200.0
                  return (max(target, floor) / 10).roundToInt() * 10
              }

              /** grams of protein, carbs, fat */
              fun macroGrams(p: Profile): Triple<Double, Double, Double> = Triple(
                  p.calorieGoal * p.proteinPct / 100.0 / 4.0,
                  p.calorieGoal * p.carbsPct / 100.0 / 4.0,
                  p.calorieGoal * p.fatPct / 100.0 / 9.0,
              )

              fun bmi(p: Profile): Double {
                  if (p.heightCm <= 0) return 0.0
                  val m = p.heightCm / 100.0
                  return p.weightKg / (m * m)
              }

              fun bmiLabel(b: Double): String = when {
                  b <= 0 -> ""
                  b < 18.5 -> "Underweight"
                  b < 25 -> "Healthy range"
                  b < 30 -> "Overweight"
                  else -> "Obese range"
              }

              fun exerciseKcal(met: Double, kg: Double, minutes: Double): Double = met * kg * minutes / 60.0

              fun defaultMeal(): Int {
                  val h = LocalTime.now().hour
                  return when {
                      h < 11 -> 0
                      h < 16 -> 1
                      h < 21 -> 2
                      else -> 3
                  }
              }

              /** Consecutive days with at least one food logged, ending today (or yesterday). */
              fun streak(diary: List<DiaryEntry>): Int {
                  val days = diary.map { it.date }.toHashSet()
                  var d = LocalDate.now()
                  if (!days.contains(d.toString())) d = d.minusDays(1)
                  var n = 0
                  while (days.contains(d.toString())) {
                      n++
                      d = d.minusDays(1)
                  }
                  return n
              }
          }
