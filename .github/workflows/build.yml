          /** Runs [block] off the main thread and returns its error message, if any. */
          private suspend fun <T> io(block: () -> T): Result<T> = withContext(Dispatchers.IO) { runCatching(block) }

          private fun Throwable.friendly(): String = message ?: "Something went wrong"

          @Composable
          fun FriendsScreen() {
              val ctx = LocalContext.current
              var session by remember { mutableStateOf(Social.session(ctx)) }
              if (session == null) {
                  ConnectScreen { session = Social.session(ctx) }
              } else {
                  SocialHome(onSignedOut = { session = null })
              }
          }

          // ================================================================ connect / sign in

          @Composable
          private fun ConnectScreen(onConnected: () -> Unit) {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              var tab by remember { mutableIntStateOf(0) }
              var server by remember { mutableStateOf(Social.lastServer(ctx)) }
              var invite by remember { mutableStateOf("") }
              var username by remember { mutableStateOf("") }
              var display by remember { mutableStateOf(com.feynos.fit.data.Store.current.profile.name) }
              var password by remember { mutableStateOf("") }
              var busy by remember { mutableStateOf(false) }
              var error by remember { mutableStateOf<String?>(null) }

              fun submit() {
                  busy = true
                  error = null
                  scope.launch {
                      val r = io {
                          Social.checkServer(server)
                          if (tab == 0) Social.login(ctx, server, username, password)
                          else Social.register(ctx, server, invite, username, display, password)
                          runCatching { Social.pushSteps(ctx) }
                      }
                      busy = false
                      r.onSuccess { onConnected() }.onFailure { error = it.friendly() }
                  }
              }

              Scaffold(topBar = { TopAppBar(title = { Text("Friends") }) }) { pad ->
                  Centered(Modifier.padding(pad)) {
                      Column(
                          Modifier.verticalScroll(rememberScrollState()).padding(16.dp),
                          verticalArrangement = Arrangement.spacedBy(12.dp),
                      ) {
                          SectionCard("Compete with friends") {
                              Text(
                                  "Add friends and run step challenges through your own Feynos Fit server. Only your display name and daily step totals are shared — never food, weight or other health data.",
                                  style = MaterialTheme.typography.bodyMedium,
                              )
                          }
                          ElevatedCard(Modifier.fillMaxWidth()) {
                              Column {
                                  TabRow(selectedTabIndex = tab) {
                                      Tab(selected = tab == 0, onClick = { tab = 0; error = null }, text = { Text("Sign in") })
                                      Tab(selected = tab == 1, onClick = { tab = 1; error = null }, text = { Text("Create account") })
                                  }
                                  Column(Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                                      OutlinedTextField(
                                          server, { server = it }, Modifier.fillMaxWidth(),
                                          label = { Text("Server address") },
                                          placeholder = { Text("https://fit.example.com") },
                                          singleLine = true,
                                          keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Uri),
                                      )
                                      if (tab == 1) {
                                          OutlinedTextField(invite, { invite = it }, Modifier.fillMaxWidth(), label = { Text("Server invite code") }, singleLine = true)
                                          OutlinedTextField(display, { display = it }, Modifier.fillMaxWidth(), label = { Text("Display name (what friends see)") }, singleLine = true)
                                      }
                                      OutlinedTextField(
                                          username, { username = it.trim() }, Modifier.fillMaxWidth(),
                                          label = { Text("Username") }, singleLine = true,
                                      )
                                      OutlinedTextField(
                                          password, { password = it }, Modifier.fillMaxWidth(),
                                          label = { Text(if (tab == 1) "Password (8+ characters)" else "Password") },
                                          singleLine = true,
                                          visualTransformation = PasswordVisualTransformation(),
                                          keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Password),
                                      )
                                      error?.let { Text(it, color = MaterialTheme.colorScheme.error, style = MaterialTheme.typography.bodySmall) }
                                      if (busy) LinearProgressIndicator(Modifier.fillMaxWidth())
                                      val ready = server.isNotBlank() && username.length >= 3 && password.isNotEmpty() &&
                                          (tab == 0 || (invite.isNotBlank() && display.isNotBlank() && password.length >= 8))
                                      Button(onClick = { submit() }, enabled = ready && !busy, modifier = Modifier.fillMaxWidth()) {
                                          Text(if (tab == 0) "Sign in" else "Create account")
                                      }
                                  }
                              }
                          }
                          Text(
                              "Don't have a server yet? The repo's server folder has a Docker setup that runs on any home server. Ask whoever runs it for the address and invite code.",
                              style = MaterialTheme.typography.bodySmall,
                              color = MaterialTheme.colorScheme.onSurfaceVariant,
                          )
                      }
                  }
              }
          }

