          @Composable
          fun FitApp(showHealthPrivacy: Boolean = false, onPrivacyShown: () -> Unit = {}) {
              val data by Store.data.collectAsState()
              val p = data.profile
              FitTheme(p.theme, p.dynamicColor) {
                  Surface(color = MaterialTheme.colorScheme.background) {
                      if (!p.onboarded) OnboardingScreen() else MainShell()
                      if (showHealthPrivacy) HealthPrivacyDialog(onPrivacyShown)
                  }
              }
          }

          @Composable
          private fun MainShell() {
              val nav = remember { Nav() }
              var tab by rememberSaveable { mutableIntStateOf(0) }
              var diaryDate by rememberSaveable { mutableStateOf(Dates.today()) }
              val tabs = listOf(
                  "Home" to Icons.Filled.Home,
                  "Diary" to Icons.Filled.MenuBook,
                  "Progress" to Icons.Filled.ShowChart,
                  "More" to Icons.Filled.MoreHoriz,
              )
              CompositionLocalProvider(LocalNav provides nav) {
                  val top = nav.stack.lastOrNull()
                  BackHandler(enabled = top != null) { nav.pop() }
                  BackHandler(enabled = top == null && tab != 0) { tab = 0 }
                  if (top != null) {
                      when (top) {
                          is Screen.AddFood -> AddFoodScreen(top.date, top.meal)
                          is Screen.AddExercise -> AddExerciseScreen(top.date)
                          is Screen.EditFood -> EditFoodScreen(top.id, top.barcode)
                          is Screen.MyFoods -> MyFoodsScreen()
                          is Screen.Recipes -> RecipesScreen()
                          is Screen.EditRecipe -> EditRecipeScreen(top.id)
                          is Screen.Goals -> GoalsScreen()
                          is Screen.Settings -> SettingsScreen()
                          is Screen.Nutrition -> NutritionScreen(top.date)
                          is Screen.Weight -> WeightScreen()
                          is Screen.Health -> HealthConnectScreen()
                          is Screen.Scale -> ScaleScreen()
                      }
                  } else {
                      Scaffold(
                          bottomBar = {
                              NavigationBar {
                                  tabs.forEachIndexed { i, (label, icon) ->
                                      NavigationBarItem(
                                          selected = tab == i,
                                          onClick = {
                                              if (i == 1 && tab != 1) diaryDate = Dates.today()
                                              tab = i
                                          },
                                          icon = { Icon(icon, contentDescription = label) },
                                          label = { Text(label) },
                                      )
                                  }
                              }
                          }
                      ) { pad ->
                          Box(Modifier.padding(pad)) {
                              when (tab) {
                                  0 -> DashboardScreen(onOpenDiary = {
                                      diaryDate = Dates.today()
                                      tab = 1
                                  })
                                  1 -> DiaryScreen(diaryDate) { diaryDate = it }
                                  2 -> ProgressScreen()
                                  else -> MoreScreen()
                              }
                          }
                      }
                  }
              }
          }
