          package com.feynos.fit.data

          import java.security.MessageDigest
          import java.security.SecureRandom
          import java.util.TimeZone
          import javax.crypto.Cipher
          import javax.crypto.spec.IvParameterSpec
          import javax.crypto.spec.SecretKeySpec

          /**
           * Etekcity Bluetooth body scales (VeSync "Smart Fitness Scale" family).
           *
           * Protocol knowledge comes from github.com/ronnnnnnnnnnnnn/etekcity_esf551_ble
           * (MIT licence, (c) 2024 Ron Ben Yosef) and openScale. All models use GATT service FFF0 with
           * notify FFF1 / write FFF2, but speak one of three dialects:
           *
           *  - PLAIN_A5   ESF-551: unencrypted 22-byte frames, weight pushed as you stand on it.
           *  - SECURE_A5  EFS-A591S (Apex HR), EFS-C651: Diffie-Hellman handshake, then AES-128-CBC
           *               frames (some firmwares skip the handshake and send plaintext 0x41xx frames).
           *  - QN         ESF-24, ESF-17, ESF-18: request/response; the app must answer the scale.
           *  - ADVERT     FIT-8S: no connection, weight is broadcast in advertisements.
