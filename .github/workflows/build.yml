              const val OP_KEY_EXCHANGE = 0x4201
              const val OP_KEY_VERIFY = 0x4202
              const val OP_MEASUREMENT = 0x4421
              const val OP_RESULT = 0x443A
              const val OP_MEASUREMENT_PLAIN = 0x4121
              const val OP_RESULT_PLAIN = 0x413C
