                              OutlinedTextField(
                                  value = query,
                                  onValueChange = { query = it },
                                  modifier = Modifier.fillMaxWidth().padding(16.dp),
                                  placeholder = { Text("Search exercises") },
                                  leadingIcon = { Icon(Icons.Filled.Search, contentDescription = null) },
                                  singleLine = true,
