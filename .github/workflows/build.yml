          // ================================================================ Updates

          sealed class UpdateStatus {
              data object Idle : UpdateStatus()
              data object Checking : UpdateStatus()
              data object UpToDate : UpdateStatus()
              data class Available(val release: Updater.Release) : UpdateStatus()
              data class Downloading(val release: Updater.Release, val progress: Float) : UpdateStatus()
              data class Ready(val release: Updater.Release, val apk: File) : UpdateStatus()
              data class Failed(val message: String) : UpdateStatus()
          }

          /** Shared update state so the dashboard banner and Settings stay in sync. */
          object UpdateUi {
              var status by mutableStateOf<UpdateStatus>(UpdateStatus.Idle)
                  private set
              private var lastCheckMs = 0L

              fun check(silent: Boolean = false) {
                  if (status is UpdateStatus.Checking || status is UpdateStatus.Downloading) return
                  if (silent && System.currentTimeMillis() - lastCheckMs < 6 * 60 * 60 * 1000L) return
                  lastCheckMs = System.currentTimeMillis()
                  if (!silent) status = UpdateStatus.Checking
                  AppScope.launch {
                      val r = withContext(Dispatchers.IO) { runCatching { Updater.latest() } }
                      status = r.fold(
                          onSuccess = { rel ->
                              if (rel != null && rel.build > BuildConfig.VERSION_CODE) UpdateStatus.Available(rel)
                              else if (silent) UpdateStatus.Idle else UpdateStatus.UpToDate
                          },
                          onFailure = { e -> if (silent) UpdateStatus.Idle else UpdateStatus.Failed(e.message ?: "Couldn't reach GitHub") },
                      )
                  }
              }

              fun downloadAndInstall(ctx: Context, rel: Updater.Release) {
                  val app = ctx.applicationContext
                  status = UpdateStatus.Downloading(rel, 0f)
                  AppScope.launch {
                      val r = withContext(Dispatchers.IO) {
                          runCatching {
                              Updater.download(app, rel) { p ->
                                  AppScope.launch { if (status is UpdateStatus.Downloading) status = UpdateStatus.Downloading(rel, p) }
                              }
                          }
                      }
                      r.onSuccess { file ->
                          status = UpdateStatus.Ready(rel, file)
                          install(ctx, file)
                      }.onFailure { e ->
                          status = UpdateStatus.Failed(e.message ?: "Download failed")
                      }
                  }
              }

              fun install(ctx: Context, apk: File) {
                  if (!Updater.canInstall(ctx)) {
                      ctx.startActivity(Updater.allowInstallIntent(ctx).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                      return
                  }
                  runCatching { ctx.startActivity(Updater.installIntent(ctx, apk)) }
                      .onFailure { status = UpdateStatus.Failed("Couldn't open the installer: ${it.message}") }
              }
          }

          /** Small banner for the dashboard when a newer build is on GitHub. */
          @Composable
          fun UpdateBanner() {
              val s = UpdateUi.status
              val ctx = LocalContext.current
              val rel = when (s) {
                  is UpdateStatus.Available -> s.release
                  is UpdateStatus.Downloading -> s.release
                  is UpdateStatus.Ready -> s.release
                  else -> null
              } ?: return
              ElevatedCard(Modifier.fillMaxWidth()) {
                  Column(Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                      Row(verticalAlignment = Alignment.CenterVertically) {
