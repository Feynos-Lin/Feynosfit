          package com.feynos.fit.data

          import android.content.Context
          import android.content.Intent
          import androidx.health.connect.client.HealthConnectClient
          import androidx.health.connect.client.permission.HealthPermission
          import androidx.health.connect.client.records.ActiveCaloriesBurnedRecord
          import androidx.health.connect.client.records.ExerciseSessionRecord
          import androidx.health.connect.client.records.MealType
          import androidx.health.connect.client.records.NutritionRecord
          import androidx.health.connect.client.records.StepsRecord
          import androidx.health.connect.client.records.WeightRecord
          import androidx.health.connect.client.records.metadata.Metadata
          import androidx.health.connect.client.request.AggregateRequest
          import androidx.health.connect.client.request.ReadRecordsRequest
          import androidx.health.connect.client.time.TimeRangeFilter
          import androidx.health.connect.client.units.Energy
          import androidx.health.connect.client.units.Mass
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.sync.Mutex
          import kotlinx.coroutines.sync.withLock
          import java.time.Instant
          import java.time.LocalDate
          import java.time.LocalTime
          import java.time.ZoneId

          /** App-wide background scope. */
          object AppScope : CoroutineScope by CoroutineScope(SupervisorJob() + Dispatchers.Main)

          /**
           * Health Connect is Android's shared health store. Samsung Health and OHealth (OnePlus/OPPO)
           * both sync into it, so reading from Health Connect brings in their steps, workouts and weight.
           */
          object HealthSync {
              const val PROVIDER = "com.google.android.apps.healthdata"

              val readPermissions: Set<String> = setOf(
                  HealthPermission.getReadPermission(StepsRecord::class),
                  HealthPermission.getReadPermission(ActiveCaloriesBurnedRecord::class),
                  HealthPermission.getReadPermission(ExerciseSessionRecord::class),
                  HealthPermission.getReadPermission(WeightRecord::class),
              )
              val writePermissions: Set<String> = setOf(
                  HealthPermission.getWritePermission(NutritionRecord::class),
                  HealthPermission.getWritePermission(WeightRecord::class),
              )
              val allPermissions: Set<String> = readPermissions + writePermissions

              enum class Availability { AVAILABLE, NEEDS_UPDATE, NOT_INSTALLED }

              fun availability(ctx: Context): Availability = when (runCatching { HealthConnectClient.getSdkStatus(ctx, PROVIDER) }.getOrDefault(HealthConnectClient.SDK_UNAVAILABLE)) {
                  HealthConnectClient.SDK_AVAILABLE -> Availability.AVAILABLE
                  HealthConnectClient.SDK_UNAVAILABLE_PROVIDER_UPDATE_REQUIRED -> Availability.NEEDS_UPDATE
                  else -> Availability.NOT_INSTALLED
              }

              private fun client(ctx: Context): HealthConnectClient? =
                  if (availability(ctx) == Availability.AVAILABLE) runCatching { HealthConnectClient.getOrCreate(ctx, PROVIDER) }.getOrNull() else null

              suspend fun grantedPermissions(ctx: Context): Set<String> {
                  val c = client(ctx) ?: return emptySet()
                  return runCatching { c.permissionController.getGrantedPermissions() }.getOrDefault(emptySet())
              }

              fun manageIntent(ctx: Context): Intent = HealthConnectClient.getHealthConnectManageDataIntent(ctx, PROVIDER)

              fun playStoreIntent(): Intent = Intent(
                  Intent.ACTION_VIEW,
                  android.net.Uri.parse("market://details?id=$PROVIDER&url=healthconnect%3A%2F%2Fonboarding"),
              )

              /** Friendly name for the app that wrote a record. */
              fun sourceName(pkg: String): String = when {
                  pkg == "com.sec.android.app.shealth" -> "Samsung Health"
                  pkg.contains("heytap") || pkg.contains("oplus") || pkg.contains("oneplus") -> "OHealth"
                  pkg == "com.google.android.apps.fitness" -> "Fit"
                  pkg == "com.fitbit.FitbitMobile" -> "Fitbit"
                  pkg.contains("garmin") -> "Garmin"
                  pkg == "com.google.android.apps.healthdata" || pkg == "android" -> "Health Connect"
                  else -> pkg.substringAfterLast('.').replaceFirstChar { it.uppercase() }
              }

              // ------------------------------------------------------------------ status for the UI

              @Volatile var lastError: String? = null
                  private set
              @Volatile var syncing: Boolean = false
                  private set

              private val mutex = Mutex()

              // ------------------------------------------------------------------ pull (read)

              /** Pull the last [days] days of steps, workouts and weigh-ins. Safe to call often. */
              suspend fun syncRecent(ctx: Context, days: Long = 7) {
                  val app = ctx.applicationContext
                  if (!Store.current.profile.hcEnabled) return
                  val c = client(app) ?: return
                  mutex.withLock {
                      syncing = true
                      try {
                          val granted = runCatching { c.permissionController.getGrantedPermissions() }.getOrDefault(emptySet())
                          if (granted.isEmpty()) {
                              lastError = "Health Connect permissions haven't been granted yet."
                              return
                          }
                          val zone = ZoneId.systemDefault()
                          val today = LocalDate.now()
                          val dates = (0 until days).map { today.minusDays(it) }

                          // Steps per day (Health Connect de-duplicates across Samsung Health, OHealth, etc.)
                          val steps = HashMap<String, Int>()
                          if (HealthPermission.getReadPermission(StepsRecord::class) in granted) {
                              for (d in dates) {
                                  val range = dayRange(d, zone)
                                  val n = runCatching {
                                      c.aggregate(AggregateRequest(setOf(StepsRecord.COUNT_TOTAL), range))[StepsRecord.COUNT_TOTAL]
                                  }.getOrNull()
                                  if (n != null && n > 0) steps[d.toString()] = n.toInt()
                              }
                          }

                          // Workouts
                          val workouts = ArrayList<ExerciseEntry>()
                          val replaceDates = HashSet<String>()
                          val canWorkouts = Store.current.profile.hcImportWorkouts &&
                              HealthPermission.getReadPermission(ExerciseSessionRecord::class) in granted
                          if (canWorkouts) {
                              val start = dates.last().atStartOfDay(zone).toInstant()
                              val end = Instant.now()
                              val sessions = runCatching {
                                  c.readRecords(ReadRecordsRequest(ExerciseSessionRecord::class, TimeRangeFilter.between(start, end))).records
                              }.getOrDefault(emptyList())
                              val canCalories = HealthPermission.getReadPermission(ActiveCaloriesBurnedRecord::class) in granted
                              for (s in sessions) {
                                  if (s.metadata.dataOrigin.packageName == app.packageName) continue
                                  val date = s.startTime.atZone(zone).toLocalDate().toString()
                                  val minutes = ((s.endTime.epochSecond - s.startTime.epochSecond) / 60).toInt().coerceAtLeast(1)
                                  var kcal = 0.0
                                  if (canCalories) {
                                      kcal = runCatching {
                                          c.aggregate(
                                              AggregateRequest(
                                                  setOf(ActiveCaloriesBurnedRecord.ACTIVE_CALORIES_TOTAL),
                                                  TimeRangeFilter.between(s.startTime, s.endTime),
                                              ),
                                          )[ActiveCaloriesBurnedRecord.ACTIVE_CALORIES_TOTAL]?.inKilocalories
                                      }.getOrNull() ?: 0.0
                                  }
                                  val (typeName, met) = exerciseType(s.exerciseType)
                                  if (kcal <= 0) kcal = Calc.exerciseKcal(met, Store.current.profile.weightKg, minutes.toDouble())
                                  val title = s.title?.takeIf { it.isNotBlank() } ?: typeName
                                  workouts.add(
                                      ExerciseEntry(
                                          id = "hc-" + s.metadata.id,
                                          date = date,
                                          name = "$title · ${sourceName(s.metadata.dataOrigin.packageName)}",
                                          kind = "health",
                                          minutes = minutes,
                                          kcal = kcal,
                                      ),
                                  )
                              }
                              dates.forEach { replaceDates.add(it.toString()) }
                          }

                          // Weigh-ins from smart scales / other apps
                          val weights = ArrayList<WeightEntry>()
                          if (HealthPermission.getReadPermission(WeightRecord::class) in granted) {
                              val start = today.minusDays(maxOf(days, 30)).atStartOfDay(zone).toInstant()
                              val recs = runCatching {
                                  c.readRecords(ReadRecordsRequest(WeightRecord::class, TimeRangeFilter.between(start, Instant.now()))).records
                              }.getOrDefault(emptyList())
                              recs.filter { it.metadata.dataOrigin.packageName != app.packageName }
                                  .sortedBy { it.time }
                                  .forEach { weights.add(WeightEntry(it.time.atZone(zone).toLocalDate().toString(), it.weight.inKilograms)) }
                          }

                          Store.mergeHealth(steps, workouts, weights.reversed(), replaceDates)
                          lastError = null

                          // Push recent food so Samsung Health / others can see it.
                          for (d in dates.take(2)) pushFoodNow(app, d.toString())
                      } catch (e: Exception) {
                          lastError = e.message ?: e.javaClass.simpleName
                      } finally {
                          syncing = false
                      }
                  }
              }

              // ------------------------------------------------------------------ push (write)

              private val pushJobs = HashMap<String, Job>()

              /** Debounced: rewrites that day's food in Health Connect a few seconds after the last change. */
              fun schedulePush(ctx: Context, date: String) {
                  val p = Store.current.profile
                  if (!p.hcEnabled || !p.hcWriteFood) return
                  val app = ctx.applicationContext
                  synchronized(pushJobs) {
                      pushJobs[date]?.cancel()
                      pushJobs[date] = AppScope.launch {
                          delay(3000)
                          runCatching { pushFoodNow(app, date) }
                      }
                  }
              }

              /** Replace this app's nutrition records for [date] with the current diary. */
              suspend fun pushFoodNow(ctx: Context, date: String) {
                  val p = Store.current.profile
                  if (!p.hcEnabled || !p.hcWriteFood) return
                  val c = client(ctx) ?: return
                  val granted = runCatching { c.permissionController.getGrantedPermissions() }.getOrDefault(emptySet())
                  if (HealthPermission.getWritePermission(NutritionRecord::class) !in granted) return
                  val zone = ZoneId.systemDefault()
                  val day = LocalDate.parse(date)
                  val range = dayRange(day, zone)
                  // Only deletes records written by this app.
                  c.deleteRecords(NutritionRecord::class, range)
                  val entries = Store.current.diary.filter { it.date == date }
                  if (entries.isEmpty()) return
                  val mealTimes = listOf(LocalTime.of(8, 0), LocalTime.of(12, 30), LocalTime.of(18, 30), LocalTime.of(15, 0))
                  val mealTypes = listOf(MealType.MEAL_TYPE_BREAKFAST, MealType.MEAL_TYPE_LUNCH, MealType.MEAL_TYPE_DINNER, MealType.MEAL_TYPE_SNACK)
                  val records = entries.mapIndexed { i, e ->
                      val n = e.total
                      val start = day.atTime(mealTimes[e.meal.coerceIn(0, 3)]).plusSeconds(i * 2L).atZone(zone)
                      val end = start.plusSeconds(1)
                      fun g(v: Double): Mass? = if (v > 0) Mass.grams(v) else null
                      fun mg(v: Double): Mass? = if (v > 0) Mass.grams(v / 1000.0) else null
                      NutritionRecord(
                          startTime = start.toInstant(),
                          startZoneOffset = start.offset,
                          endTime = end.toInstant(),
                          endZoneOffset = end.offset,
                          metadata = Metadata.manualEntry(clientRecordId = "feynos-food-" + e.id),
                          energy = if (n.kcal > 0) Energy.kilocalories(n.kcal) else null,
                          protein = g(n.protein),
                          totalCarbohydrate = g(n.carbs),
                          totalFat = g(n.fat),
                          dietaryFiber = g(n.fiber),
                          sugar = g(n.sugar),
                          saturatedFat = g(n.satFat),
                          sodium = mg(n.sodiumMg),
                          cholesterol = mg(n.cholesterolMg),
                          potassium = mg(n.potassiumMg),
                          name = e.name.take(100),
                          mealType = mealTypes[e.meal.coerceIn(0, 3)],
                      )
                  }
                  c.insertRecords(records)
              }

              fun pushWeight(ctx: Context, date: String, kg: Double) {
                  val p = Store.current.profile
                  if (!p.hcEnabled) return
                  val app = ctx.applicationContext
                  AppScope.launch {
                      runCatching {
                          val c = client(app) ?: return@launch
                          val granted = c.permissionController.getGrantedPermissions()
                          if (HealthPermission.getWritePermission(WeightRecord::class) !in granted) return@launch
                          val t = LocalDate.parse(date).atTime(LocalTime.of(7, 0)).atZone(ZoneId.systemDefault())
                          c.insertRecords(
                              listOf(
                                  WeightRecord(
                                      time = t.toInstant(),
                                      zoneOffset = t.offset,
                                      weight = Mass.kilograms(kg),
                                      metadata = Metadata.manualEntry(
                                          clientRecordId = "feynos-weight-$date",
                                          clientRecordVersion = System.currentTimeMillis(),
                                      ),
                                  ),
                              ),
                          )
                      }
                  }
              }

              // ------------------------------------------------------------------ helpers

              private fun dayRange(d: LocalDate, zone: ZoneId): TimeRangeFilter {
                  val start = d.atStartOfDay(zone).toInstant()
                  val endOfDay = d.plusDays(1).atStartOfDay(zone).toInstant()
                  val end = if (endOfDay.isAfter(Instant.now())) Instant.now() else endOfDay
                  return TimeRangeFilter.between(start, if (end.isAfter(start)) end else start.plusSeconds(1))
              }

              private fun exerciseType(t: Int): Pair<String, Double> = when (t) {
