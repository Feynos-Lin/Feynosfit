          cat > 'app/src/main/java/com/feynos/fit/data/Store.kt' <<'FEYNOS_EOF'
          package com.feynos.fit.data

          import android.content.Context
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.flow.update
          import org.json.JSONObject
          import java.io.File
          import java.util.concurrent.Executors

          /** All app data lives in one JSON file on the device. */
          object Store {
              private var file: File? = null
              private val _data = MutableStateFlow(AppData())
              val data: StateFlow<AppData> = _data.asStateFlow()
              private val io = Executors.newSingleThreadExecutor()

              val current: AppData get() = _data.value

              /** Called with a date whenever that day's food changes (used to push food to Health Connect). */
              @Volatile
              var onDiaryChanged: ((String) -> Unit)? = null

              private fun diaryChanged(vararg dates: String) {
                  val cb = onDiaryChanged ?: return
                  dates.toSet().forEach { cb(it) }
              }

              private var appContext: Context? = null

              fun init(context: Context) {
                  if (file != null) return
                  appContext = context.applicationContext
                  val f = File(context.filesDir, "feynos_fit.json")
                  file = f
                  if (f.exists()) {
                      runCatching { AppData.fromJson(JSONObject(f.readText())) }
                          .onSuccess { _data.value = it }
                  }
              }

              fun update(block: (AppData) -> AppData) {
                  _data.update(block)
                  io.execute { persist() }
                  appContext?.let { com.feynos.fit.widget.TodayWidget.requestUpdate(it) }
              }

              private fun persist() {
                  val f = file ?: return
                  runCatching {
                      val tmp = File(f.parentFile, f.name + ".tmp")
                      tmp.writeText(_data.value.toJson().toString())
                      if (!tmp.renameTo(f)) {
                          f.writeText(tmp.readText())
                          tmp.delete()
                      }
                  }
              }

              // ---- Diary ----

              fun logFood(food: Food, date: String, meal: Int, servings: Double) {
                  val entry = DiaryEntry(
                      date = date, meal = meal, name = food.name, brand = food.brand, servings = servings,
                      servingDesc = food.servingDesc, servingGrams = food.servingGrams, perServing = food.n,
                  )
                  update { d ->
                      d.copy(
                          diary = d.diary + entry,
                          recents = (listOf(food) + d.recents.filterNot { sameFood(it, food) }).take(60),
                      )
                  }
                  diaryChanged(date)
              }

              private fun sameFood(a: Food, b: Food) = a.id == b.id ||
                  (a.name.equals(b.name, true) && a.brand.equals(b.brand, true) && a.servingDesc == b.servingDesc)

              fun addEntry(e: DiaryEntry) {
                  update { it.copy(diary = it.diary + e) }
                  diaryChanged(e.date)
              }

              fun updateEntry(e: DiaryEntry) {
                  update { d -> d.copy(diary = d.diary.map { if (it.id == e.id) e else it }) }
                  diaryChanged(e.date)
              }

              fun deleteEntry(id: String) {
                  val date = current.diary.firstOrNull { it.id == id }?.date
                  update { d -> d.copy(diary = d.diary.filterNot { it.id == id }) }
                  if (date != null) diaryChanged(date)
              }

              fun copyMeal(from: String, to: String, meal: Int) {
                  update { d ->
                      val copies = d.diary.filter { it.date == from && it.meal == meal }.map { it.copy(id = newId(), date = to) }
                      d.copy(diary = d.diary + copies)
                  }
                  diaryChanged(to)
              }

              fun copyDay(from: String, to: String) {
                  update { d ->
                      val copies = d.diary.filter { it.date == from }.map { it.copy(id = newId(), date = to) }
                      d.copy(diary = d.diary + copies)
                  }
                  diaryChanged(to)
              }

              // ---- Exercise ----

              fun addExercise(e: ExerciseEntry) = update { it.copy(exercises = it.exercises + e) }

              fun deleteExercise(id: String) = update { d ->
                  d.copy(
                      exercises = d.exercises.filterNot { it.id == id },
                      hcIgnored = if (id.startsWith("hc-")) d.hcIgnored + id else d.hcIgnored,
                  )
              }

              /** Merge data pulled from Health Connect. */
              fun mergeHealth(
                  steps: Map<String, Int>,
                  workouts: List<ExerciseEntry>,
                  weights: List<WeightEntry>,
                  replaceWorkoutDates: Set<String>,
              ) = update { d ->
                  val newSteps = d.steps.toMutableMap()
                  steps.forEach { (date, n) -> if (n > (newSteps[date] ?: 0)) newSteps[date] = n }
                  val keepEx = d.exercises.filterNot { it.kind == "health" && it.date in replaceWorkoutDates }
                  val addEx = workouts.filter { it.id !in d.hcIgnored }
                  val localDates = d.weights.map { it.date }.toSet()
                  val addW = weights.filter { it.date !in localDates }.distinctBy { it.date }
                  val allW = (d.weights + addW).sortedBy { it.date }
                  d.copy(
                      steps = newSteps,
                      exercises = keepEx + addEx,
                      weights = allW,
                      profile = if (addW.isNotEmpty() && allW.isNotEmpty()) d.profile.copy(weightKg = allW.last().kg) else d.profile,
                      lastHcSync = System.currentTimeMillis(),
                  )
              }

              // ---- Daily trackers ----

              fun setWater(date: String, ml: Int) = update { it.copy(water = it.water + (date to ml.coerceAtLeast(0))) }

              fun setSteps(date: String, steps: Int) = update { it.copy(steps = it.steps + (date to steps.coerceAtLeast(0))) }

              fun setNote(date: String, text: String) = update {
                  it.copy(notes = if (text.isBlank()) it.notes - date else it.notes + (date to text))
              }

              // ---- Weight ----

              /** Called when the user logs a weigh-in (used to push weight to Health Connect). */
              @Volatile
              var onWeightLogged: ((String, Double) -> Unit)? = null

              fun logWeight(date: String, kg: Double) {
                  update { d ->
                      val list = (d.weights.filterNot { it.date == date } + WeightEntry(date, kg)).sortedBy { it.date }
                      d.copy(weights = list, profile = d.profile.copy(weightKg = list.last().kg))
                  }
                  onWeightLogged?.invoke(date, kg)
              }

              fun deleteWeight(date: String) = update { d ->
                  val list = d.weights.filterNot { it.date == date }
                  d.copy(weights = list, profile = if (list.isEmpty()) d.profile else d.profile.copy(weightKg = list.last().kg))
              }

              // ---- Foods & recipes ----

              fun saveFood(f: Food) = update { d ->
                  d.copy(foods = if (d.foods.any { it.id == f.id }) d.foods.map { if (it.id == f.id) f else it } else d.foods + f)
              }

              fun deleteFood(id: String) = update { d -> d.copy(foods = d.foods.filterNot { it.id == id }) }

              fun saveRecipe(r: Recipe) = update { d ->
                  d.copy(recipes = if (d.recipes.any { it.id == r.id }) d.recipes.map { if (it.id == r.id) r else it } else d.recipes + r)
              }

              fun deleteRecipe(id: String) = update { d -> d.copy(recipes = d.recipes.filterNot { it.id == id }) }

              // ---- Profile & data ----

              fun setProfile(p: Profile) = update { it.copy(profile = p) }

              fun export(): String = current.toJson().toString(2)

              fun importJson(json: String): Boolean = runCatching {
                  val d = AppData.fromJson(JSONObject(json))
                  update { d }
              }.isSuccess

              fun reset() = update { AppData() }
          }
          FEYNOS_EOF

          cat > 'app/src/main/java/com/feynos/fit/data/Updater.kt' <<'FEYNOS_EOF'
          package com.feynos.fit.data

          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.provider.Settings
          import androidx.core.content.FileProvider
          import org.json.JSONObject
          import java.io.File
          import java.io.IOException
          import java.net.HttpURLConnection
          import java.net.URL

          /**
           * Updates come from the GitHub repo's Releases page, which the build workflow publishes to.
           * Each release tag is "build-N" where N matches the app's versionCode, so a higher N is newer.
           */
          object Updater {
              const val REPO = "Feynos-Lin/Feynosfit"
              const val RELEASES_PAGE = "https://github.com/$REPO/releases"

              data class Release(
                  val build: Int,
                  val version: String,
                  val title: String,
                  val notes: String,
                  val apkUrl: String,
                  val apkName: String,
                  val sizeBytes: Long,
              )

              /** Latest published release, or null if none. Call off the main thread. */
              fun latest(): Release? {
                  val c = URL("https://api.github.com/repos/$REPO/releases/latest").openConnection() as HttpURLConnection
                  c.connectTimeout = 15000
                  c.readTimeout = 20000
                  c.setRequestProperty("Accept", "application/vnd.github+json")
                  c.setRequestProperty("User-Agent", "FeynosFit-updater")
                  try {
                      val code = c.responseCode
                      if (code == 404) return null
                      if (code !in 200..299) throw IOException("GitHub returned HTTP $code")
                      val o = JSONObject(c.inputStream.bufferedReader().use { it.readText() })
                      val tag = o.optString("tag_name", "")
                      val build = Regex("(\\d+)$").find(tag)?.groupValues?.get(1)?.toIntOrNull() ?: return null
                      val title = o.optString("name", tag)
                      val version = Regex("v(\\d+(?:\\.\\d+)*)").find(title)?.groupValues?.get(1) ?: "?"
                      val assets = o.optJSONArray("assets") ?: return null
                      for (i in 0 until assets.length()) {
                          val a = assets.optJSONObject(i) ?: continue
                          val name = a.optString("name", "")
                          if (name.endsWith(".apk", ignoreCase = true)) {
                              return Release(
                                  build = build,
                                  version = version,
                                  title = title,
                                  notes = o.optString("body", ""),
                                  apkUrl = a.optString("browser_download_url", ""),
                                  apkName = name,
                                  sizeBytes = a.optLong("size", 0L),
                              )
                          }
                      }
                      return null
                  } finally {
                      c.disconnect()
                  }
              }

              /** Download the APK into app cache. [onProgress] gets 0..1. Call off the main thread. */
              fun download(ctx: Context, r: Release, onProgress: (Float) -> Unit): File {
                  val dir = File(ctx.cacheDir, "updates")
                  dir.mkdirs()
                  dir.listFiles()?.forEach { it.delete() }
                  val out = File(dir, "FeynosFit-build${r.build}.apk")
                  var url = r.apkUrl
                  var conn: HttpURLConnection? = null
                  // Follow GitHub's redirect to its download CDN manually (handles any host change).
                  for (hop in 0 until 5) {
                      val c = URL(url).openConnection() as HttpURLConnection
                      c.instanceFollowRedirects = false
                      c.connectTimeout = 15000
                      c.readTimeout = 30000
                      c.setRequestProperty("User-Agent", "FeynosFit-updater")
                      val code = c.responseCode
                      if (code in 300..399) {
                          url = c.getHeaderField("Location") ?: throw IOException("Bad redirect")
                          c.disconnect()
                          continue
                      }
                      if (code !in 200..299) {
                          c.disconnect()
                          throw IOException("Download failed (HTTP $code)")
                      }
                      conn = c
                      break
                  }
                  val c = conn ?: throw IOException("Too many redirects")
                  try {
                      val total = c.contentLengthLong.takeIf { it > 0 } ?: r.sizeBytes
                      c.inputStream.use { input ->
                          out.outputStream().use { output ->
                              val buf = ByteArray(64 * 1024)
                              var done = 0L
                              while (true) {
                                  val n = input.read(buf)
                                  if (n < 0) break
                                  output.write(buf, 0, n)
                                  done += n
                                  if (total > 0) onProgress((done.toFloat() / total).coerceIn(0f, 1f))
                              }
                          }
                      }
                  } finally {
                      c.disconnect()
                  }
                  return out
              }

              /** Whether Android will let this app open the installer. */
              fun canInstall(ctx: Context): Boolean =
                  Build.VERSION.SDK_INT < Build.VERSION_CODES.O || ctx.packageManager.canRequestPackageInstalls()

              /** Opens the "Install unknown apps" setting for this app. */
              fun allowInstallIntent(ctx: Context): Intent =
                  Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:${ctx.packageName}"))

              fun installIntent(ctx: Context, apk: File): Intent {
                  val uri = FileProvider.getUriForFile(ctx, "${ctx.packageName}.files", apk)
                  return Intent(Intent.ACTION_VIEW)
                      .setDataAndType(uri, "application/vnd.android.package-archive")
                      .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
              }

              fun releasesPageIntent(): Intent = Intent(Intent.ACTION_VIEW, Uri.parse(RELEASES_PAGE))
          }
