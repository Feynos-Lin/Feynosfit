                      r.onSuccess {
                          online = it
                          if (it.isEmpty()) errorMsg = "No online results for \"$q\". Try fewer words, or create the food yourself."
                      }.onFailure {
                          errorMsg = "Couldn't reach the food database. Check your connection and try again."
                      }
                  }
              }

              fun handleBarcode(code: String) {
                  val local = (data.foods + data.recents).firstOrNull { it.barcode.isNotEmpty() && it.barcode == code }
                  if (local != null) {
                      selected = local
                      return
                  }
                  loading = true
                  scope.launch {
                      val r = withContext(Dispatchers.IO) { runCatching { FoodApi.byBarcode(code) } }
                      loading = false
                      val f = r.getOrNull()
                      if (f != null) {
                          selected = f
                      } else if (r.isFailure) {
                          snackbar.showSnackbar("Couldn't look up that barcode. Check your connection.")
                      } else {
                          notFoundCode = code
                      }
                  }
              }

              fun scan() {
                  val options = GmsBarcodeScannerOptions.Builder()
                      .setBarcodeFormats(
                          Barcode.FORMAT_EAN_13, Barcode.FORMAT_EAN_8, Barcode.FORMAT_UPC_A,
                          Barcode.FORMAT_UPC_E, Barcode.FORMAT_CODE_128,
                      )
                      .build()
                  GmsBarcodeScanning.getClient(ctx, options).startScan()
                      .addOnSuccessListener { b -> b.rawValue?.let { handleBarcode(it) } }
                      .addOnFailureListener { e ->
                          scope.launch { snackbar.showSnackbar("Scanner unavailable: ${e.message ?: "unknown error"}") }
                      }
              }

              val tabs = if (includeRecipes) listOf("Search", "Recent", "My foods", "Recipes") else listOf("Search", "Recent", "My foods")
              val currentTab = tab.coerceIn(0, tabs.lastIndex)
              val q = query.trim().lowercase()
              fun match(f: Food) = q.isEmpty() || f.name.lowercase().contains(q) || f.brand.lowercase().contains(q)

              Scaffold(
                  topBar = { BackTopBar(title, onBack) },
                  snackbarHost = { SnackbarHost(snackbar) },
              ) { pad ->
                  Centered(Modifier.padding(pad)) {
                      Column(Modifier.fillMaxSize()) {
                          Column(Modifier.padding(horizontal = 16.dp)) {
                              header()
                              OutlinedTextField(
                                  value = query,
                                  onValueChange = { query = it },
                                  modifier = Modifier.fillMaxWidth(),
                                  placeholder = { Text("Search for a food") },
                                  singleLine = true,
                                  leadingIcon = { Icon(Icons.Filled.Search, contentDescription = null) },
                                  trailingIcon = {
                                      IconButton(onClick = { scan() }) {
                                          Icon(Icons.Filled.QrCodeScanner, contentDescription = "Scan barcode")
                                      }
                                  },
                                  keyboardOptions = KeyboardOptions(imeAction = ImeAction.Search),
                                  keyboardActions = KeyboardActions(onSearch = { runSearch() }),
                              )
                          }
                          ScrollableTabRow(selectedTabIndex = currentTab, edgePadding = 8.dp) {
                              tabs.forEachIndexed { i, t ->
                                  Tab(selected = currentTab == i, onClick = { tab = i }, text = { Text(t) })
                              }
                          }
                          if (loading) LinearProgressIndicator(Modifier.fillMaxWidth())
                          LazyColumn(Modifier.weight(1f), contentPadding = PaddingValues(bottom = 24.dp)) {
                              when (currentTab) {
                                  0 -> {
                                      if (q.isNotEmpty()) {
                                          item {
                                              FilledTonalButton(
                                                  onClick = { runSearch() },
                                                  modifier = Modifier.padding(16.dp).fillMaxWidth(),
                                              ) {
                                                  Icon(Icons.Filled.Search, contentDescription = null)
                                                  Spacer(Modifier.width(8.dp))
                                                  Text("Search online for \"${query.trim()}\"", maxLines = 1, overflow = TextOverflow.Ellipsis)
                                              }
                                          }
                                      }
                                      errorMsg?.let { msg ->
                                          item {
                                              Text(msg, color = MaterialTheme.colorScheme.error, modifier = Modifier.padding(16.dp))
                                          }
                                      }
                                      val mine = if (q.isEmpty()) emptyList<Food>() else
                                          (data.foods + data.recents).filter { match(it) }
                                              .distinctBy { (it.name + "|" + it.brand).lowercase() }.take(15)
                                      if (mine.isNotEmpty()) {
                                          item { ListHeader("Your foods") }
                                          items(mine) { f -> FoodRow(f) { selected = f } }
                                      }
                                      if (online.isNotEmpty()) {
                                          item { ListHeader("Online results · Open Food Facts") }
                                          items(online) { f -> FoodRow(f) { selected = f } }
                                      }
                                      val common = FoodDb.foods.filter { match(it) }
                                      if (common.isNotEmpty()) {
                                          item { ListHeader("Common foods") }
                                          items(common) { f -> FoodRow(f) { selected = f } }
                                      }
                                      if (q.isEmpty()) {
                                          item {
                                              Text(
                                                  "Type a food and press search to look it up in a database of millions of products, or tap the barcode icon to scan a package.",
                                                  style = MaterialTheme.typography.bodySmall,
                                                  color = MaterialTheme.colorScheme.onSurfaceVariant,
                                                  modifier = Modifier.padding(16.dp),
                                              )
                                          }
                                      }
                                  }
                                  1 -> {
                                      val recent = data.recents.filter { match(it) }
                                      if (recent.isEmpty()) {
                                          item { EmptyState("Nothing here yet", "Foods you log show up here for quick re-logging.") }
                                      } else {
                                          items(recent) { f -> FoodRow(f) { selected = f } }
                                      }
                                  }
                                  2 -> {
                                      if (allowCreate) {
                                          item {
                                              OutlinedButton(
                                                  onClick = { nav.push(Screen.EditFood(null)) },
                                                  modifier = Modifier.padding(16.dp).fillMaxWidth(),
                                              ) {
                                                  Icon(Icons.Filled.Add, contentDescription = null)
                                                  Spacer(Modifier.width(8.dp))
                                                  Text("Create a food")
                                              }
                                          }
                                      }
                                      val mine = data.foods.filter { match(it) }
                                      if (mine.isEmpty()) {
                                          item { EmptyState("No custom foods", "Create foods with your own nutrition info, like a family recipe or a local bakery item.") }
                                      } else {
                                          items(mine) { f -> FoodRow(f) { selected = f } }
                                      }
                                  }
                                  else -> {
                                      if (allowCreate) {
                                          item {
                                              OutlinedButton(
                                                  onClick = { nav.push(Screen.EditRecipe(null)) },
                                                  modifier = Modifier.padding(16.dp).fillMaxWidth(),
                                              ) {
                                                  Icon(Icons.Filled.Add, contentDescription = null)
                                                  Spacer(Modifier.width(8.dp))
                                                  Text("Create a recipe")
                                              }
                                          }
                                      }
                                      val recipes = data.recipes.filter { q.isEmpty() || it.name.lowercase().contains(q) }
                                      if (recipes.isEmpty()) {
                                          item { EmptyState("No recipes", "Build a recipe from ingredients and log it by the serving.") }
                                      } else {
                                          items(recipes) { r ->
                                              val f = r.asFood()
                                              FoodRow(f) { selected = f }
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }

              selected?.let { food ->
                  PortionDialog(
                      food = food,
                      confirmLabel = confirmLabel,
                      onDismiss = { selected = null },
                  ) { servings ->
                      selected = null
                      onPick(food, servings)
                  }
              }

              notFoundCode?.let { code ->
                  AlertDialog(
                      onDismissRequest = { notFoundCode = null },
                      title = { Text("Product not found") },
                      text = { Text("Barcode $code isn't in the food database yet." + if (allowCreate) " You can add it as your own food." else "") },
                      confirmButton = {
                          if (allowCreate) {
