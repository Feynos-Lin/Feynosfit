          object BodyScaleProtocol {
              const val SERVICE_UUID = "0000fff0-0000-1000-8000-00805f9b34fb"
              const val NOTIFY_UUID = "0000fff1-0000-1000-8000-00805f9b34fb"
              const val WRITE_UUID = "0000fff2-0000-1000-8000-00805f9b34fb"

              const val ETEKCITY_COMPANY_ID = 1744
              const val QN_COMPANY_ID = 65535

              enum class Family { PLAIN_A5, SECURE_A5, QN, ADVERT, UNKNOWN }

              data class Model(val name: String, val family: Family)

              private val etekcityModels = mapOf(
                  1 to Model("ESF-551", Family.PLAIN_A5),
                  2 to Model("ESF-551", Family.PLAIN_A5),
                  12 to Model("ESF-551 (Japan)", Family.PLAIN_A5),
                  3 to Model("EFS-A591S (Apex HR)", Family.SECURE_A5),
                  5 to Model("EFS-A591S (Apex HR)", Family.SECURE_A5),
                  127 to Model("EFS-A591S (Apex HR)", Family.SECURE_A5),
                  134 to Model("EFS-A591S (Apex HR)", Family.SECURE_A5),
                  136 to Model("EFS-C651", Family.SECURE_A5),
                  49321 to Model("FIT-8S", Family.ADVERT),
              )
              private val qnModels = mapOf(
                  294 to Model("ESF-24", Family.QN),
                  946 to Model("ESF-24", Family.QN),
                  211 to Model("ESF-17", Family.QN),
                  671 to Model("ESF-18", Family.QN),
              )

              /** A completed weigh-in or a live (settling) reading. */
              data class Reading(val kg: Double, val final: Boolean, val heartRate: Int? = null, val impedance: Int? = null)

              // ------------------------------------------------------------------ detection

              fun reversedMac(mac: String): ByteArray =
                  mac.split(":").map { it.toInt(16).toByte() }.reversed().toByteArray()

              /**
               * Identify a body scale from its advertisement. Returns null if it isn't one.
               * [etekcityData] / [qnData] are manufacturer-data values for company IDs 1744 / 65535.
               */
              fun detect(name: String?, address: String, etekcityData: ByteArray?, qnData: ByteArray?): Model? {
                  val n = name ?: ""
                  if (n.contains("Nutrition", ignoreCase = true)) return null // the ESN00 kitchen scale
                  if (etekcityData != null && etekcityData.size >= 9) {
                      val code = u16be(etekcityData, 7)
                      etekcityModels[code]?.let { return it }
                  }
                  if (qnData != null && qnData.size >= 11) {
                      val macOk = runCatching { qnData.copyOfRange(5, 11).contentEquals(reversedMac(address)) }.getOrDefault(false)
                      if (macOk) qnModels[u16be(qnData, 0)]?.let { return it }
                  }
                  val lower = n.lowercase()
                  return when {
                      lower.startsWith("qn-scale") || address.uppercase().startsWith("04:AC:44") -> Model("ESF-24", Family.QN)
                      lower.contains("apex") -> Model("EFS-A591S (Apex HR)", Family.SECURE_A5)
                      address.uppercase().startsWith("CF:EA:01") -> Model("EFS-A591S (Apex HR)", Family.SECURE_A5)
                      address.uppercase().startsWith("CF:E9:06") -> Model("EFS-C651", Family.SECURE_A5)
                      address.uppercase().startsWith("D0:4D:00") -> Model("ESF-551", Family.PLAIN_A5)
                      // Shared retail name ("Etekcity Fitness Scale"), or another Etekcity body scale:
                      // work out the dialect from what it sends after connecting.
                      lower.contains("etekcity") && (lower.contains("scale") || etekcityData != null) ->
