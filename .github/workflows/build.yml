                                      val left = LocalDate.parse(Dates.today()).until(LocalDate.parse(c.end)).days
                                      if (left == 0) "Last day!" else "$left day${if (left == 1) "" else "s"} left"
                                  }
                                  "upcoming" -> "Starts ${prettyRange(c.start, c.start)}"
                                  else -> "Finished"
                              }
                              Text(
