          private fun <T> JSONArray?.mapObj(f: (JSONObject) -> T): List<T> {
              if (this == null) return emptyList()
              val out = ArrayList<T>(length())
              for (i in 0 until length()) {
                  val o = optJSONObject(i) ?: continue
                  runCatching { f(o) }.getOrNull()?.let { out.add(it) }
              }
              return out
          }

          private fun <T> List<T>.toJsonArray(f: (T) -> JSONObject): JSONArray {
              val a = JSONArray()
              for (item in this) a.put(f(item))
              return a
          }

          private fun Map<String, Int>.intMapJson(): JSONObject {
              val o = JSONObject()
              for ((k, v) in this) o.put(k, v)
              return o
          }

          private fun Map<String, String>.strMapJson(): JSONObject {
              val o = JSONObject()
              for ((k, v) in this) o.put(k, v)
              return o
          }

          private fun JSONObject?.intMap(): Map<String, Int> {
              if (this == null) return emptyMap()
              val m = HashMap<String, Int>()
              val it = keys()
              while (it.hasNext()) {
                  val k = it.next()
                  m[k] = optInt(k, 0)
              }
              return m
          }

          private fun JSONObject?.strMap(): Map<String, String> {
              if (this == null) return emptyMap()
              val m = HashMap<String, String>()
              val it = keys()
              while (it.hasNext()) {
                  val k = it.next()
                  m[k] = optString(k, "")
              }
              return m
          }

          private fun JSONArray?.strings(): List<String> {
              if (this == null) return emptyList()
              val out = ArrayList<String>(length())
              for (i in 0 until length()) {
                  val v = optString(i, "")
                  if (v.isNotEmpty()) out.add(v)
              }
              return out
          }
