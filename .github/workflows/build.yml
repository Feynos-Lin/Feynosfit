                                          headlineContent = { Text(a.name) },
                                          supportingContent = {
                                              Text("≈ ${Calc.exerciseKcal(a.met, p.weightKg, 30.0).f0()} cal per 30 min")
                                          },
                                          modifier = Modifier.clickable { pick = a },
                                      )
                                  }
                              }
                          } else {
                              StrengthForm(date, p.imperial, p.weightKg) { entry ->
