              var info by remember { mutableStateOf<Social.FriendsInfo?>(null) }
              var challenges by remember { mutableStateOf<List<Social.Challenge>>(emptyList()) }
              var loading by remember { mutableStateOf(false) }
              var error by remember { mutableStateOf<String?>(null) }
              var menu by remember { mutableStateOf(false) }
              var showNew by remember { mutableStateOf(false) }
              var confirm by remember { mutableStateOf<Pair<String, () -> Unit>?>(null) }
              var deleting by remember { mutableStateOf(false) }
              var renaming by remember { mutableStateOf(false) }

              fun refresh() {
                  loading = true
                  scope.launch {
                      val r = io {
                          runCatching { Social.pushSteps(ctx) }
                          Social.friends(ctx) to Social.challenges(ctx)
