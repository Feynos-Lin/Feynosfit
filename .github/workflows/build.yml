          cat > 'app/src/main/java/com/feynos/fit/MainActivity.kt' <<'FEYNOS_EOF'
          package com.feynos.fit

          import android.content.Intent
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import com.feynos.fit.data.AppScope
          import com.feynos.fit.data.Calc
          import com.feynos.fit.data.Dates
          import com.feynos.fit.data.HealthSync
          import com.feynos.fit.data.Social
          import com.feynos.fit.data.Store
          import com.feynos.fit.ui.FitApp
          import com.feynos.fit.ui.LaunchRequest
          import com.feynos.fit.ui.Screen
          import com.feynos.fit.ui.UpdateUi
          import com.feynos.fit.widget.TodayWidget
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext

          class MainActivity : ComponentActivity() {
              private var showPrivacy by mutableStateOf(false)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  Store.init(applicationContext)
                  val app = applicationContext
                  Store.onDiaryChanged = { date -> HealthSync.schedulePush(app, date) }
                  Store.onWeightLogged = { date, kg -> HealthSync.pushWeight(app, date, kg) }
                  showPrivacy = isPrivacyIntent(intent)
                  handleOpen(intent)
                  setContent { FitApp(showPrivacy) { showPrivacy = false } }
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  if (isPrivacyIntent(intent)) showPrivacy = true
                  handleOpen(intent)
              }

              override fun onResume() {
                  super.onResume()
                  val app = applicationContext
                  AppScope.launch {
                      HealthSync.syncRecent(app)
                      // Share today's steps with friends (if signed in to a Feynos Fit server).
                      withContext(Dispatchers.IO) { runCatching { Social.pushSteps(app) } }
                  }
                  if (Store.current.profile.autoUpdateCheck) UpdateUi.check(silent = true)
              }

              /** "+ Food" on the widget jumps straight to food search for the current meal. */
              private fun handleOpen(i: Intent?) {
                  if (i?.getStringExtra(TodayWidget.EXTRA_OPEN) == TodayWidget.OPEN_ADD_FOOD && Store.current.profile.onboarded) {
