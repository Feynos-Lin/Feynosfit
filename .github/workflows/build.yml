                      }
                      UpdateActions(ctx, s)
                  }
              }
          }

          @Composable
          private fun UpdateActions(ctx: Context, s: UpdateStatus) {
              when (s) {
                  is UpdateStatus.Available -> Button(onClick = { UpdateUi.downloadAndInstall(ctx, s.release) }, modifier = Modifier.fillMaxWidth()) {
                      Text(if (s.release.sizeBytes > 0) "Download & install (${s.release.sizeBytes / (1024 * 1024)} MB)" else "Download & install")
                  }
                  is UpdateStatus.Downloading -> Column(verticalArrangement = Arrangement.spacedBy(4.dp)) {
                      LinearProgressIndicator(progress = { s.progress }, modifier = Modifier.fillMaxWidth())
                      Text("Downloading… ${(s.progress * 100).toInt()}%", style = MaterialTheme.typography.bodySmall)
                  }
                  is UpdateStatus.Ready -> Column(verticalArrangement = Arrangement.spacedBy(4.dp)) {
                      Button(onClick = { UpdateUi.install(ctx, s.apk) }, modifier = Modifier.fillMaxWidth()) { Text("Install") }
                      if (!Updater.canInstall(ctx)) {
