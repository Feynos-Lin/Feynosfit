          cat > 'app/src/main/java/com/feynos/fit/data/Calc.kt' <<'FEYNOS_EOF'
          package com.feynos.fit.data

          import java.time.LocalDate
          import java.time.LocalTime
          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.roundToInt

          object Units {
              const val LB_PER_KG = 2.20462
              const val ML_PER_OZ = 29.5735

              fun weightIn(kg: Double, imperial: Boolean) = if (imperial) kg * LB_PER_KG else kg
              fun toKg(v: Double, imperial: Boolean) = if (imperial) v / LB_PER_KG else v
              fun weightUnit(imperial: Boolean) = if (imperial) "lb" else "kg"
              fun weight(kg: Double, imperial: Boolean) = "${weightIn(kg, imperial).f1()} ${weightUnit(imperial)}"
              fun water(ml: Int, imperial: Boolean) = if (imperial) "${(ml / ML_PER_OZ).f0()} fl oz" else "$ml ml"
              fun height(cm: Double, imperial: Boolean): String {
                  if (!imperial) return "${cm.f0()} cm"
                  val inches = (cm / 2.54).roundToInt()
                  return "${inches / 12}' ${inches % 12}\""
              }
          }

          object Calc {
              val activityNames = listOf("Sedentary", "Lightly active", "Moderately active", "Very active", "Extremely active")
              val activityHints = listOf(
                  "Desk job, little or no exercise",
                  "Light exercise 1–3 days a week",
                  "Moderate exercise 3–5 days a week",
                  "Hard exercise 6–7 days a week",
                  "Physical job plus hard training",
              )
              private val factors = listOf(1.2, 1.375, 1.55, 1.725, 1.9)
              val goalNames = listOf("Lose weight", "Maintain", "Gain weight")
              private val ratesKg = listOf(0.25, 0.5, 0.75, 1.0)
              private val ratesLb = listOf(0.5, 1.0, 1.5, 2.0)

              fun rateKg(index: Int, imperial: Boolean): Double {
                  val i = index.coerceIn(0, 3)
                  return if (imperial) ratesLb[i] / Units.LB_PER_KG else ratesKg[i]
              }

              fun rateIndex(kg: Double, imperial: Boolean): Int {
                  val list = if (imperial) ratesLb.map { it / Units.LB_PER_KG } else ratesKg
                  return list.indices.minByOrNull { abs(list[it] - kg) } ?: 1
              }

              fun rateLabel(index: Int, imperial: Boolean): String {
                  val i = index.coerceIn(0, 3)
                  return if (imperial) "${ratesLb[i].f1()} lb/week" else "${ratesKg[i]} kg/week"
              }

              /** Mifflin-St Jeor */
              fun bmr(p: Profile): Double =
                  10 * p.weightKg + 6.25 * p.heightCm - 5 * p.age + (if (p.male) 5 else -161)

              fun tdee(p: Profile): Double = bmr(p) * factors[p.activity.coerceIn(0, 4)]

              fun recommendedCalories(p: Profile): Int {
                  val delta = p.rateKg * 7700.0 / 7.0
                  val t = tdee(p)
                  val target = when (p.goalType) {
                      0 -> t - delta
                      2 -> t + delta
                      else -> t
                  }
                  val floor = if (p.male) 1500.0 else 1200.0
                  return (max(target, floor) / 10).roundToInt() * 10
              }

              /** grams of protein, carbs, fat */
              fun macroGrams(p: Profile): Triple<Double, Double, Double> = Triple(
                  p.calorieGoal * p.proteinPct / 100.0 / 4.0,
                  p.calorieGoal * p.carbsPct / 100.0 / 4.0,
                  p.calorieGoal * p.fatPct / 100.0 / 9.0,
              )

              fun bmi(p: Profile): Double {
                  if (p.heightCm <= 0) return 0.0
                  val m = p.heightCm / 100.0
                  return p.weightKg / (m * m)
              }

              fun bmiLabel(b: Double): String = when {
                  b <= 0 -> ""
                  b < 18.5 -> "Underweight"
                  b < 25 -> "Healthy range"
                  b < 30 -> "Overweight"
                  else -> "Obese range"
              }

              fun exerciseKcal(met: Double, kg: Double, minutes: Double): Double = met * kg * minutes / 60.0

              fun defaultMeal(): Int {
                  val h = LocalTime.now().hour
                  return when {
                      h < 11 -> 0
                      h < 16 -> 1
                      h < 21 -> 2
                      else -> 3
                  }
              }

              /** Consecutive days with at least one food logged, ending today (or yesterday). */
              fun streak(diary: List<DiaryEntry>): Int {
                  val days = diary.map { it.date }.toHashSet()
                  var d = LocalDate.now()
                  if (!days.contains(d.toString())) d = d.minusDays(1)
                  var n = 0
                  while (days.contains(d.toString())) {
                      n++
                      d = d.minusDays(1)
                  }
                  return n
              }
          }
          FEYNOS_EOF

          cat > 'app/src/main/java/com/feynos/fit/data/FoodApi.kt' <<'FEYNOS_EOF'
          package com.feynos.fit.data

          import org.json.JSONObject
          import java.io.IOException
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder

          /** Open Food Facts — free, no API key. Call from a background thread. */
          object FoodApi {
              private const val UA = "FeynosFit/0.1 (Android personal food tracker)"
              private const val FIELDS = "code,product_name,brands,nutriments,serving_size,serving_quantity"

              fun search(query: String): List<Food> {
                  val q = URLEncoder.encode(query, "UTF-8")
                  val url = "https://world.openfoodfacts.org/cgi/search.pl?search_terms=$q" +
                      "&search_simple=1&action=process&json=1&page_size=40&fields=$FIELDS"
                  val json = JSONObject(get(url))
                  val arr = json.optJSONArray("products") ?: return emptyList()
                  val out = ArrayList<Food>()
                  for (i in 0 until arr.length()) {
                      parse(arr.optJSONObject(i))?.let { out.add(it) }
                  }
                  return out.distinctBy { (it.name + "|" + it.brand + "|" + it.servingDesc).lowercase() }
              }

              fun byBarcode(code: String): Food? {
                  val clean = code.filter { it.isDigit() }
                  if (clean.isEmpty()) return null
                  val json = JSONObject(get("https://world.openfoodfacts.org/api/v2/product/$clean.json?fields=$FIELDS"))
                  if (json.optInt("status", 0) != 1) return null
                  return parse(json.optJSONObject("product"))?.copy(barcode = clean)
              }

              private fun get(url: String): String {
                  val c = URL(url).openConnection() as HttpURLConnection
                  c.connectTimeout = 15000
                  c.readTimeout = 20000
                  c.setRequestProperty("User-Agent", UA)
                  c.setRequestProperty("Accept", "application/json")
                  try {
                      val code = c.responseCode
                      if (code !in 200..299) throw IOException("HTTP $code")
                      return c.inputStream.bufferedReader().use { it.readText() }
                  } finally {
                      c.disconnect()
                  }
              }

              private fun parse(p: JSONObject?): Food? {
                  if (p == null) return null
                  val name = p.optString("product_name", "").trim()
                  if (name.isEmpty()) return null
                  val nm = p.optJSONObject("nutriments") ?: return null
                  fun g(k: String): Double = nm.optDouble(k, 0.0).safe()

                  var kcal = g("energy-kcal_100g")
                  if (kcal <= 0) kcal = g("energy_100g") / 4.184
                  val protein = g("proteins_100g")
                  val carbs = g("carbohydrates_100g")
                  val fat = g("fat_100g")
                  if (kcal <= 0 && protein + carbs + fat <= 0) return null

                  val per100 = Nutrients(
                      kcal = kcal, protein = protein, carbs = carbs, fat = fat,
                      fiber = g("fiber_100g"), sugar = g("sugars_100g"), satFat = g("saturated-fat_100g"),
                      sodiumMg = g("sodium_100g") * 1000, cholesterolMg = g("cholesterol_100g") * 1000,
                      potassiumMg = g("potassium_100g") * 1000,
                  )
                  val sq = p.optDouble("serving_quantity", 0.0).safe()
                  val grams = if (sq > 0) sq else 100.0
                  val sizeText = p.optString("serving_size", "").trim()
                  val desc = when {
                      sq <= 0 -> "100 g"
                      sizeText.isNotEmpty() -> sizeText
                      else -> "${sq.f0()} g"
                  }
                  val brand = p.optString("brands", "").split(",").firstOrNull()?.trim() ?: ""
                  return Food(
                      name = name, brand = brand, servingDesc = desc, servingGrams = grams,
                      n = per100 * (grams / 100.0), barcode = p.optString("code", ""), source = "online",
                  )
              }
          }
          FEYNOS_EOF

