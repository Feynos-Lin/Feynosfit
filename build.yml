          @Composable
          fun ProgressScreen() {
              val data by Store.data.collectAsState()
              val nav = LocalNav.current
              val p = data.profile
              var range by rememberSaveable { mutableIntStateOf(7) }
              val days = Dates.lastNDays(range)
              val byDay = data.diary.groupBy { it.date }
              val exByDay = data.exercises.groupBy { it.date }
              val kcal = days.map { d -> byDay[d]?.sumOf { it.total.kcal } ?: 0.0 }
              val logged = days.filter { byDay.containsKey(it) }
              val totals = logged.fold(Nutrients.ZERO) { a, d ->
                  a + (byDay[d] ?: emptyList()).fold(Nutrients.ZERO) { b, e -> b + e.total }
              }
              val avg = if (logged.isEmpty()) Nutrients.ZERO else totals * (1.0 / logged.size)
              val rangeEx = days.flatMap { exByDay[it] ?: emptyList() }
              val weightsInRange = data.weights.filter { it.date >= days.first() }
              val bmi = Calc.bmi(p)

              Scaffold(topBar = { TopAppBar(title = { Text("Progress") }) }) { pad ->
                  Centered(Modifier.padding(pad)) {
                      LazyColumn(
                          contentPadding = PaddingValues(16.dp, 8.dp, 16.dp, 32.dp),
                          verticalArrangement = Arrangement.spacedBy(12.dp),
                      ) {
                          item {
                              ChoiceRow(listOf("7 days", "30 days", "90 days"), when (range) { 7 -> 0; 30 -> 1; else -> 2 }) {
                                  range = when (it) { 0 -> 7; 1 -> 30; else -> 90 }
                              }
                          }
                          item {
                              SectionCard("Weight", trailing = { TextButton(onClick = { nav.push(Screen.Weight) }) { Text("Log") } }) {
                                  if (weightsInRange.size >= 2) {
                                      LineChart(
                                          weightsInRange.map { Units.weightIn(it.kg, p.imperial) },
                                          goal = Units.weightIn(p.goalWeightKg, p.imperial),
                                      )
                                  } else {
                                      Text(
                                          "Log at least two weigh-ins in this range to see a trend line.",
                                          style = MaterialTheme.typography.bodySmall,
                                          color = MaterialTheme.colorScheme.onSurfaceVariant,
                                      )
                                  }
                                  val start = data.weights.firstOrNull()
                                  val now = data.weights.lastOrNull()
                                  Row(Modifier.fillMaxWidth()) {
                                      Stat("Start", start?.let { Units.weight(it.kg, p.imperial) } ?: "—", Modifier.weight(1f))
                                      Stat("Current", now?.let { Units.weight(it.kg, p.imperial) } ?: "—", Modifier.weight(1f))
                                      Stat("Goal", Units.weight(p.goalWeightKg, p.imperial), Modifier.weight(1f))
                                  }
                                  if (now != null) {
                                      val toGo = now.kg - p.goalWeightKg
                                      Text(
                                          when {
                                              p.goalType == 1 -> "Maintaining around ${Units.weight(p.goalWeightKg, p.imperial)}"
                                              kotlin.math.abs(toGo) < 0.25 -> "You've reached your goal weight 🎉"
                                              else -> "${Units.weight(kotlin.math.abs(toGo), p.imperial)} to go"
                                          },
                                          style = MaterialTheme.typography.bodyMedium,
                                      )
                                  }
                              }
                          }
                          item {
                              SectionCard("Calories") {
                                  BarChart(
                                      kcal,
                                      if (range == 7) days.map { Dates.weekdayLetter(it) } else emptyList(),
                                      goal = p.calorieGoal.toDouble(),
                                  )
                                  Row(Modifier.fillMaxWidth()) {
                                      Stat("Daily average", avg.kcal.f0(), Modifier.weight(1f))
                                      Stat("Goal", p.calorieGoal.toString(), Modifier.weight(1f))
                                      Stat("Days logged", "${logged.size}/${days.size}", Modifier.weight(1f))
                                  }
                                  Text(
                                      "Averages use only days you logged food. Bars above the dashed line went over your goal.",
                                      style = MaterialTheme.typography.bodySmall,
                                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                                  )
                              }
                          }
                          item {
                              SectionCard("Average macros") {
                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                      MacroPie(avg.protein, avg.carbs, avg.fat)
                                      Spacer(Modifier.width(20.dp))
                                      MacroLegend(avg, p)
                                  }
                              }
                          }
                          item {
                              SectionCard("Exercise") {
                                  Row(Modifier.fillMaxWidth()) {
                                      Stat("Sessions", rangeEx.size.toString(), Modifier.weight(1f))
                                      Stat("Minutes", rangeEx.sumOf { it.minutes }.toString(), Modifier.weight(1f))
                                      Stat("Calories", rangeEx.sumOf { it.kcal }.f0(), Modifier.weight(1f))
                                  }
                              }
                          }
                          item {
                              SectionCard("Body") {
                                  Row(Modifier.fillMaxWidth()) {
                                      Stat("BMI", if (bmi > 0) bmi.f1() else "—", Modifier.weight(1f))
                                      Stat("Height", Units.height(p.heightCm, p.imperial), Modifier.weight(1f))
                                      Stat("Maintenance", "${Calc.tdee(p).f0()} cal", Modifier.weight(1f))
                                  }
                                  Text(
                                      Calc.bmiLabel(bmi) + " · BMI is a rough screening number and doesn't account for muscle.",
                                      style = MaterialTheme.typography.bodySmall,
                                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                                  )
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun MacroLegend(n: Nutrients, p: Profile) {
              val total = n.protein * 4 + n.carbs * 4 + n.fat * 9
              fun pct(v: Double) = if (total <= 0) 0.0 else v / total * 100
              Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                  LegendRow(ProteinColor, "Protein", "${n.protein.f0()} g · ${pct(n.protein * 4).f0()}%", "goal ${p.proteinPct}%")
                  LegendRow(CarbsColor, "Carbs", "${n.carbs.f0()} g · ${pct(n.carbs * 4).f0()}%", "goal ${p.carbsPct}%")
                  LegendRow(FatColor, "Fat", "${n.fat.f0()} g · ${pct(n.fat * 9).f0()}%", "goal ${p.fatPct}%")
              }
          }

          @Composable
          private fun LegendRow(color: Color, label: String, value: String, goal: String) {
              Row(verticalAlignment = Alignment.CenterVertically) {
                  Box(Modifier.size(12.dp).background(color, CircleShape))
                  Spacer(Modifier.width(8.dp))
                  Column {
                      Text("$label  $value", style = MaterialTheme.typography.bodyMedium, fontWeight = FontWeight.Medium)
                      Text(goal, style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                  }
              }
          }

          @Composable
          fun WeightScreen() {
              val nav = LocalNav.current
              val data by Store.data.collectAsState()
              val p = data.profile
              var adding by remember { mutableStateOf(false) }
              var deleting by remember { mutableStateOf<WeightEntry?>(null) }

              Scaffold(
                  topBar = { BackTopBar("Weight", { nav.pop() }) },
                  floatingActionButton = {
                      FloatingActionButton(onClick = { adding = true }) { Icon(Icons.Filled.Add, contentDescription = "Log weight") }
                  },
              ) { pad ->
                  Centered(Modifier.padding(pad)) {
                      LazyColumn(
                          contentPadding = PaddingValues(16.dp, 8.dp, 16.dp, 96.dp),
                          verticalArrangement = Arrangement.spacedBy(8.dp),
                      ) {
                          item {
                              SectionCard("Trend") {
                                  if (data.weights.size >= 2) {
                                      LineChart(
                                          data.weights.takeLast(90).map { Units.weightIn(it.kg, p.imperial) },
                                          goal = Units.weightIn(p.goalWeightKg, p.imperial),
                                      )
                                      Text(
                                          "Dashed line is your goal (${Units.weight(p.goalWeightKg, p.imperial)}).",
                                          style = MaterialTheme.typography.bodySmall,
                                          color = MaterialTheme.colorScheme.onSurfaceVariant,
                                      )
                                  } else {
                                      Text("Log at least two weigh-ins to see your trend.")
                                  }
                              }
                          }
                          if (data.weights.isEmpty()) {
                              item { EmptyState("No weigh-ins yet", "Tap + to log your weight.") }
                          }
                          val list = data.weights.reversed()
                          items(list) { w ->
                              val idx = data.weights.indexOf(w)
                              val prev = if (idx > 0) data.weights[idx - 1] else null
                              val diff = if (prev != null) w.kg - prev.kg else null
                              ListItem(
                                  headlineContent = { Text(Units.weight(w.kg, p.imperial), fontWeight = FontWeight.SemiBold) },
                                  supportingContent = {
                                      Text(
                                          Dates.label(w.date) + (diff?.let { d ->
                                              "  ·  " + (if (d > 0) "+" else "") + Units.weight(d, p.imperial)
                                          } ?: ""),
                                      )
                                  },
                                  trailingContent = {
                                      IconButton(onClick = { deleting = w }) { Icon(Icons.Filled.Delete, contentDescription = "Delete") }
                                  },
                              )
                          }
                      }
                  }
              }

              if (adding) {
                  WeightDialog(p, onDismiss = { adding = false }) { date, kg ->
                      Store.logWeight(date, kg)
                      adding = false
                  }
              }
              deleting?.let { w ->
                  ConfirmDialog(
                      title = "Delete weigh-in?",
                      text = "${Units.weight(w.kg, p.imperial)} on ${Dates.label(w.date)}",
                      confirmLabel = "Delete",
                      onConfirm = {
                          Store.deleteWeight(w.date)
                          deleting = null
                      },
                      onDismiss = { deleting = null },
                  )
              }
          }

          @Composable
          private fun WeightDialog(p: Profile, onDismiss: () -> Unit, onSave: (String, Double) -> Unit) {
              var date by remember { mutableStateOf(Dates.today()) }
              var text by remember { mutableStateOf(Units.weightIn(p.weightKg, p.imperial).f1()) }
              val v = parseNum(text)
              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = { Text("Log weight") },
                  text = {
                      Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              IconButton(onClick = { date = Dates.shift(date, -1) }) { Icon(Icons.Filled.ChevronLeft, contentDescription = "Earlier") }
                              Text(Dates.label(date), modifier = Modifier.weight(1f), style = MaterialTheme.typography.titleSmall)
                              IconButton(
                                  onClick = { date = Dates.shift(date, 1) },
                                  enabled = date < Dates.today(),
                              ) { Icon(Icons.Filled.ChevronRight, contentDescription = "Later") }
                          }
                          NumField(text, { text = it }, "Weight (${Units.weightUnit(p.imperial)})", Modifier.fillMaxWidth())
                      }
                  },
                  confirmButton = {
                      TextButton(enabled = v != null && v > 0, onClick = {
                          if (v != null) onSave(date, Units.toKg(v, p.imperial))
                      }) { Text("Save") }
                  },
                  dismissButton = { TextButton(onClick = onDismiss) { Text("Cancel") } },
              )
          }

          private data class NRow(val label: String, val value: Double, val goal: Double, val unit: String, val limit: Boolean = false)

          @Composable
          fun NutritionScreen(startDate: String) {
              val nav = LocalNav.current
              val data by Store.data.collectAsState()
              val p = data.profile
              var date by rememberSaveable { mutableStateOf(startDate) }
              val entries = data.diary.filter { it.date == date }
              val n = entries.fold(Nutrients.ZERO) { a, e -> a + e.total }
              val macros = Calc.macroGrams(p)
              val cal = p.calorieGoal.toDouble()
              val rows = listOf(
                  NRow("Calories", n.kcal, cal, ""),
                  NRow("Protein", n.protein, macros.first, "g"),
                  NRow("Carbohydrates", n.carbs, macros.second, "g"),
                  NRow("Fat", n.fat, macros.third, "g"),
                  NRow("Fiber", n.fiber, cal / 1000.0 * 14.0, "g"),
                  NRow("Sugar", n.sugar, 50.0, "g", limit = true),
                  NRow("Saturated fat", n.satFat, cal * 0.10 / 9.0, "g", limit = true),
                  NRow("Sodium", n.sodiumMg, 2300.0, "mg", limit = true),
                  NRow("Cholesterol", n.cholesterolMg, 300.0, "mg", limit = true),
                  NRow("Potassium", n.potassiumMg, 3500.0, "mg"),
              )

              Scaffold(topBar = { BackTopBar("Nutrition", { nav.pop() }) }) { pad ->
                  Centered(Modifier.padding(pad)) {
                      LazyColumn(
                          contentPadding = PaddingValues(16.dp, 8.dp, 16.dp, 32.dp),
                          verticalArrangement = Arrangement.spacedBy(12.dp),
                      ) {
                          item {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  IconButton(onClick = { date = Dates.shift(date, -1) }) { Icon(Icons.Filled.ChevronLeft, contentDescription = "Previous day") }
                                  Text(Dates.long(date), modifier = Modifier.weight(1f), style = MaterialTheme.typography.titleMedium)
                                  IconButton(onClick = { date = Dates.shift(date, 1) }) { Icon(Icons.Filled.ChevronRight, contentDescription = "Next day") }
                              }
                          }
                          item {
                              SectionCard("Macro split") {
                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                      MacroPie(n.protein, n.carbs, n.fat)
                                      Spacer(Modifier.width(20.dp))
                                      MacroLegend(n, p)
                                  }
                              }
                          }
                          item {
                              SectionCard("Calories by meal") {
                                  mealNames.forEachIndexed { i, m ->
                                      val k = entries.filter { it.meal == i }.sumOf { it.total.kcal }
                                      Row {
                                          Text(m, modifier = Modifier.weight(1f))
                                          Text("${k.f0()} cal  ·  ${if (n.kcal > 0) (k / n.kcal * 100).f0() else "0"}%")
                                      }
                                  }
                              }
                          }
                          item {
                              SectionCard("Nutrients vs. daily targets") {
                                  Column(verticalArrangement = Arrangement.spacedBy(12.dp)) {
                                      rows.forEach { r ->
                                          val color = when {
                                              r.limit && r.value > r.goal -> MaterialTheme.colorScheme.error
                                              r.label == "Protein" -> ProteinColor
                                              r.label == "Carbohydrates" -> CarbsColor
                                              r.label == "Fat" -> FatColor
                                              else -> MaterialTheme.colorScheme.primary
                                          }
                                          MacroBar(if (r.limit) "${r.label} (limit)" else r.label, r.value, r.goal, color, r.unit)
                                      }
                                  }
                                  Text(
                                      "Online foods don't always list every nutrient, so micronutrient totals can read low. Targets are general adult guidelines, not medical advice.",
                                      style = MaterialTheme.typography.bodySmall,
                                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                                  )
                              }
                          }
                      }
                  }
              }
          }
          FEYNOS_EOF

          cat > 'app/src/main/java/com/feynos/fit/ui/Theme.kt' <<'FEYNOS_EOF'
          package com.feynos.fit.ui

          import android.app.Activity
          import android.os.Build
          import androidx.compose.foundation.isSystemInDarkTheme
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.material3.dynamicDarkColorScheme
          import androidx.compose.material3.dynamicLightColorScheme
          import androidx.compose.material3.lightColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.SideEffect
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.toArgb
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.platform.LocalView
          import androidx.core.view.WindowCompat

          val ProteinColor = Color(0xFFFF8A00)
          val CarbsColor = Color(0xFF26A69A)
          val FatColor = Color(0xFF7E57C2)
          val WaterColor = Color(0xFF29B6F6)

          private val LightColors = lightColorScheme(
              primary = Color(0xFF1E8E3E),
              onPrimary = Color.White,
              primaryContainer = Color(0xFFB7F1C2),
              onPrimaryContainer = Color(0xFF00210B),
              secondary = Color(0xFF4F6354),
              tertiary = Color(0xFFE8710A),
              background = Color(0xFFFBFDF8),
              surface = Color(0xFFFBFDF8),
          )

          private val DarkColors = darkColorScheme(
              primary = Color(0xFF6FDB8F),
              onPrimary = Color(0xFF003917),
              primaryContainer = Color(0xFF005224),
              onPrimaryContainer = Color(0xFFB7F1C2),
              secondary = Color(0xFFB6CCB9),
              tertiary = Color(0xFFFFB86B),
              background = Color(0xFF111411),
              surface = Color(0xFF111411),
          )

          @Composable
          fun FitTheme(themeMode: Int, dynamic: Boolean, content: @Composable () -> Unit) {
              val dark = when (themeMode) {
                  1 -> false
                  2 -> true
                  else -> isSystemInDarkTheme()
              }
              val ctx = LocalContext.current
              val scheme = when {
                  dynamic && Build.VERSION.SDK_INT >= Build.VERSION_CODES.S ->
                      if (dark) dynamicDarkColorScheme(ctx) else dynamicLightColorScheme(ctx)
                  dark -> DarkColors
                  else -> LightColors
              }
              val view = LocalView.current
              if (!view.isInEditMode) {
                  SideEffect {
                      val activity = view.context as? Activity
                      if (activity != null) {
                          val window = activity.window
                          @Suppress("DEPRECATION")
                          window.statusBarColor = scheme.surface.toArgb()
                          @Suppress("DEPRECATION")
                          window.navigationBarColor = scheme.surfaceContainer.toArgb()
                          val controller = WindowCompat.getInsetsController(window, view)
                          controller.isAppearanceLightStatusBars = !dark
                          controller.isAppearanceLightNavigationBars = !dark
                      }
                  }
              }
              MaterialTheme(colorScheme = scheme, content = content)
          }
          FEYNOS_EOF

          # Fixed signing key so each new build installs as an update over the last one
          echo '' | base64 -d > app/debug.keystore
          echo "Generated $(find . -type f | wc -l) project files"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        shell: bash
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: FeynosFit
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        shell: bash
        run: |
          mkdir -p dist
          cp FeynosFit/app/build/outputs/apk/release/app-release.apk "dist/FeynosFit-v${APP_VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          ls -la dist

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: FeynosFit-v${{ env.APP_VERSION }}-build${{ github.run_number }}
          path: dist/*.apk

      - name: Publish release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Feynos Fit v${{ env.APP_VERSION }} (build ${{ github.run_number }})
          body: |
            Download the .apk below on your phone and open it to install or update.
            Built from commit ${{ github.sha }}.
          files: dist/*.apk
          make_latest: true
