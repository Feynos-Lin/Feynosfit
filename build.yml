          @Composable
          fun SettingsScreen() {
              val nav = LocalNav.current
              val data by Store.data.collectAsState()
              val p = data.profile
              val ctx = LocalContext.current
              var confirmReset by remember { mutableStateOf(false) }

              val exportLauncher = rememberLauncherForActivityResult(ActivityResultContracts.CreateDocument("application/json")) { uri ->
                  if (uri != null) {
                      val ok = runCatching {
                          val out = ctx.contentResolver.openOutputStream(uri) ?: throw IllegalStateException("no stream")
                          out.use { it.write(Store.export().toByteArray()) }
                      }.isSuccess
                      Toast.makeText(ctx, if (ok) "Backup saved" else "Couldn't save the backup", Toast.LENGTH_SHORT).show()
                  }
              }
              val importLauncher = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
                  if (uri != null) {
                      val text = runCatching {
                          ctx.contentResolver.openInputStream(uri)?.bufferedReader()?.use { it.readText() }
                      }.getOrNull()
                      val ok = text != null && Store.importJson(text)
                      Toast.makeText(ctx, if (ok) "Backup restored" else "That file isn't a Feynos Fit backup", Toast.LENGTH_LONG).show()
                  }
              }

              Scaffold(topBar = { BackTopBar("Settings", { nav.pop() }) }) { pad ->
                  Centered(Modifier.padding(pad)) {
                      Column(
                          Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(16.dp),
                          verticalArrangement = Arrangement.spacedBy(12.dp),
                      ) {
                          SectionCard("Units") {
                              ChoiceRow(listOf("US (lb, fl oz)", "Metric (kg, ml)"), if (p.imperial) 0 else 1) {
                                  Store.setProfile(p.copy(imperial = it == 0))
                              }
                          }
                          SectionCard("Appearance") {
                              ChoiceRow(listOf("System", "Light", "Dark"), p.theme) { Store.setProfile(p.copy(theme = it)) }
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Column(Modifier.weight(1f)) {
                                      Text("Wallpaper colors")
                                      Text(
                                          "Match your phone's Material You palette",
                                          style = MaterialTheme.typography.bodySmall,
                                          color = MaterialTheme.colorScheme.onSurfaceVariant,
                                      )
                                  }
                                  Switch(checked = p.dynamicColor, onCheckedChange = { Store.setProfile(p.copy(dynamicColor = it)) })
                              }
                          }
                          SectionCard("Your data") {
                              Text(
                                  "Everything is stored only on this phone. Save a backup file before uninstalling or switching phones.",
                                  style = MaterialTheme.typography.bodySmall,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant,
                              )
                              OutlinedButton(
                                  onClick = { exportLauncher.launch("feynos-fit-backup-${Dates.today()}.json") },
                                  modifier = Modifier.fillMaxWidth(),
                              ) { Text("Save backup file") }
                              OutlinedButton(
                                  onClick = { importLauncher.launch(arrayOf("application/json", "text/plain", "application/octet-stream")) },
                                  modifier = Modifier.fillMaxWidth(),
                              ) { Text("Restore from backup file") }
                              TextButton(onClick = { confirmReset = true }, modifier = Modifier.fillMaxWidth()) {
                                  Text("Erase all data", color = MaterialTheme.colorScheme.error)
                              }
                          }
                          SectionCard("About") {
                              Text("Feynos Fit ${BuildConfig.VERSION_NAME} (build ${BuildConfig.VERSION_CODE})")
                              Text(
                                  "Food search and barcode data come from Open Food Facts (openfoodfacts.org), a free, community-built database. Calorie targets use the Mifflin-St Jeor equation; exercise estimates use standard MET values.",
                                  style = MaterialTheme.typography.bodySmall,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant,
                              )
                          }
                      }
                  }
              }

              if (confirmReset) {
                  ConfirmDialog(
                      title = "Erase everything?",
                      text = "This deletes your diary, foods, recipes, weigh-ins and goals from this phone. It can't be undone.",
                      confirmLabel = "Erase",
                      onConfirm = {
                          confirmReset = false
                          Store.reset()
                      },
                      onDismiss = { confirmReset = false },
                  )
              }
          }
