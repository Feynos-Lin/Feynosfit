          data class AppData(
              val profile: Profile = Profile(),
              val foods: List<Food> = emptyList(),
              val recents: List<Food> = emptyList(),
              val recipes: List<Recipe> = emptyList(),
              val diary: List<DiaryEntry> = emptyList(),
              val exercises: List<ExerciseEntry> = emptyList(),
              val weights: List<WeightEntry> = emptyList(),
              val water: Map<String, Int> = emptyMap(),
              val steps: Map<String, Int> = emptyMap(),
              val notes: Map<String, String> = emptyMap(),
          ) {
              fun toJson(): JSONObject = JSONObject()
                  .put("version", 1)
                  .put("profile", profile.toJson())
                  .put("foods", foods.toJsonArray { it.toJson() })
                  .put("recents", recents.toJsonArray { it.toJson() })
                  .put("recipes", recipes.toJsonArray { it.toJson() })
                  .put("diary", diary.toJsonArray { it.toJson() })
                  .put("exercises", exercises.toJsonArray { it.toJson() })
                  .put("weights", weights.toJsonArray { it.toJson() })
                  .put("water", water.intMapJson())
                  .put("steps", steps.intMapJson())
                  .put("notes", notes.strMapJson())

              companion object {
                  fun fromJson(o: JSONObject) = AppData(
                      profile = Profile.fromJson(o.optJSONObject("profile")),
                      foods = o.optJSONArray("foods").mapObj { Food.fromJson(it) },
                      recents = o.optJSONArray("recents").mapObj { Food.fromJson(it) },
