          package com.feynos.fit.data

          import android.content.Context
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.flow.update
          import org.json.JSONObject
          import java.io.File
          import java.util.concurrent.Executors

          /** All app data lives in one JSON file on the device. */
          object Store {
              private var file: File? = null
              private val _data = MutableStateFlow(AppData())
              val data: StateFlow<AppData> = _data.asStateFlow()
              private val io = Executors.newSingleThreadExecutor()

              val current: AppData get() = _data.value

              fun init(context: Context) {
                  if (file != null) return
                  val f = File(context.filesDir, "feynos_fit.json")
                  file = f
                  if (f.exists()) {
                      runCatching { AppData.fromJson(JSONObject(f.readText())) }
                          .onSuccess { _data.value = it }
                  }
              }

              fun update(block: (AppData) -> AppData) {
                  _data.update(block)
                  io.execute { persist() }
              }

              private fun persist() {
                  val f = file ?: return
                  runCatching {
                      val tmp = File(f.parentFile, f.name + ".tmp")
                      tmp.writeText(_data.value.toJson().toString())
                      if (!tmp.renameTo(f)) {
                          f.writeText(tmp.readText())
                          tmp.delete()
                      }
                  }
              }

              // ---- Diary ----

              fun logFood(food: Food, date: String, meal: Int, servings: Double) {
                  val entry = DiaryEntry(
                      date = date, meal = meal, name = food.name, brand = food.brand, servings = servings,
                      servingDesc = food.servingDesc, servingGrams = food.servingGrams, perServing = food.n,
                  )
                  update { d ->
                      d.copy(
                          diary = d.diary + entry,
                          recents = (listOf(food) + d.recents.filterNot { sameFood(it, food) }).take(60),
                      )
                  }
              }

              private fun sameFood(a: Food, b: Food) = a.id == b.id ||
                  (a.name.equals(b.name, true) && a.brand.equals(b.brand, true) && a.servingDesc == b.servingDesc)

              fun addEntry(e: DiaryEntry) = update { it.copy(diary = it.diary + e) }

              fun updateEntry(e: DiaryEntry) = update { d -> d.copy(diary = d.diary.map { if (it.id == e.id) e else it }) }

              fun deleteEntry(id: String) = update { d -> d.copy(diary = d.diary.filterNot { it.id == id }) }

              fun copyMeal(from: String, to: String, meal: Int) = update { d ->
                  val copies = d.diary.filter { it.date == from && it.meal == meal }.map { it.copy(id = newId(), date = to) }
                  d.copy(diary = d.diary + copies)
              }

              fun copyDay(from: String, to: String) = update { d ->
                  val copies = d.diary.filter { it.date == from }.map { it.copy(id = newId(), date = to) }
                  d.copy(diary = d.diary + copies)
              }

              // ---- Exercise ----

              fun addExercise(e: ExerciseEntry) = update { it.copy(exercises = it.exercises + e) }

              fun deleteExercise(id: String) = update { d -> d.copy(exercises = d.exercises.filterNot { it.id == id }) }

              // ---- Daily trackers ----

              fun setWater(date: String, ml: Int) = update { it.copy(water = it.water + (date to ml.coerceAtLeast(0))) }

              fun setSteps(date: String, steps: Int) = update { it.copy(steps = it.steps + (date to steps.coerceAtLeast(0))) }

              fun setNote(date: String, text: String) = update {
                  it.copy(notes = if (text.isBlank()) it.notes - date else it.notes + (date to text))
              }

              // ---- Weight ----

              fun logWeight(date: String, kg: Double) = update { d ->
                  val list = (d.weights.filterNot { it.date == date } + WeightEntry(date, kg)).sortedBy { it.date }
                  d.copy(weights = list, profile = d.profile.copy(weightKg = list.last().kg))
              }

              fun deleteWeight(date: String) = update { d ->
                  val list = d.weights.filterNot { it.date == date }
                  d.copy(weights = list, profile = if (list.isEmpty()) d.profile else d.profile.copy(weightKg = list.last().kg))
              }

              // ---- Foods & recipes ----

              fun saveFood(f: Food) = update { d ->
                  d.copy(foods = if (d.foods.any { it.id == f.id }) d.foods.map { if (it.id == f.id) f else it } else d.foods + f)
              }

              fun deleteFood(id: String) = update { d -> d.copy(foods = d.foods.filterNot { it.id == id }) }

              fun saveRecipe(r: Recipe) = update { d ->
                  d.copy(recipes = if (d.recipes.any { it.id == r.id }) d.recipes.map { if (it.id == r.id) r else it } else d.recipes + r)
              }

              fun deleteRecipe(id: String) = update { d -> d.copy(recipes = d.recipes.filterNot { it.id == id }) }

              // ---- Profile & data ----

              fun setProfile(p: Profile) = update { it.copy(profile = p) }

              fun export(): String = current.toJson().toString(2)

              fun importJson(json: String): Boolean = runCatching {
                  val d = AppData.fromJson(JSONObject(json))
                  update { d }
              }.isSuccess

              fun reset() = update { AppData() }
          }
