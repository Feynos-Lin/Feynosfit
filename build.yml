                  if (text != saved) {
                      TextButton(onClick = { Store.setNote(date, text) }) { Text("Save note") }
                  }
              }
          }

          @Composable
          private fun EditEntryDialog(e: DiaryEntry, onDismiss: () -> Unit) {
              var servings by remember(e.id) { mutableStateOf(e.servings.num()) }
              var meal by remember(e.id) { mutableIntStateOf(e.meal) }
              val s = parseNum(servings) ?: 0.0
              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = { Text(e.name, maxLines = 2, overflow = TextOverflow.Ellipsis) },
                  text = {
                      Column(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                          Text(
                              "1 serving = ${e.servingDesc}",
                              style = MaterialTheme.typography.bodySmall,
                              color = MaterialTheme.colorScheme.onSurfaceVariant,
                          )
                          NumField(servings, { servings = it }, "Number of servings", Modifier.fillMaxWidth())
                          MealChips(meal) { meal = it }
                          NutrientSummary(e.perServing * s)
                      }
                  },
                  confirmButton = {
                      TextButton(enabled = s > 0, onClick = {
                          Store.updateEntry(e.copy(servings = s, meal = meal))
                          onDismiss()
                      }) { Text("Save") }
                  },
                  dismissButton = {
                      Row {
                          TextButton(onClick = {
                              Store.deleteEntry(e.id)
                              onDismiss()
                          }) { Text("Delete", color = MaterialTheme.colorScheme.error) }
                          TextButton(onClick = onDismiss) { Text("Cancel") }
                      }
                  },
              )
          }

          @Composable
