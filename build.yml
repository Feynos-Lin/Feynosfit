                  Centered(Modifier.padding(pad)) {
                      Column(Modifier.fillMaxSize()) {
                          TabRow(selectedTabIndex = tab) {
                              Tab(selected = tab == 0, onClick = { tab = 0 }, text = { Text("Cardio") })
                              Tab(selected = tab == 1, onClick = { tab = 1 }, text = { Text("Strength") })
                          }
                          if (tab == 0) {
                              OutlinedTextField(
                                  value = query,
                                  onValueChange = { query = it },
                                  modifier = Modifier.fillMaxWidth().padding(16.dp),
                                  placeholder = { Text("Search exercises") },
                                  leadingIcon = { Icon(Icons.Filled.Search, contentDescription = null) },
                                  singleLine = true,
                              )
                              val q = query.trim().lowercase()
                              val list = FoodDb.cardio.filter { q.isEmpty() || it.name.lowercase().contains(q) }
                              LazyColumn(Modifier.weight(1f), contentPadding = PaddingValues(bottom = 24.dp)) {
                                  item {
                                      ListItem(
                                          headlineContent = { Text(if (q.isEmpty()) "Custom exercise" else "Custom: \"${query.trim()}\"") },
