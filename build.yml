              var carbs by remember { mutableStateOf(startText(existing?.n?.carbs)) }
              var fat by remember { mutableStateOf(startText(existing?.n?.fat)) }
              var fiber by remember { mutableStateOf(startText(existing?.n?.fiber)) }
              var sugar by remember { mutableStateOf(startText(existing?.n?.sugar)) }
              var satFat by remember { mutableStateOf(startText(existing?.n?.satFat)) }
