                                  NumField(grams, { grams = it }, "Grams", Modifier.weight(1f))
                              }
                              NumField(code, { code = it }, "Barcode (optional)", Modifier.fillMaxWidth(), decimal = false)
                          }
                          SectionCard("Nutrition per serving") {
                              NumField(kcal, { kcal = it }, "Calories *", Modifier.fillMaxWidth())
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  NumField(protein, { protein = it }, "Protein g", Modifier.weight(1f))
                                  NumField(carbs, { carbs = it }, "Carbs g", Modifier.weight(1f))
                                  NumField(fat, { fat = it }, "Fat g", Modifier.weight(1f))
                              }
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  NumField(fiber, { fiber = it }, "Fiber g", Modifier.weight(1f))
                                  NumField(sugar, { sugar = it }, "Sugar g", Modifier.weight(1f))
                                  NumField(satFat, { satFat = it }, "Sat. fat g", Modifier.weight(1f))
                              }
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  NumField(sodium, { sodium = it }, "Sodium mg", Modifier.weight(1f))
                                  NumField(cholesterol, { cholesterol = it }, "Cholest. mg", Modifier.weight(1f))
                                  NumField(potassium, { potassium = it }, "Potass. mg", Modifier.weight(1f))
                              }
                          }
                          FilledTonalButton(onClick = { save() }, enabled = valid, modifier = Modifier.fillMaxWidth()) { Text("Save food") }
                          if (existing != null) {
                              TextButton(onClick = { confirmDelete = true }, modifier = Modifier.fillMaxWidth()) {
                                  Text("Delete food", color = MaterialTheme.colorScheme.error)
                              }
