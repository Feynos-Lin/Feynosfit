                          }
                      }
                      NumField(calText, { calText = it }, "Calorie goal (leave blank for recommended)", Modifier.fillMaxWidth(), decimal = false)
                      Text("Macros (% of calories)", style = MaterialTheme.typography.labelLarge)
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          NumField(pPct, { pPct = it }, "Protein %", Modifier.weight(1f), decimal = false)
                          NumField(cPct, { cPct = it }, "Carbs %", Modifier.weight(1f), decimal = false)
                          NumField(fPct, { fPct = it }, "Fat %", Modifier.weight(1f), decimal = false)
                      }
                      if (macroSum != 100) {
                          Text(
                              "These add up to $macroSum% — they need to total 100%.",
                              color = MaterialTheme.colorScheme.error,
                              style = MaterialTheme.typography.bodySmall,
                          )
                      } else if (built != null) {
                          val g = Calc.macroGrams(built)
                          Text(
                              "= ${g.first.f0()} g protein · ${g.second.f0()} g carbs · ${g.third.f0()} g fat",
                              style = MaterialTheme.typography.bodySmall,
                              color = MaterialTheme.colorScheme.onSurfaceVariant,
                          )
                      }
                      NumField(water, { water = it }, if (imperial) "Water goal (fl oz)" else "Water goal (ml)", Modifier.fillMaxWidth(), decimal = false)
                      NumField(stepsGoal, { stepsGoal = it }, "Daily steps goal", Modifier.fillMaxWidth(), decimal = false)
                  }

                  Button(onClick = { if (built != null) onSave(built) }, enabled = built != null, modifier = Modifier.fillMaxWidth()) {
                      Text(saveLabel)
                  }
                  if (built == null && macroSum == 100) {
                      Text(
                          "Enter your age, height and weight to continue.",
                          style = MaterialTheme.typography.bodySmall,
                          color = MaterialTheme.colorScheme.onSurfaceVariant,
                      )
                  }
                  Spacer(Modifier.height(24.dp))
              }
          }

