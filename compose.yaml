# Feynos Fit friends & challenges server.
#
# Include this file from your main compose.yaml:
#
#   include:
#     - Feynosfit/compose.yaml
#
# then run `docker compose up -d --build` from the folder with your main compose.yaml.
# Get the codes you need with:
#   docker exec feynos-fit-server /feynos-server signup-code       (app invite code)
#   docker exec feynos-fit-server /feynos-server admin-setup-code  (web admin panel)

services:
  feynos-fit:
    build: ./server
    image: feynos-fit-server:latest
    container_name: feynos-fit-server
    restart: unless-stopped
    ports:
      # App API, for your reverse proxy (Nginx Proxy Manager -> http://<this PC's LAN IP>:8095,
      # or http://feynos-fit:8095 if it shares a Docker network). Reachable on your home
      # network only; don't port-forward 8095 on the router — forward 443 to nginx instead.
      - "8095:8095"
      # Web admin panel: http://<this PC's IP>:8097 from your home network.
      # It refuses public internet addresses. Don't port-forward 8097 or proxy it.
      - "8097:8097"
    environment:
      TRUST_PROXY: "true"   # use the client IP your reverse proxy passes on
      ALLOW_SIGNUP: "true"  # or open/close sign-ups from the admin panel
      TZ: "America/Denver"
      # SIGNUP_CODE: "my-secret-invite"
    volumes:
      - feynos-fit-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64

volumes:
  feynos-fit-data:
    # Fixed name, so the data stays put no matter which compose file starts it.
    name: feynos-fit-data
