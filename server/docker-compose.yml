# Feynos Fit friends & challenges server
#
#   docker compose up -d                                      # start
#   docker compose pull; docker compose up -d                 # update to the newest image
#   docker exec feynos-fit-server /feynos-server signup-code  # invite code for new accounts
#   docker logs feynos-fit-server                             # logs
#   http://<server-ip>:8097                                   # web admin panel (home network only)
#
# Put HTTPS in front of it (Cloudflare Tunnel, your reverse proxy, or `tailscale serve`).
# The app refuses plain http:// addresses.

services:
  feynos-fit:
    image: ghcr.io/feynos-lin/feynosfit-server:latest
    # To build from this folder's source instead, replace the line above with: build: .
    container_name: feynos-fit-server
    restart: unless-stopped
    ports:
      # Only reachable from this machine. Your reverse proxy / tunnel connects to
      # http://127.0.0.1:8095. If your proxy runs in Docker on its own network, remove
      # this and attach both containers to the same network instead (see README).
      - "127.0.0.1:8095:8095"
      # Web admin panel. Reachable from your home network; it refuses public internet
      # addresses and needs a password. Do NOT port-forward 8097 or route it through
      # your tunnel/proxy. To allow only this machine: "127.0.0.1:8097:8097".
      - "8097:8097"
    environment:
      # Use the client IP your proxy forwards, so rate limits apply per person.
      # Only safe because the port above isn't exposed to the network directly.
      TRUST_PROXY: "true"
      # Set to "false" once everyone has an account.
      ALLOW_SIGNUP: "true"
      # Optional: choose the invite code yourself instead of a random one.
      # SIGNUP_CODE: "my-secret-invite"
      # Fast-food search keys (or paste them on the admin panel's Settings page):
      # FATSECRET_CLIENT_ID: ""
      # FATSECRET_CLIENT_SECRET: ""
      # Time zone for "today" in the admin panel.
      TZ: "America/Denver"
    volumes:
      - feynos-fit-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64

  # Optional: Cloudflare Tunnel (no open router ports). Create a tunnel in the Cloudflare
  # dashboard (Zero Trust > Networks > Tunnels), point its public hostname at
  # http://feynos-fit:8095, paste the token below, then uncomment.
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: feynos-fit-tunnel
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     TUNNEL_TOKEN: "paste-your-tunnel-token-here"
  #   depends_on: [feynos-fit]

volumes:
  feynos-fit-data:
